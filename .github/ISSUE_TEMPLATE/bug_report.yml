name: "🐞 Bug Report"
description: "Report a reproducible problem"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report — please fill in as much as you can so we can reproduce it.
  - type: checkboxes
    id: preflight
    attributes:
      label: "Pre-flight checks"
      options:
        - label: "I searched existing issues and this isn't a duplicate"
          required: true
        - label: "I'm on the latest version, or stated the commit below"
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened"
      description: "What went wrong?"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. ...
        2. ...
        3. the error you see
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
    validations:
      required: false
  - type: dropdown
    id: deploy
    attributes:
      label: "Deployment"
      options:
        - "Docker Compose (official DC key)"
        - "Docker Compose (self-hosted gateway)"
        - "Local from source"
        - "Other"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version or commit"
      placeholder: "e.g. v0.1.0 / c297cbc"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: "Environment"
      description: "OS & arch, Docker version, model gateway and models in use"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant logs"
      description: "Paste key logs; auto-rendered as a code block"
      render: shell
    validations:
      required: false
