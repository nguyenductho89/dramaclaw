name: "📝 Documentation"
description: "Report missing, outdated, or incorrect docs"
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: "Affected docs"
      description: "Page link or file path, e.g. docs/en/getting-started/quickstart.md"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Kind"
      options:
        - "Missing"
        - "Outdated"
        - "Incorrect"
        - "Unclear or confusing"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What's wrong"
      description: "What's missing, outdated, or incorrect"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "Suggested fix"
    validations:
      required: false
