name: "🔬 Failing or Flaky Test"
description: "Report a test that fails or is flaky"
labels: ["bug", "test"]
body:
  - type: input
    id: test-name
    attributes:
      label: "Test name"
      placeholder: "e.g. tests/test_newapi_text_gateway.py::test_xxx"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Kind"
      options:
        - "Consistently failing"
        - "Flaky"
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: "Where it fails"
      description: "Local / CI (link the run), branch or commit"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "Failure output"
      description: "Paste the failing test output"
      render: shell
    validations:
      required: true
