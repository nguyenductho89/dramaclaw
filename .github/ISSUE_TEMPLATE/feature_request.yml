name: "✨ Feature Request"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: "Pre-flight checks"
      options:
        - label: "I searched existing issues and Discussions"
          required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem or use case"
      description: "Describe the motivation and use case, not the solution"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives & context"
    validations:
      required: false
