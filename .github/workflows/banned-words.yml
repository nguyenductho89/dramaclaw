name: banned-words

# REPO-07: pre-release banned-words lint. External text containing "open source" (or its Chinese equivalent) exits 1.
# dramaclaw-ce is ELv2 source-available, not open source.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  banned-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint banned words
        run: python3 scripts/lint_banned_words.py
