name: Build and push RunPod worker image

# Manual only: these images are large CUDA builds and are deployed by hand to the RunPod
# serverless endpoints (see runpod/README.md for which endpoint uses which image).
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which worker image to build"
        required: true
        type: choice
        options:
          - qwen
          - h3
          - multishot
      tag:
        description: "Image tag (without the repository prefix)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: vars
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          case "$IMAGE" in
            qwen)      echo "image_name=photoreal-qwen-worker" >> "$GITHUB_OUTPUT" ;;
            multishot) echo "image_name=comfy-trends-h3-multishot" >> "$GITHUB_OUTPUT" ;;
            h3)        echo "image_name=photoreal-h3-worker" >> "$GITHUB_OUTPUT" ;;
            *)         echo "unknown image: $IMAGE" >&2; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # One shared build context so every image uses runpod/common/handler.py.
          context: runpod
          file: runpod/${{ inputs.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.image_name }}:${{ inputs.tag }}
