name: ce-import-lint

# REPO-08: import guard (import-lint, hard zero). Any import of
# novelvideo_ee / supertale_admin / novelvideo.control_plane in src/ or pyproject exits 1.
# Those capabilities may only be consumed through the novelvideo.ports.* abstraction, never imported directly.
# Pure standard library (ast/tomllib); no dependencies to install.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ce-import-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint forbidden imports
        run: python3 scripts/lint_ce_imports.py
