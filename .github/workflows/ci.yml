name: ci

# INFRA-01: CI foundation. Installs uv (dependency cache enabled, keyed on uv.lock), checks lockfile consistency,
# and installs dependencies from the lockfile. Dependencies include torch/cuda (~1GB): the first run fills the cache, later runs hit it.
# Reuses the installed dependencies within the same job to run ruff lint (required gate, existing violations baseline-exempted) + port-closure guard + pytest.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Verify lockfile is in sync with pyproject
        run: uv lock --check
      - name: Install dependencies (frozen, populates/restores cache)
        run: uv sync --frozen
      # REPO-09: port-closure guard (cp-port). Under ST_EDITION=ce every ports.* must be
      # satisfied by novelvideo.ports.local.* with no external adapters. Needs dependencies installed, so it hangs off the deps job.
      - name: Check port closure
        run: uv run python scripts/check_ce_port_closure.py
      # Lint: required merge gate that covers only new code; existing violations are baseline-exempted via per-file-ignores (see
      # pyproject [tool.ruff.lint.per-file-ignores]), cleaned up file by file and entries removed once fixed.
      # The rule set is frozen in pyproject and the ruff version is pinned in the dev dependency group, so CI and local use the same version.
      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .
      - name: Verify Workflow MCP contracts
        run: uv run python scripts/check_workflow_agent_contracts.py --json
      # Unit tests: pytest default addopts already excludes ee/e2e; -n auto runs in parallel via xdist.
      - name: Run tests
        run: uv run pytest -n auto

  # i18n ratchet: backend progress/log/toast messages facing the frontend must not gain new hard-coded non-English text.
  # Only the existing budget in scripts/backend_i18n_allowlist.json is recognized, and it can only go down, never up.
  # A pure AST scan needs no business dependencies, so it is a separate job and does not wait for deps to install torch.
  backend-i18n-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for hardcoded Chinese in backend user-facing copy
        run: python3 scripts/check_backend_i18n.py

  # Repo-wide "no Chinese" ratchet: only English and Vietnamese are supported.
  # Per-file line counts in scripts/no_cjk_allowlist.json may only shrink.
  no-cjk-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for new Chinese text
        run: python3 scripts/check_no_cjk.py
