name: dco

# REPO-19: every PR commit must contain Signed-off-by (DCO sign-off). A missing one fails the check and turns the PR red.
# For sign-off instructions see CONTRIBUTING.md and DCO.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check DCO sign-off
        run: |
          python3 scripts/check_dco.py \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --not origin/main
