name: dependency-review

# DEP-11: dependency license admission gate, two complementary layers:
# 1) dependency-review job: GitHub's official incremental review. For **new dependencies** in the PR diff,
#    it blocks strong copyleft via deny-licenses, covering manifests the Dependency Graph can index
#    (frontend pnpm-lock.yaml, etc.). Only meaningful in PR context; if the Dependency Graph
#    compare API returns 403 for this repository (not enabled/unavailable), the action is skipped.
# 2) python-deps job: full catch-all gate. After installing the whole environment from uv.lock it scans the license
#    metadata of all installed distributions (scripts/check_dependency_licenses.py), independent of GitHub's index,
#    and runs on both push and PR. Rules and exemptions are frozen inside the script; changes must go through a PR.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Dependency Graph support
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(
            gh api \
              "repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              --silent 2>&1
          )"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$output" | grep -q "HTTP 403"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Graph is not available for this repository; skipping dependency-review-action. python-deps still enforces DEP-11 for installed Python dependencies."
          else
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
      - name: Review new dependencies' licenses
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          # This gate covers licenses only (DEP-11); the vulnerability alert threshold is decided separately, to avoid one gate doing two jobs
          vulnerability-check: false
          license-check: true
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  python-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies (frozen)
        run: uv sync --frozen
      - name: Check dependency licenses
        run: uv run python scripts/check_dependency_licenses.py
