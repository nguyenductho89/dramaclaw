name: ee-terms

# REPO-10: banned package-name guard (hard zero). Any package name that does not belong to this repository in source/config/docs exits 1.
# Complements import-lint: import-lint catches import statements, while this guard catches the string/comment/doc/config level.
# Pure standard library + git; no dependencies to install.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ee-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # REPO-11: first validate that the unified allowlist (ce-allowlist.toml) is structurally complete with no rotten exemptions,
      # then run the EE sensitive-word lint that depends on it.
      - name: Validate CE allowlist
        run: python3 scripts/ce_allowlist.py
      - name: Lint forbidden package names
        run: python3 scripts/lint_ee_terms.py
