name: frontend

# Frontend CI. Consistent with frontend/Dockerfile: pnpm (packageManager pinned to 11.5.0) + node 22.
# Runs "build + type check" (pnpm build = tsc -b && vite build) and unit tests (vitest).
# Triggered only when frontend-related files change, to avoid empty runs for unrelated changes.

on:
  push:
    paths:
      - "frontend/**"
      - "scripts/check_frontend_i18n.py"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/check_frontend_i18n.py"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  # Hard-coded non-English text ratchet. Existing violations are cleared, so there is no allowlist file (a missing file equals an empty allowlist),
  # and any new hit fails directly. Lines that must keep such text get `// i18n-exempt`, and whole protocol value tables use
  # `// i18n-exempt-start` / `// i18n-exempt-end`.
  i18n-hardcoded-copy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for hardcoded Chinese copy in frontend/src
        run: python3 scripts/check_frontend_i18n.py

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build (tsc typecheck + vite build)
        run: pnpm build
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Validate rendered Nginx configuration
        run: docker build --target nginx-config-test --file Dockerfile .
