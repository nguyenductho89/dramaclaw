name: secret-scan

# SECRET-15: CI secret-scan gate. A hit exits 1 and serves as a required pre-merge gate.
# Installs and runs the gitleaks binary directly (not gitleaks-action, to avoid the org private-repo license requirement).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # fetch full history, but scan only commits reachable from the current SHA

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan reachable git history
        run: gitleaks git . --log-opts="${{ github.sha }}" -c .gitleaks.toml --redact --no-banner --exit-code 1
