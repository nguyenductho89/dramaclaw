# gitleaks config - dramaclaw-ce
# Default rules + one custom rule: credential keys assigned real values in env/config files
#   (NEWAPI_API_KEY / *_PASSWORD / *_TOKEN / *_SECRET / *_API_KEY).
#   Variable-name references and placeholders in .py / tests / docs / .env.example are allowed by default.
# The local pre-commit hook and the CI secret-scan share this config.

title = "dramaclaw-ce"

[extend]
useDefault = true

# Global allowlist (covers all rules, including the default generic-api-key): confirmed false positives.
# "3gs_combined" is the UI identifier of the freezone "3GS director composite image" input (key: "3gs_combined"),
# not a secret; generic-api-key misfires on the low-entropy key:"..." pattern. See verification-ledger 2026-06-29.
# "clarify-ws-key" is a stub bridge_key value in the chat route prewarm test fixture, not a secret.
# "happyhorse-1.0" is the public API model name of a video model, not a secret.
# Frontend test fixtures are the same: the custom rule's paths below follow Python conventions (tests/, *.py),
# and TS/JS-side __tests__/ and *.test.tsx match none of them, so the same synthetic fixtures
# are "quiet in Python, noisy in TypeScript". This fills in the frontend test directory conventions.
# `P0_GRAY_DISABLED` is the stable error code of the authorization port; only full expressions compared with a local variable are allowed,
# not bare values or historical fingerprints, so the same text in other contexts is not silently ignored.
[allowlist]
description = "Global allowlist: confirmed generic-api-key false positives (frontend UI input identifiers, frontend test fixtures, frozen cross-language signature vectors), not secrets"

# control-context-vectors.json must carry signing_key_hex: both ends must compute the same signature for the same
# message with the same key for the vectors to mean anything; without it the file proves nothing. The value is an artificially
# constructed descending sequence plus ascending bytes, never used for any real signature.
stopwords = ["3gs_combined", "clarify-ws-key", "happyhorse-1.0"]
paths = [
  '''(^|/)__tests__/''',
  '''\.(test|spec)\.[jt]sx?$''',
  '''(^|/)tests/data/control-context-vectors\.json$''',
]
regexTarget = "match"
regexes = [
  '''authz_error_code\s*==\s*["']P0_GRAY_DISABLED["']''',
  '''authz_failure\.code\s*==\s*["']P0_GRAY_DISABLED["']''',
]

[[rules]]
id = "env-credential-real-value"
description = "Credential key assigned a real value in an env/config file (suspected committed secret)"
regex = '''(?i)\b(NEWAPI_API_KEY|[A-Z0-9_]*(?:PASSWORD|SECRET|TOKEN|API[_-]?KEY|PRIVATE[_-]?KEY|ACCESS[_-]?KEY))\b\s*[:=]\s*['"]?([A-Za-z0-9][A-Za-z0-9_\-./+=]{7,})['"]?'''
keywords = ["password", "secret", "token", "api_key", "apikey", "access_key", "private_key", "newapi_api_key"]

  [rules.allowlist]
  description = "Allow code references, placeholders, test stubs"
  regexTarget = "match"
  regexes = [
    # Placeholder / example / test values
    '''(?i)(your[_-]|change[_-]?me|placeholder|example|dummy|sample|fake|redacted|secret_here|<[^>]+>|x{4,}|\bfoo\b|\bbar\b|\.\.\.|test[_-]?|root-key|old-key|new-key|rotated-key)''',
    # Code expression RHS (= os.getenv(...) / variable / attribute / function call)
    '''[:=]\s*['"]?\$?\{?\s*(os\.getenv|os\.environ|getenv|environ|_root_value|str\(|self\.|settings|config|request|headers|payload|value)''',
    # Bare identifier / attribute access as RHS (token=token, api_key=AgentSessionToken,)
    '''[:=]\s*[A-Za-z_][A-Za-z0-9_.]*\s*[,)\]:]?\s*$''',
  ]
  paths = [
    '''(^|/)tests?/''',
    '''(^|/)test_[^/]*\.py$''',
    '''[^/]*_test\.py$''',
    '''\.py$''',
    '''\.md$''',
    '''\.env\.example$''',
    '''\.lock$''',
  ]
