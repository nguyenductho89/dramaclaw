# pre-commit hooks - dramaclaw-ce (SECRET-14)
# One-time install:
#   uv tool install pre-commit
#   pre-commit install
# Manual full scan:
#   pre-commit run --all-files
# The hook automatically reads .gitleaks.toml at the repo root (including the newAPI custom rule).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: banned-words
        name: Banned words lint (open source)
        entry: python3 scripts/lint_banned_words.py
        language: system
        pass_filenames: false
        always_run: true
