# Unified guard allowlist (exemption list).
#
# Consolidates each linter's SKIP_PATHS / inline markers for central auditing: every exemption must state
# path / guards / reason, and the path must really exist
# (anti-rot check in tests/test_ce_allowlist.py: registering a nonexistent path fails).
#
# Not listed here: import-lint (scripts/lint_ce_imports.py) and cp-port (scripts/check_ce_port_closure.py)
# are deliberately "zero exemptions": any hit fails, with no escape hatch.

[marker]
# Append this comment to a matching line to allow it in place (shared by ee-terms / banned-words),
# for one-off legitimate references explained in place.
inline = "banned-word-allow"

[guards]
# Known valid guard names; the guards of a skip entry must come from here (guards against typos).
known = ["ee-terms", "banned-words"]

# ── ee-terms guard exemptions ────────────────────────────────────────────────
[[skip]]
path = "scripts/lint_ee_terms.py"
guards = ["ee-terms"]
reason = "The rules file itself lists all banned package names"

[[skip]]
path = ".github/workflows/ee-terms.yml"
guards = ["ee-terms"]
reason = "Workflow comments give examples of the banned package names"

[[skip]]
path = "ce-allowlist.toml"
guards = ["ee-terms"]
reason = "This allowlist may cite banned package names in reasons; prevents self-matching"

[[skip]]
path = "tests/test_env_config_ratchet.py"
guards = ["ee-terms"]
reason = "Cross-repo env audit test; legitimately references external package paths"

[[skip]]
path = "uv.lock"
guards = ["ee-terms"]
reason = "Generated dependency lock; this suffix is not scanned today, listed to avoid false hits if scanned suffixes are extended"

[[skip]]
path = "sbom.spdx.json"
guards = ["ee-terms"]
reason = "Generated SBOM enumerating the whole dependency tree; same reason as above"

[[skip]]
path = "license-inventory.csv"
guards = ["ee-terms"]
reason = "Generated license inventory; same reason as above"

[[skip]]
path = "scripts/lint_ce_imports.py"
guards = ["ee-terms"]
reason = "The import-lint rules file itself lists banned package names as detection targets (string rules, not imports)"

[[skip]]
path = "scripts/check_ce_port_closure.py"
guards = ["ee-terms"]
reason = "The cp-port check script itself lists banned package names as detection targets"

[[skip]]
path = ".github/workflows/ce-import-lint.yml"
guards = ["ee-terms"]
reason = "Workflow comments give examples of the banned package names"

[[skip]]
path = "tests/test_ce_imports_lint.py"
guards = ["ee-terms"]
reason = "import-lint test docstrings/data reference banned package names"

[[skip]]
path = "tests/test_ce_port_closure.py"
guards = ["ee-terms"]
reason = "cp-port test data references banned package names"

# ── banned-words guard exemptions ────────────────────────────────────────────
[[skip]]
path = "scripts/lint_banned_words.py"
guards = ["banned-words"]
reason = "The brand-word rules file itself mentions the banned wording"

[[skip]]
path = ".github/workflows/banned-words.yml"
guards = ["banned-words"]
reason = "Workflow comments explain that this gate checks brand wording"

[[skip]]
path = "frontend/THIRD-PARTY-LICENSES.txt"
guards = ["banned-words"]
reason = "Vendored compilation of third-party license texts; the upstream text contains wording such as open source/open standard, not self-description of this project"

[[skip]]
path = "DCO"
guards = ["banned-words"]
reason = "Standard legal text of the Developer Certificate of Origin 1.1 (Linux Foundation); the original contains open source license wording, cannot be changed, not self-description of this project"
