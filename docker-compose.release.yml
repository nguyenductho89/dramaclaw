# DramaClaw CE - image mode: all three services pull published images (no build). This is the single source of truth for the three-service runtime definition;
# docker-compose.yml (source build) reuses it through extends.
#   cp .env.example .env && docker compose -f docker-compose.release.yml up -d
# Versions: DRAMACLAW_VERSION (api/web) and DRAMACLAW_GATEWAY_VERSION (gateway) come from .env; when unset the defaults below are used;
#      every time a release package is built (the non-dry_run run of SuperTale's dramaclaw-release-packages), it opens a PR against this repo to bump the defaults. If pulls are slow in mainland China: set DRAMACLAW_IMAGE_PREFIX=claymore-registry.cn-chengdu.cr.aliyuncs.com/dramaclaw in .env (ACR only holds pinned tags).
# Three services: api + built-in newapi gateway (dramaclaw-gateway maintained by DramaClaw, :3000) + web (:8080).
# On first start open http://localhost:8080 -> Settings -> Models: choose "Official" and paste a DC key, or "Custom" to one-click initialize the built-in gateway, or "Local + official hybrid".
# The default mode is Official, in which case the built-in gateway just stays on standby; set NEWAPI_PROVISIONER_ENABLED=false in .env to disable one-click initialization.
services:
  api:
    image: ${DRAMACLAW_IMAGE_PREFIX:-claymorelab}/dramaclaw:${DRAMACLAW_VERSION:-2.0.4}
    restart: unless-stopped
    # At runtime model/LLM keys are injected from the host .env; the image version allows a missing .env (you can add it after the first start).
    # The environment: block still overrides same-named variables here, keeping CE inline mode enforced.
    env_file:
      - path: .env
        required: false
    environment:
      ST_EDITION: ce
      ST_CONTROL_PLANE_DSN: ""
      ST_REDIS_URL: ""
      ST_CELERY_BROKER_URL: ""
      ST_CELERY_RESULT_BACKEND: ""
      NOVELVIDEO_DATA_ROOT: /data
      NOVELVIDEO_OUTPUT_DIR: /data/output
      NOVELVIDEO_STATE_DIR: /data/state
      NOVELVIDEO_RUNTIME_DIR: /data/runtime
      DRAMACLAW_CHAT_BACKEND: "${DRAMACLAW_CHAT_BACKEND:-hermes}"
      HERMES_CLI_PATH: /root/.local/bin/hermes
      SUPERTALE_ALLOW_UNSANDBOXED: "1"
      # Which gateway is used at runtime is decided by the app setting (model_gateway_mode in settings.db); the CE gateway route does not fall back to env;
      # NEWAPI_BASE_URL is only a fallback, defaulting to the official address, consistent with main.js of the desktop app.
      NEWAPI_BASE_URL: "${NEWAPI_BASE_URL:-https://relayclaw.cdnfg.com/v1}"
      # The following four items are only for the provisioner (one-click initialization of the built-in gateway when the user switches to "Custom / Local + official hybrid"),
      # and compose forces them to override the 127.0.0.1 addresses in .env (which would be wrong inside the container).
      NEWAPI_ADMIN_BASE_URL: http://newapi:3000
      NEWAPI_SQL_DSN: local
      NEWAPI_SQLITE_PATH: /newapi-data/one-api.db
      NEWAPI_ADMIN_USERNAME: root
      # On by default; the user can turn it off by writing NEWAPI_PROVISIONER_ENABLED=false in the .env next to this file (compose interpolation reads .env).
      NEWAPI_PROVISIONER_ENABLED: "${NEWAPI_PROVISIONER_ENABLED:-true}"
      # Local dev-only: bridges a self-hosted WebAI-to-API Gemini service to generate character portraits (see
      # nanobanana_grid.py `_call_webai_chat_image_api`). That service only has /chat/completions,
      # has no OpenAI Images API, and returns images as private Google URLs, which need the same Playwright
      # cookie to download. Has no effect at all unless GEMINI_WEBAI_COOKIE_FILE_HOST is set (mounts /dev/null,
      # and the variable below stays empty), with zero impact on other users.
      GEMINI_WEBAI_COOKIE_FILE: "${GEMINI_WEBAI_COOKIE_FILE:-}"
    # Host published port is configurable so several stacks can run on one machine (change ST_API_PORT + the -p project name for each).
    # The 8780 to the right of the colon is the in-container port and is fixed (web reaches it over the internal network).
    ports:
      - "${ST_API_PORT:-8780}:8780"
    volumes:
      - ce-data:/data
      - newapi-data:/newapi-data
      - ${GEMINI_WEBAI_COOKIE_FILE_HOST:-/dev/null}:/run/secrets/gemini_webai_cookie.json:ro
    # Only wait for the gateway container to start, not to be healthy: official-mode users do not use the gateway, and a gateway that cannot be pulled / has a port conflict must not take down api.
    depends_on:
      newapi:
        condition: service_started

  # Built-in newAPI gateway (OpenAI compatible), a modified build maintained by DramaClaw, source at https://github.com/dramaclaw/dramaclaw-gateway .
  # By default it uses the SQLite in the newapi-data volume; DramaClaw automatically initializes the admin, run token, channels and model mappings through the shared volume.
  newapi:
    image: ${DRAMACLAW_IMAGE_PREFIX:-claymorelab}/dramaclaw-gateway:${DRAMACLAW_GATEWAY_VERSION:-v1.0.0-rc.24-dramaclaw.2}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # Empty = built-in SQLite (/data/one-api.db inside the container), the same file as /newapi-data/one-api.db on the api side.
      SQL_DSN: ""
    # By default bind to the local loopback only: the gateway's first-start setup page is open to anyone who can reach port 3000 until it is initialized.
    # To reach the gateway admin from another machine, set ST_NEWAPI_BIND=0.0.0.0 in .env.
    ports:
      - "${ST_NEWAPI_BIND:-127.0.0.1}:${ST_NEWAPI_PORT:-3000}:3000"
    volumes:
      - newapi-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/status >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # SPA served by nginx, reverse-proxying /api + /static to the api service.
  # The image's BACKEND_HOST/PORT defaults target the EE/Helm deploy; here
  # they are overridden to the compose `api` service (internal port 8780). Open
  # the app at http://localhost:8080 — the browser only ever talks to web.
  web:
    image: ${DRAMACLAW_IMAGE_PREFIX:-claymorelab}/dramaclaw-frontend:${DRAMACLAW_VERSION:-2.0.4}
    restart: unless-stopped
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: "8780"
    # This is the port the browser opens (default 8080). Change ST_WEB_PORT when running several stacks on one machine.
    ports:
      - "${ST_WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  ce-data:
  newapi-data:
