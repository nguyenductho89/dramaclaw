# DramaClaw CE - source build (default entry): api and web are built from the local checkout, the gateway from the adjacent dramaclaw-gateway checkout; all three are produced locally.
#   git clone https://github.com/dramaclaw/dramaclaw-gateway.git ../dramaclaw-gateway
#   cp .env.example .env && docker compose up -d --build
# The runtime definition (env / ports / volumes / healthchecks) is all extended from docker-compose.release.yml; this file adds build, local image names and source-runtime overrides.
# To just pull the published images: docker compose -f docker-compose.release.yml up -d
# The gateway source defaults to ../dramaclaw-gateway (a clone next to this repo; edit code there directly); if it lives elsewhere or you want Docker to pull straight from git:
#   set DRAMACLAW_GATEWAY_SRC=<path> or DRAMACLAW_GATEWAY_SRC=https://github.com/dramaclaw/dramaclaw-gateway.git#main in .env
# Locally built images are named dramaclaw-local/* and do not overwrite the published claymorelab/* images in the local cache.
services:
  api:
    extends:
      file: docker-compose.release.yml
      service: api
    image: dramaclaw-local/api
    # Source images include the pinned Codex runtime and the reviewed Hermes fork.
    environment:
      DRAMACLAW_CHAT_BACKEND: "${DRAMACLAW_CHAT_BACKEND:-codex}"
      HERMES_CLI_PATH: /usr/local/bin/hermes
    build:
      context: .
      dockerfile: Dockerfile
      # Slim image by default. For the 3DGS/SHARP "world" feature (torch/gsplat/sharp/da2 + SOG tools):
      #   INSTALL_WORLD=1 docker compose up -d --build
      # Note: weights are downloaded at runtime and not baked into the image; the slim base is CPU, GPU acceleration needs a CUDA base; Mac Docker has no GPU.
      args:
        INSTALL_WORLD: "${INSTALL_WORLD:-0}"
        # Keep the reviewed Hermes fork available for explicit fallback.
        HERMES_REPO: "${HERMES_REPO:-https://github.com/dramaclaw/hermes-agent.git}"
        HERMES_REF: "${HERMES_REF:-brainclaw/evidence-plane}"
  newapi:
    extends:
      file: docker-compose.release.yml
      service: newapi
    image: dramaclaw-local/gateway
    build:
      context: ${DRAMACLAW_GATEWAY_SRC:-../dramaclaw-gateway}
      dockerfile: Dockerfile
  web:
    extends:
      file: docker-compose.release.yml
      service: web
    image: dramaclaw-local/web
    build:
      context: ./frontend
      dockerfile: Dockerfile

# extends does not carry top-level volumes, so they are restated here (same names as the release file; the data volumes are shared).
volumes:
  ce-data:
  newapi-data:
