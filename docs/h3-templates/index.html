<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMax H3 - Thu vien template</title>
<style>
:root{--bg:#fff;--fg:#1c1d21;--mut:#686c78;--card:#f5f6f8;--line:#dfe1e6;--acc:#4f46e5;--code:#eceef2}
@media(prefers-color-scheme:dark){:root{--bg:#14151a;--fg:#e8e9ee;--mut:#9a9eab;--card:#1d1f26;--line:#2e313b;--acc:#8b87ff;--code:#101116}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{flex:1;min-width:180px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
.count{color:var(--mut);font-size:13px}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:16px;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.b.acc{color:var(--acc);border-color:var(--acc)}
p{margin:0;color:var(--mut)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.slot{border:1px dashed var(--line);border-radius:8px;overflow:hidden;background:var(--code);position:relative}
.slot img,.slot video{display:block;width:100%;height:100%;object-fit:cover}
.slot .ph{padding:8px;font-size:11px;color:var(--mut);word-break:break-all;display:flex;align-items:center;justify-content:center;text-align:center;height:100%}
.vid{aspect-ratio:var(--ar);max-height:420px;margin:0 auto}
.vid video{object-fit:contain;background:#000}
.slot .ph{padding:8px;font-size:12px;color:var(--mut);text-align:center}
.cap a{color:var(--acc)}
.nomedia,.cap{font-size:12px;color:var(--mut)}
.media .slot{aspect-ratio:1}
.inp{font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.inp code{color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
details>summary{cursor:pointer;color:var(--acc);font-size:13px}
pre{margin:6px 0 0;background:var(--code);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace;max-height:420px;overflow:auto}
.small{font-size:12px;padding:2px 8px}
</style>
</head>
<body>
<header>
<h1>MiniMax H3 &middot; Thu vien template Freezone</h1>
<div class="bar">
<input id="q" type="search" placeholder="Tim theo ten, mo ta, prompt...">
<select id="cat"></select>
<select id="mode"><option value="">Mọi mode</option><option>fl2va</option><option>flf2va</option><option>ref2va</option></select>
<select id="ar"><option value="">Mọi tỉ lệ</option><option>16:9</option><option>9:16</option></select>
<select id="src"><option value="">Mọi nguồn</option><option>pixo</option><option>fal</option><option>apimodels</option></select>
<button id="lang">VI / EN</button>
<span class="count" id="count"></span>
</div>
</header>
<div id="warn" hidden style="padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px">Video/ảnh mẫu chưa có trên máy này (không nằm trong git). Chạy <code>python scripts/fetch_h3_gallery_media.py</code> rồi tải lại trang.</div>

<script id="data" type="application/json">{"categories":["cinematic","brand","ecommerce","drama","animation","motion","ui","audio"],"templates":[{"id":"fal_space_opera","source":"fal","category":"cinematic","title":{"en":"Space opera teaser","vi":"Teaser space opera"},"description":{"en":"Fast hard cuts, white flashes and a warp jump ending on an animated title.","vi":"Cắt nhanh, chớp trắng, nhảy warp và kết bằng tiêu đề động."},"mode":"fl2va","genMode":"firstFrame","aspectRatio":"16:9","durationSec":10,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: starship command deck","vi":"First frame: buồng chỉ huy tàu vũ trụ"},"imagePrompt":"Cinematic wide shot inside a starship command deck, crew silhouettes at glowing consoles, red warning lights, a huge window showing a gas giant and stars, anamorphic widescreen, high contrast"}],"prompt":"For the target video, at 0.00 seconds into the target video, \u003cPicture 1> (from [Shot 1]) is fully referenced.\n\nintegrated_multimodal_description:\nEpic space opera teaser, anamorphic widescreen, high contrast, hard cuts only, no slow pacing.\n[Shot 1] A wide shot begins from \u003cPicture 1>: the command deck shakes, consoles flicker and sparks fall. The handheld camera shakes with it. At 1.20 seconds, a white flash fills the frame for two frames.\n[Shot 2] At 00:03.000, a hard cut to a close-up of the captain's face lit red, eyes locked on the window, then a second white flash.\n[Shot 3] At 00:05.000, a hard cut through one black frame to the exterior: the starship stretches into streaks of light in a warp jump, a ring shockwave expanding behind it.\n[Shot 4] At 00:07.500, the shot cuts to black. Wide-tracked metallic title letters reading ASCEND emerge from shadow, catch starlight, widen their spacing, leave a faint afterimage and flash once against black, then hold until the final frame.\n\noverall_soundscape:\nAlarm klaxons, a metal groan, deep impact booms on every flash, a rising warp whine cut dead by silence on the black frame.\n\nnon_diegetic_music:\nA fast percussive orchestral build with brass stabs and a choir, landing on one massive final chord as the title flashes.","media":{"video":true,"refs":["ref-1.webp"]},"credit":null},{"id":"fal_gateway_mystery","source":"fal","category":"cinematic","title":{"en":"Sci-fi mystery teaser","vi":"Teaser bí ẩn khoa học viễn tưởng"},"description":{"en":"Ultra-wide cosmic gateway, slow push-in, title resolving out of blur.","vi":"Cổng vũ trụ siêu rộng, đẩy máy chậm, tiêu đề hiện ra từ mờ."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":10,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: gateway establishing shot","vi":"First frame: cảnh toàn cổng vũ trụ"},"imagePrompt":"Ultra-wide cinematic shot of a gigantic circular cosmic gateway with a black center, a tiny figure seen from behind low and slightly right of center, wet reflective ground, dark crimson and rust palette, mist"},{"label":"\u003cPicture 2>","role":{"en":"Protagonist","vi":"Nhân vật chính"},"imagePrompt":"Full-body character sheet of a lone explorer in a weathered rust-colored coat and hood, seen from the back and three-quarter view, plain grey background"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the explorer, on the character sheet \u003cPicture 2>, with a weathered rust-colored hooded coat.\n\u003cPicture 1> is the first frame of [Shot 1], showing the gateway and \u003cSubject 1> small in the lower right.\n\nsummary:\n[keyframe completion + reference generation] A 10-second 16:9 mystery teaser that begins from \u003cPicture 1>, pushes slowly toward the gateway, and ends on a title card.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1]): fully_preserved - coat, hood and silhouette, seen only from behind.\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - gateway scale, wet ground and color palette.\n\ndetailed_description:\nDark, restrained sci-fi mystery look, heavy mist, crimson and rust tones, fine grain, no handheld shake.\n[Shot 1] The shot begins from \u003cPicture 1>: an ultra-wide view of the gateway with \u003cSubject 1> tiny at the lower right. The camera pushes forward very slowly. At 2.50 seconds, the black center of the gateway ripples once like water. At 5.00 seconds, a thin ring of pale light traces the gateway's edge and reflects across the wet ground.\n[Shot 2] At 00:07.000, a hard cut to black. A condensed, heavy all-caps title reading THRESHOLD resolves out of blur in dark crimson and rust, mist softening its edges, and holds until the final frame.\n\noverall_soundscape:\nA deep sub-bass pulse, a distant metallic resonance, one heavy hit exactly as the title locks, then silence.\n\nnon_diegetic_music:\nN/A","media":{"video":true,"refs":["ref-1.webp","ref-2.webp"]},"credit":null},{"id":"fal_fps_gameplay","source":"fal","category":"cinematic","title":{"en":"First-person tactical gameplay","vi":"Gameplay chiến thuật góc nhìn thứ nhất"},"description":{"en":"Handheld first-person advance along a base perimeter, quick checks, shots with light recoil.","vi":"Góc nhìn thứ nhất cầm tay tiến dọc hàng rào căn cứ, kiểm tra nhanh, bắn có giật nhẹ."},"mode":"fl2va","genMode":"firstFrame","aspectRatio":"16:9","durationSec":10,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: first-person view on the perimeter road","vi":"First frame: góc nhìn thứ nhất trên đường quanh căn cứ"},"imagePrompt":"Photorealistic first-person view of a soldier's gloved hands holding a rifle, standing on a military base perimeter road beside concrete barriers, cool daylight, haze and a little smoke in the distance"}],"prompt":"For the target video, at 0.00 seconds into the target video, \u003cPicture 1> (from [Shot 1]) is fully referenced.\n\nintegrated_multimodal_description:\nPhotorealistic first-person tactical shooter footage, eye-level handheld camera, crisp cool daylight mixed with drifting smoke and distant firelight, dust and haze in the air.\n[Shot 1] The shot begins from \u003cPicture 1>: the player advances slowly along the perimeter road, keeping close to the concrete cover on the left, the rifle bobbing with each step. At 2.00 seconds, a quick look right, then left, checking the corners. At 4.00 seconds, the player raises the rifle and fires three controlled shots at a distant target; light recoil kicks the view up slightly each time and brass casings flick past. At 6.50 seconds, the view settles and the player keeps moving forward, steady and unhurried, until the final frame.\n\noverall_soundscape:\nBoots on gravel, gear rattling, distinct rifle shots with a short distant echo, a faint ringing, wind and far-off engine noise.\n\nnon_diegetic_music:\nN/A","media":{"video":true,"refs":["ref-1.webp"]},"credit":null},{"id":"fal_macro_coffee_dunes","source":"fal","category":"cinematic","title":{"en":"Macro coffee to desert dunes","vi":"Macro cà phê thành đồi cát"},"description":{"en":"One continuous push-in: coffee foam becomes desert dunes with no cut.","vi":"Một cú đẩy máy liền mạch: bọt cà phê biến thành đồi cát, không cắt."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":8,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: coffee macro","vi":"First frame: macro cà phê"},"imagePrompt":"Extreme macro photograph of coffee foam with cocoa powder particles, swirling milky bubbles and caramel streaks, shallow depth of field, backlit powder in the air"},{"label":"\u003cPicture 2>","role":{"en":"Desert dunes","vi":"Đồi cát sa mạc"},"imagePrompt":"Wide landscape photograph of golden desert dunes with sharp wind-carved ridges, soft low sun, hazy horizon"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the coffee foam surface, on \u003cPicture 1>, with milky bubbles, cocoa particles and caramel streaks.\n\u003cSubject 2> is the desert dunescape, on the landscape sheet \u003cPicture 2>, with wind-carved ridges and warm golden sand.\n\u003cPicture 1> is the first frame of [Shot 1], an extreme macro of \u003cSubject 1>.\n\nsummary:\n[keyframe completion + reference generation] An 8-second 16:9 single continuous take that begins from \u003cPicture 1>, rushes in on \u003cSubject 1>, and morphs seamlessly into \u003cSubject 2>, finishing on a wide view of the dunes.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1]): fully_preserved - bubble texture and cocoa particles at the opening.\n\u003cSubject 2> (appears in [Shot 1]): attribute_transfer - ridge shapes and sand color become the closing landscape.\nNo tearing, no black frames, no hard cuts, no visible seams or obvious VFX.\n\ndetailed_description:\nPhotorealistic macro cinematography, shallow focus, backlit powder drifting through the light, one unbroken shot.\n[Shot 1] The shot begins from \u003cPicture 1>. The camera rushes forward fast over \u003cSubject 1>. At 2.00 seconds, the foam ridges stretch and the surface begins to look like dunes. At 3.50 seconds, the bubbles dissolve into sharp sand ridges as the scale silently grows. At 5.00 seconds, the camera pushes on and reveals the full dunes under a low sun. At 7.00 seconds, the camera settles on the wide landscape and holds until the final frame. There is no cut anywhere.\n\noverall_soundscape:\nA soft liquid fizz and spoon-clink tail that blends into a gentle desert wind and a faint hiss of sand.\n\nnon_diegetic_music:\nN/A","media":{"video":true,"refs":["ref-1.webp","ref-2.webp"]},"credit":null},{"id":"fal_costume_swap","source":"fal","category":"cinematic","title":{"en":"Stage illusion costume swap","vi":"Ảo thuật đổi trang phục trên sân khấu"},"description":{"en":"Two magicians' suit colors swap in the smoke; they bow and the curtain changes color.","vi":"Hai nhà ảo thuật đổi màu vest trong làn khói; cúi chào và rèm đổi màu."},"mode":"fl2va","genMode":"firstFrame","aspectRatio":"16:9","durationSec":10,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: two magicians on stage","vi":"First frame: hai nhà ảo thuật trên sân khấu"},"imagePrompt":"Two stage magicians side by side in a spotlight, the left wearing a black tuxedo with white gloves and the right wearing a white tuxedo with black gloves, red velvet curtain behind them, theatre stage"}],"prompt":"For the target video, at 0.00 seconds into the target video, \u003cPicture 1> (from [Shot 1]) is fully referenced.\n\nintegrated_multimodal_description:\nLive theatre footage, warm spotlights, red velvet curtain, a little stage haze.\n[Shot 1] A medium-wide shot begins from \u003cPicture 1>: the two magicians face the audience, the one on the left in a black tuxedo and the one on the right in a white tuxedo, both with gloves in the opposite color. The camera holds steady. At 1.50 seconds, they raise their arms and thick white smoke bursts around them. At 3.50 seconds, the smoke thins and the suits have swapped: the left magician now wears white, the right now wears black, while the glove colors stay exactly the same. At 6.00 seconds, they bow together. At 8.00 seconds, the red curtain drawn closed behind them shifts from deep red to dark blue, and the shot holds until the final frame.\n\noverall_soundscape:\nA drum roll, a soft burst of smoke, a short chime when the colors change, applause rising as they bow.\n\nnon_diegetic_music:\nLight playful stage-magic jazz with a muted trumpet and a walking bass.","media":{"video":true,"refs":["ref-1.webp"]},"credit":null},{"id":"fal_binocular_film","source":"fal","category":"brand","title":{"en":"Vintage binocular brand film","vi":"Phim thương hiệu qua ống nhòm cổ"},"description":{"en":"A fixed binocular lens mask while the view whip-scans through 4 keyframes with red typography.","vi":"Khung ống nhòm cố định, góc nhìn lướt nhanh qua 4 keyframe với chữ đỏ."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":12,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"Keyframe 1 / first frame: main installation","vi":"Keyframe 1 / first frame: tác phẩm sắp đặt chính"},"imagePrompt":"Photograph of a large red fabric art installation in an old plaza, seen through a black double-circle binocular mask, 35mm film grain"},{"label":"\u003cPicture 2>","role":{"en":"Keyframe 2: fabric in the wind","vi":"Keyframe 2: vải bay trong gió"},"imagePrompt":"Photograph of red fabric billowing in the wind with hand-painted lettering following the folds, seen through a black double-circle binocular mask, 35mm film grain"},{"label":"\u003cPicture 3>","role":{"en":"Keyframe 3: passerby walking","vi":"Keyframe 3: người qua đường"},"imagePrompt":"Photograph of a passerby in a beige coat walking and swinging their arms in an old plaza, seen through a black double-circle binocular mask, 35mm film grain"},{"label":"\u003cPicture 4>","role":{"en":"Keyframe 4: person adjusting glasses","vi":"Keyframe 4: người chỉnh kính"},"imagePrompt":"Photograph of a person adjusting their glasses and lifting their chin, seen through a black double-circle binocular mask, 35mm film grain"}],"prompt":"subject_definitions:\n\u003cPicture 1> is the first frame of [Shot 1], showing the main installation through a black double-circle binocular mask.\n\u003cPicture 2> is the keyframe at 3.00 seconds, showing red fabric in the wind with lettering following its folds.\n\u003cPicture 3> is the keyframe at 6.00 seconds, showing a passerby walking and swinging their arms.\n\u003cPicture 4> is the keyframe at 9.00 seconds, showing a person adjusting their glasses and lifting their chin.\n\nsummary:\n[keyframe completion + reference generation] A 12-second 16:9 voyeuristic brand film seen through a fixed binocular mask, beginning from \u003cPicture 1> and whip-scanning through \u003cPicture 2>, \u003cPicture 3> and \u003cPicture 4> in order.\n\nretention_analysis:\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - composition at the opening.\n\u003cPicture 2> ([Shot 1] keyframe): fully_preserved - composition reached at 3.00 seconds.\n\u003cPicture 3> ([Shot 1] keyframe): fully_preserved - composition reached at 6.00 seconds.\n\u003cPicture 4> ([Shot 1] keyframe): fully_preserved - composition reached at 9.00 seconds.\nNo added people, vehicles, buildings or logos; each composition is kept.\n\ndetailed_description:\nWes Anderson-inspired voyeuristic 35mm look with fine grain and halation. The black double-circle binocular mask stays perfectly fixed at frame center; only the view inside it moves.\n[Shot 1] The shot begins from \u003cPicture 1>, blurred at first with a slight handheld shake. The view pushes in and the focus racks sharp. At 1.50 seconds, a short exposure flicker. At 3.00 seconds, a fast whip-scan lands on \u003cPicture 2> and snaps into focus, the fabric rippling. At 4.50 seconds, a flicker and a hard cut at peak blur. At 6.00 seconds, the view snaps into focus on \u003cPicture 3>. At 7.50 seconds, another whip-scan. At 9.00 seconds, the view locks on \u003cPicture 4>. Short red sans-serif words fade in from blur over about half a second, slide only slightly, and fade out before the next scan. The final view holds until the end. No spinning or large fly-in text.\n\noverall_soundscape:\nA soft binocular focus-ring click, whooshes on each whip-scan, wind, faint plaza chatter.\n\nnon_diegetic_music:\nA quirky pizzicato-and-harpsichord waltz with light percussion.","media":{"video":true,"refs":["ref-1.webp","ref-2.webp","ref-3.webp","ref-4.webp"]},"credit":null},{"id":"fal_desert_fashion","source":"fal","category":"brand","title":{"en":"Desert fashion campaign","vi":"Chiến dịch thời trang sa mạc"},"description":{"en":"A woman takes a bag from a car trunk on a desert highway; closes on the brand mark.","vi":"Người phụ nữ lấy túi từ cốp xe trên đường cao tốc sa mạc; kết bằng logo."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":12,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: location and film texture","vi":"First frame: bối cảnh và chất phim"},"imagePrompt":"Cinematic photo of a vintage cream car parked on an empty desert highway at golden hour, open trunk, film grain, muted warm palette"},{"label":"\u003cPicture 2>","role":{"en":"Talent","vi":"Người mẫu"},"imagePrompt":"Fashion portrait of a tall woman with a sleek low ponytail in a minimal olive linen set and thin sunglasses, neutral studio background"},{"label":"\u003cPicture 3>","role":{"en":"Product: black bag","vi":"Sản phẩm: túi đen"},"imagePrompt":"Product photo of a structured black leather handbag with a gold clasp on a neutral background"},{"label":"\u003cPicture 4>","role":{"en":"Closing brand mark","vi":"Logo kết phim"},"imagePrompt":"A minimalist geometric brand mark in white on a solid sand-colored background, no text"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the woman, on the portrait sheet \u003cPicture 2>, with a sleek low ponytail, an olive linen set and thin sunglasses.\n\u003cSubject 2> is the black handbag, on the product sheet \u003cPicture 3>, with its exact leather, shape and gold clasp.\n\u003cSubject 3> is the brand mark, on \u003cPicture 4>.\n\u003cPicture 1> is the first frame of [Shot 1], showing the vintage car on the desert highway with the trunk open.\n\nsummary:\n[keyframe completion + reference generation] A 12-second 16:9 fashion campaign film that begins from \u003cPicture 1>: \u003cSubject 1> takes \u003cSubject 2> from the trunk, shares a quiet moment with a man beside the car, walks away with the bag, and the film closes on \u003cSubject 3>.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1], [Shot 2]): fully_preserved - face, hair and outfit.\n\u003cSubject 2> (appears in [Shot 1], [Shot 2]): fully_preserved - leather, shape and clasp.\n\u003cSubject 3> (appears in [Shot 3]): fully_preserved - mark shape and colors.\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - location, car and film texture.\n\ndetailed_description:\nElevated, cool and restrained but lively fashion film, muted warm  1> stay exactly the same.\n[Shot 1] The shot begins from \u003cPicture 1>: the vinyl robot gives a small bounce and its head tilts. At 1.50 seconds, the title types itself onto the bottom area one letter at a time with a light playful tick. At 3.50 seconds, the robot waves one arm and a glossy highlight sweeps across its body. At 5.50 seconds, small red stars pop out of the frame edge and settle, and the poster holds still until the final frame.\n\noverall_soundscape:\nA light, playful type-on tick for every letter that appears, soft toy squeaks, a tiny sparkle on the highlight.\n\nnon_diegetic_music:\nA cheerful, bouncy chiptune-style loop.","media":{"video":true,"refs":["ref-1.webp"]},"credit":null},{"id":"fal_game_equipment_ui","source":"fal","category":"ui","title":{"en":"Game equipment UI sequence","vi":"Chuỗi UI trang bị trong game"},"description":{"en":"Menu, arm customization, loading bar and open-world load-in, timed in seconds.","vi":"Menu, tùy biến cánh tay, thanh nạp và vào thế giới mở, chia theo giây."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":12,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: character on a purple floor","vi":"First frame: nhân vật trên nền tím"},"imagePrompt":"Overhead view of a cyberpunk heroine with a mechanical right arm standing on a glossy purple floor in an empty void, game-menu mood, soft neon rim light"},{"label":"\u003cPicture 2>","role":{"en":"UI style reference","vi":"Ảnh phong cách UI"},"imagePrompt":"Futuristic video game UI style sheet with neon cyan and purple panels, hexagon buttons, thin outline icons and loading bars on a dark background"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the heroine, shown in \u003cPicture 1>, with a mechanical right arm and a cyberpunk outfit.\n\u003cSubject 2> is the UI style, on the style sheet \u003cPicture 2>, with neon cyan and purple panels, hexagon buttons and thin outline icons.\n\u003cPicture 1> is the first frame of [Shot 1], a high overhead view of \u003cSubject 1> on a glossy purple floor.\n\nsummary:\n[keyframe completion + reference generation] A 12-second 16:9 game-interface sequence that begins from \u003cPicture 1>, moves through an equipment menu and arm customization, a loading bar, and loads into an open-world city street.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1] to [Shot 4]): fully_preserved - face, hair, outfit and mechanical arm design.\n\u003cSubject 2> (appears in [Shot 1], [Shot 2], [Shot 3], [Shot 4]): attribute_transfer - panel look, buttons and icon style only.\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - floor color and overhead framing.\n\ndetailed_description:\nSlick cyberpunk game-UI cinematography with neon cyan and purple accents, crisp holographic panels and smooth easing.\n[Shot 1] The shot begins from \u003cPicture 1>: a game menu appears in the style of \u003cSubject 2> and the cursor selects Continue. At 2.00 seconds, the camera pushes in to the right arm and an equipment panel slides in, the mechanical hand reconfiguring with glowing LEDs.\n[Shot 2] At 00:04.000, the camera arcs to the left: an armament grid appears and the left arm disassembles and reassembles section by section.\n[Shot 3] At 00:07.000, the camera pulls back as she confirms, the panels vanish and she relaxes her shoulders.\n[Shot 4] At 00:08.500, a loading bar fills along the bottom while the purple world darkens into golden light. At 10.00 seconds, a cyberpunk city street loads around her, the third-person camera settles, the HUD fades in, and she steps forward onto the street until the final frame.\n\noverall_soundscape:\nSoft UI blips on each selection, servo whirs and clicks as the arm reconfigures, a rising electronic swell on the loading bar, city ambience as it loads.\n\nnon_diegetic_music:\nA synthwave track with an arpeggiated bass that opens up into a melodic lead at the city reveal.","media":{"video":true,"refs":["ref-1.webp","ref- iption:\nPhotorealistic macro cinematography, shallow depth of field, warm low-angle key light from the left kept consistent throughout.\n[Shot 1] The shot begins from \u003cPicture 1>: an extreme macro of \u003cSubject 1>. The camera drifts forward and slightly down at a steady pace. At 1.50 seconds, the caramel streaks stretch into long curved lines. At 3.00 seconds, the bubbles flatten and their edges sharpen into wind-cut ridges as the scale silently grows. At 5.00 seconds, the foam has fully become \u003cSubject 2>; tiny sand grains slide down a ridge in the same direction the foam was turning. At 6.50 seconds, the camera rises to reveal the dunes reaching a hazy horizon, then holds steady until the final frame. No cut anywhere. There are no subtitles, captions, logos or watermarks anywhere in frame.\n\noverall_soundscape:\nA soft liquid fizz and spoon-clink tail that blends into a gentle desert wind and faint sand hiss.\n\nnon_diegetic_music:\nN/A","media":{"video":true,"refs":[]},"credit":null},{"id":"add_cast_member","source":"pixo","category":"cinematic","title":{"en":"Add a cast member to a scene","vi":"Thêm nhân vật vào cảnh có sẵn"},"description":{"en":"Keep the first frame's place and light; a new character from a sheet walks in.","vi":"Giữ nguyên bối cảnh và ánh sáng của first frame; nhân vật mới từ ảnh tham chiếu bước vào."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"9:16","durationSec":6,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame (connect as image 1)","vi":"Ảnh first frame (nối làm ảnh 1)"},"imagePrompt":"Cinematic vertical photo of an empty rain-wet street corner at night under a single yellow streetlight"},{"label":"\u003cPicture 2>","role":{"en":"New character sheet","vi":"Ảnh nhân vật mới"},"imagePrompt":"Character sheet of a person with short black hair and a beige trench coat, front, side and back views, plain background"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the new character, on the characte and button eyes, plain background"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the clay fox, on the style sheet \u003cPicture 2>, with its orange plasticine body, visible fingerprints and button eyes.\n\u003cPicture 1> is the first frame of [Shot 1], showing \u003cSubject 1> crouched behind a cardboard hedge in a miniature garden set.\n\nsummary:\n[keyframe completion + reference generation] An 8-second 16:9 stop-motion chase that begins from \u003cPicture 1>; \u003cSubject 1> bolts after a clay chicken across the miniature set.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1]): fully_preserved - clay texture, fingerprints, colors and proportions.\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - the handmade set, framing and lighting.\n\ndetailed_description:\nHandmade stop-motion animation at a stepped 12 frames per second cadence, slight frame-to-frame jitter, visible thumbprints on every clay surface, warm practical tabletop lighting.\n[Shot 1] The shot begins from \u003cPicture 1>: a low tabletop shot. The camera tracks right in small steps. At 0.70 seconds, a clay chicken waddles past the hedge. At 1.50 seconds, \u003cSubject 1> leaps out, ears flattening, body squashing and stretching. At 3.00 seconds, the chicken flaps and runs; felt grass tufts bounce under both. At 5.00 seconds, \u003cSubject 1> skids on a cotton-wool puddle and tumbles. At 6.50 seconds, \u003cSubject 1> sits up dazed with a little clay feather stuck on its nose and blinks twice, then holds still until the final frame. There are no subtitles, captions, logos or watermarks anywhere in frame.\n\noverall_soundscape:\nSquishy clay footsteps, a squawking chicken, a soft cartoon thump on the tumble.\n\nnon_diegetic_music:\nA bouncy pizzicato strings and xylophone chase tune at a fast tempo.","media":{"video":true,"refs":[]},"credit":null},{"id":"anime_title_sequence","source":"pixo","category":"animation","title":{"en":"Jazz-crime anime title sequence","vi":"Mở đ beat.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1], [Shot 2], [Shot 3], [Shot 4]): attribute_transfer - palette, outlines and halftone only.\n\u003cSubject 2> (appears in [Shot 1], [Shot 3], [Shot 4]): fully_preserved - silhouette, coat and tie.\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - framing at the opening.\n\ndetailed_description:\nRetro 1990s anime title-sequence look in the style of \u003cSubject 1>; stylish and cool, never horror, no gore, no repeated credits.\n[Shot 1] The shot begins from \u003cPicture 1>. The silhouette of \u003cSubject 2> lights a cigarette; the flame flares.\n[Shot 2] At 00:03.000, on the beat, a hard graphic wipe reveals a bold color-block split screen of rain on a neon street.\n[Shot 3] At 00:06.000, on the beat, \u003cSubject 2> turns sharply in a three-quarter view, coat swinging, against a flat blue background.\n[Shot 4] At 00:09.000, on the beat, the title ECHO slams in once in thick hand-painted letters over a freeze frame of \u003cSubject 2>, and holds until the final frame. No watermarks.\n\noverall_soundscape:\nRain hiss, a lighter flick, a short tire screech on the second wipe.\n\nnon_diegetic_music:\nA fast, brassy big-band jazz riff with walking upright bass and a snare fill before every transition.","media":{"video":true,"refs":[]},"credit":null},{"id":"voice_cloned_narration","source":"pixo","category":"audio","title":{"en":"Voice-referenced talking shot","vi":"Nói theo giọng tham chiếu"},"description":{"en":"A speaker delivers a message in the timbre of a voice sample, lip-synced.","vi":"Nhân vật nói theo âm sắc của mẫu giọng, khớp khẩu hình."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"9:16","durationSec":8,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame (connect as image 1)","vi":"Ảnh first frame (nối làm ảnh 1)"},"imagePrompt":"Vertical photo of a presenter with short grey hair, round glasses and a navy cardigan seated at a wooden desk in a cozy study"}, watermarks anywhere in frame.\n\noverall_soundscape:\nQuiet room tone, a pen set down on wood, a clock ticking softly.\n\nnon_diegetic_music:\nN/A","media":{"video":true,"refs":[]},"credit":null},{"id":"sound_designed_silence","source":"pixo","category":"audio","title":{"en":"Sound-designed silence","vi":"Khoảnh khắc lặng, thiết kế âm thanh"},"description":{"en":"A near-silent scene built around precise, timed sound cues.","vi":"Cảnh gần như im lặng, dựng quanh các tiếng động căn đúng thời điểm."},"mode":"fl2va","genMode":"firstFrame","aspectRatio":"16:9","durationSec":8,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame (connect as image 1)","vi":"Ảnh first frame (nối làm ảnh 1)"},"imagePrompt":"Wide cinematic photo of a librarian alone between tall wooden shelves at closing time, golden-hour light through tall windows, dust in the air"}],"prompt":"For the target video, at 0.00 seconds into the target video, \u003cPicture 1> (from [Shot 1]) is fully referenced.\n\nintegrated_multimodal_description:\nQuiet, intimate live-action film look, last golden-hour light through tall windows, dust in the air.\n[Shot 1] The shot begins from \u003cPicture 1>: a librarian alone between tall shelves at closing time, a wide shot at eye level. The camera holds still. At 0.80 seconds, she slides one last book onto a shelf with a soft wooden knock. At 2.20 seconds, a desk lamp at the far end clicks off by itself and she pauses, head turning. At 3.80 seconds, the old wall clock begins to strike once, deep and slow. At 5.20 seconds, she exhales, picks up her keys with a small jingle and walks toward the door. At 8.00 seconds, she stands at the door, one hand on the light switch, looking back at the empty room. Natural real-time speed. There are no subtitles, captions, logos or watermarks anywhere in frame.\n\noverall_soundscape:\nNear silence with a faint room tone; a book knocking wood, a lamp switch click, one deep clock chime, a key jingle, footsteps on old floorboards.\n\nnon_diegetic_music:\nN/A","media":{"video":true,"refs":[]},"credit":null},{"id":"apim_h3_mv_tokyo_neon","source":"apimodels","category":"audio","title":{"en":"Neon Tokyo Music Video (native stereo audio)","vi":"MV Tokyo neon (âm thanh stereo gốc)"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Music video. The soundtrack is a high-energy city-pop / synthwave track with a driving bassline, punchy live drums and a bright analog synth hook, playing continuously from the first frame. Neon-lit Tokyo backstreet at night in the rain. A young female singer in an oversized translucent raincoat performs straight to camera under a red izakaya lantern, singing the hook in sync with the music. Fast cuts landing on the beat: wide shot down the alley with neon reflected in puddles; tight close-up of her face with magenta rim light and rain on her cheek; low-angle push as she walks toward camera when the bass drops; quick insert of rain hitting a buzzing neon sign; back to a wide performance shot as the hook repeats. Anamorphic lens flares, shallow depth of field, 35mm film grain, teal and magenta palette, cinematic colour grade. No on-screen text.","media":{"video":true,"refs":[]},"credit":{"author":null,"authorUrl":null,"postUrl":null}},{"id":"apim_h3_wallpaper_aur","source":"apimodels","category":"cinematic","title":{"en":"Living Wallpaper: Aurora Lake (locked camera)","vi":"Hình nền động: hồ cực quang (khóa máy)"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Locked-off static camera. No zoom, no pan, no dolly, no parallax. Only ambient atmosphere moves: the aurora ribbons drift and undulate slowly across the night sky, thin low mist creeps gently across the lake, the water surface breathes with extremely subtle ripples while keeping the mirror reflection intact, faint stars shimmer. Calm, continuous, seamless ambient loop. Nothing enters or leaves the frame, no new objects, no people, no text.","media":{"video":true,"refs":[]},"credit":{"author":null,"authorUrl":null,"postUrl":null}},{"id":"apim_WJWKju1O","source":"apimodels","category":"ecommerce","title":{"en":"Pizza night UGC Domino’s vlog","vi":"Vlog UGC đêm pizza"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"VIDEO PROMPT — \"Pizza Night Vlog\" (UGC iPhone Style)\nDuration: 15 seconds | Aspect Ratio: 16:9 | Style: Authentic UGC / iPhone selfie-vlog, handheld, natural light, slight motion blur, TikTok/Reels energy — NOT cinematic, NOT overly polished. Feels like a real creator filmed this on their phone.\nProduct Reference: Use the uploaded Domino's Pepperoni Pizza image as the only product reference. Keep crust thickness, cheese texture, bake color, pepperoni placement, and proportions identical in every cut — no redesigning the pizza.\nCamera: iPhone 15 Pro front + back camera switching, handheld, natural wobble, autofocus hunting slightly (realistic), vertical-style framing cropped to 16:9, occasional finger near lens edge, natural room lighting + phone flash reflections on the pizza box.\nCharacter Description\nName (for reference): Mia\nAwoman in her mid-20s, naturally attractive and beautiful with an approachable, girl-next-door charm — not overly done up. Wavy sandy-blonde hair pulled back loosely, light natural makeup, wearing a cozy oversized cream sweater. Warm, genuine smile, expressive eyes, casual energetic personality like a real lifestyle vlogger. Sits in a softly lit modern kitchen/living room.\nShot Breakdown\nSHOT 1 (0–2s) — The Grab\nSelfie-angle, she's mid-laugh holding up the Domino's box to camera. Quick jump cut. Dialogue: \"Okay so it's officially pizza night—\"\nSHOT 2 (2–4s) — The Open\nCut to overhead handheld shot, box flips open, steam rising off the pizza, slight camera shake as she leans in.\nSHOT 3 (4–6s) — The Zoom\nQuick zoom-punch into the pizza, phone camera autofocus adjusts naturally, cheese and pepperoni in focus, ambient kitchen sounds.\nSHOT 4 (6–8s) — The Pull\nCut to her hands lifting a slice, natural cheese pull, filmed from a slightly low candid angle like a friend filming across the table.\nSHOT 5 (8–10s) — The Reaction\nCut back to selfie-cam, she takes a bite, eyes widen, quick genuine reaction. Dialogue: \"Oh my god, that's so good.\"\nSHOT 6 (10–12s) — The Candid Cutaway\nJump cut to a close, slightly shaky shot of the pizza box on the counter, her hand grabbing another slice off-frame, casual b-roll energy.\nSHOT 7 (12–14s) — The Wrap-Up\nBack to selfie angle, she grins at camera, holding slice up like a toast. Dialogue: \"Dominos, y'all know what to do.\"\nSHOT 8 (14–15s) — End Tag\nQuick freeze/cut to the box logo close-up, natural handheld wobble, soft text overlay in casual font: \"pizza night = solved 🍕\" — cut to black.\nLook & Feel\nWarm indoor lighting, slightly grainy natural phone sensor look, imperfect framing, real reactions, minimal dialogue (3 short lines total), authentic pacing with hard jump cuts instead of smooth transitions.\nNegative Prompt\ncinematic grade, overly smooth camera moves, studio lighting, professional voiceover, staged acting, CGI look, plastic cheese, distorted pepperoni, extra fingers, warped hands, text glitches, logo distortion, overly polished commercial feel.","media":{"video":true,"refs":[]},"credit":{"author":"@ShamiWeb3","authorUrl":"https://x.com/ShamiWeb3","postUrl":"https://x.com/ShamiWeb3/status/2082799917140197798"}},{"id":"apim_UlaetR_Y","source":"apimodels","category":"cinematic","title":{"en":"The World's Unluckiest Superhero","vi":"Siêu anh hùng xui xẻo nhất thế giới"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"A documentary about a superhero who has extremely bad luck and ends up saving people by accident through the destruction caused by his own misfortune. Dialogue in English. Scene direction with unique composition. Every cut, every camera angle, and every movement is of exceptionally high quality; the composition is guided by an experienced film director. The comedy is genuinely interesting, and throughout the 15 seconds everything unfolds in a perfectly crafted way, with a comedic payoff that can make anyone laugh.","media":{"video":true,"refs":[]},"credit":{"author":"@NACHOS2D_","authorUrl":"https://x.com/NACHOS2D_","postUrl":"https://x.com/NACHOS2D_/status/2082853567543615837"}},{"id":"apim_vgVluyQn","source":"apimodels","category":"animation","title":{"en":"Handcrafted paper-cut stop-motion short","vi":"Stop-motion cắt giấy thủ công"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"15-second cinematic stop motion animation in handcrafted paper cut style. Everything is physically assembled by invisible hands, one element at a time. Every object appears with authentic stop motion timing, tiny frame imperfections, subtle paper wobble, handmade placement, slight camera vibration, natural easing, tactile textures, soft shadows, and realistic depth. Nothing fades or morphs. Every piece is manually placed into the scene exactly like a professional stop motion production.\nScene begins with an empty dark navy paper background only.\n0-2s\nLarge crumpled blue paper sheets slide in from every edge and are pressed into place one after another, forming the underwater cave walls.\n2-4s\nPaper coral pieces appear individually from the bottom. Red coral, green seaweed, beige coral, pink coral, shells, pebbles and tiny bubbles are carefully placed one by one with visible handcrafted motion.\n4-6s\nThe glowing jellyfish is lowered from above. The bell lands first, then each tentacle is attached individually, gently bouncing. The jellyfish softly floats with slow natural stop motion movement.\n6-8s\nThe paper astronaut child slides into frame from the left. The body arrives first, then the helmet is placed on top with a tiny bounce. One arm rotates slightly as if reaching forward.\n8-10s\nThe white cat appears from below. The body is placed first, then the transparent helmet is carefully attached afterward. The tail makes a tiny handmade wiggle.\n10-12s\nSmall paper bubbles are added individually around both characters. Each bubble pops into place with slight stop motion jitter. The child and cat gently drift upward a few millimeters.\n12-15s\nThe complete underwater world comes alive. The jellyfish slowly pulses. Tentacles sway naturally. Sea plants lightly oscillate. Tiny bubbles continue rising. The astronaut child and cat subtly float together while holding position. Warm glow from the jellyfish softly illuminates nearby paper textures. Camera performs a slow cinematic push-in with realistic macro depth of field.\nPremium handcrafted stop motion, museum-quality paper art, tactile cardstock textures, realistic layered paper thickness, authentic frame-by-frame animation, tiny alignment imperfections, soft studio lighting, cinematic composition, macro photography, volumetric lighting, ultra detailed, emotionally warm, professional stop motion film, 15 seconds, no text, no watermark.","media":{"video":true,"refs":[]},"credit":{"author":"@AiMeowing","authorUrl":"https://x.com/AiMeowing","postUrl":"https://x.com/AiMeowing/status/2082964095410512241"}},{"id":"apim_h3_03_porto_fran","source":"apimodels","category":"cinematic","title":{"en":"Porto Francesinha Comedy Recipe","vi":"Công thức hài Francesinha ở Porto"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Style: \u003cimage_1> (don't reproduce the image, use it only as aesthetic reference)\nEdit: Comedy, fast paced, mixing close ups, medium shots and wide shots from uncanny and tilted angles. Super-imposed texts with doodles identify ingredients as they appear and add comic remarks.\nScene: In Porto, Portugal a crazy chef explains how to do a Francesinha in Portuguese from Portugal with Porto accent.","media":{"video":true,"refs":[]},"credit":{"author":"@imagineFERA","authorUrl":"https://x.com/imagineFERA","postUrl":"https://x.com/imagineFERA/status/2083172752790282615"}},{"id":"apim_h3_07_giant_koi_","source":"apimodels","category":"cinematic","title":{"en":"Giant koi park incident","vi":"Sự cố cá koi khổng lồ ở công viên"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"9:16","durationSec":15,"inputs":[],"prompt":"15-second, 16:9 vertical, continuous single-take video that looks like authentic smartphone footage accidentally captured by a passerby in a city park. Overcast natural daylight, subtle handheld shake, limited phone stabilization, occasional autofocus adjustment, and realistic smartphone compression. The absurd event is filmed with a completely serious, unscripted documentary feeling.  0–3s: [Handheld medium shot] A middle-aged man wearing a dark business suit and tie crouches beside the stone edge of a pond. With a completely serious expression, he slowly scatters pieces of bread from a paper bag to several ordinary koi. Small ripples spread across the water as the fish gather in front of him.  3–7s: [Camera instinctively moves closer] An abnormally huge orange-and-white koi suddenly surges out of the murky water, briefly lifting its upper body above the surface and biting down on the entire bread bag in the man’s left hand. He freezes for half a second, then grips the bag with both hands and leans backward. Startled, the person filming steps back. The image briefly loses focus before locking onto the man and the giant fish again.  7–11s: [Close handheld action shot] The giant koi pulls violently toward the deeper part of the pond. The wet paper bag stretches, the man’s arms tense, and his leather shoes slide repeatedly across the wet stone. His knee strikes the edge of the pond. He tries to brace himself with his right foot, but the sole loses traction and his center of gravity moves past the edge. Water, pieces of bread, and fallen leaves scatter from the force as the camera operator hurriedly moves sideways.  11–15s: [Impact and final hold] The paper bag suddenly tears. The man loses all support and pitches forward into the pond, creating one heavy, realistic splash. The camera quickly tilts downward while keeping the center of the pond visible. The man resurfaces with duckweed covering his head and his wet tie stuck across his face. The giant koi calmly swims past him with the remains of the bread bag still in its mouth. The camera holds on the man’s stunned expression while the koi casually swims away beside him.  Keep the man’s face, dark suit, tie, and paper bag visually consistent throughout. The koi must retain the same orange-and-white markings and enormous size. The pulling, sliding, loss of balance, and fall must show believable weight, inertia, traction, and water displacement. Natural park ambience and a realistic splash only. No dialogue, no subtitles, no music. Avoid cuts, character teleportation, changes in the fish’s size, extra limbs, and cartoonish acting.","media":{"video":true,"refs":[]},"credit":{"author":"@underwoodxie96","authorUrl":"https://x.com/underwoodxie96","postUrl":"https://x.com/underwoodxie96/status/2082747838782386563"}},{"id":"apim_QiPjtkD5","source":"apimodels","category":"drama","title":{"en":"1980s open-source family comedy","vi":"Sitcom gia đình mã nguồn mở thập niên 80"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Use the supplied image as the exact opening frame. Create a hilarious, high-budget 1980s live-action family comedy movie scene, photographed on a real soundstage with practical robot costumes, animatronics, handmade props, vintage wardrobe, and authentic 35mm film color.\nThe entire group suddenly hears something above them. Everyone’s eyes dart upward at the same moment. The men, women, children, and robots dramatically tilt their heads back, point toward the ceiling, and erupt into chaotic celebration. They gasp, scream, laugh, jump, wave their arms, slap each other on the shoulders, and completely lose their minds with exaggerated 1980s comedy reactions. The children bounce excitedly. The adults stumble into one another. The robots flash their eyes, flap their mechanical arms, spin clumsily, and celebrate with funny practical animatronic movements.\nOne man shouts:\n“OPEN SOURCE?!”\nThe entire crowd answers together:\n“MINIMAX H3!”\nThey cheer wildly as one robot attempts a victory dance, loses its balance, and is caught by the shocked family at the final second.\nFast, energetic comic timing with believable ensemble choreography. Begin with a brief locked group shot, then a subtle handheld push-in as the chaos escalates. Keep every original person, robot, shirt design, and the large headline clearly recognizable. Preserve facial identity, wardrobe, composition, lighting, and 1980s production design.\nAuthentic optical softness, warm tungsten lighting, rich film grain, slight gate weave, practical effects, natural motion blur, expressive physical acting, polished studio-comedy sound mix, triumphant synthesizer sting, cheering, robot beeps, and comedic percussion.\nNo CGI, no digital-looking robots, no morphing, no extra people, no duplicated characters, no distorted faces, no rewritten text, no spelling changes, no modern clothing, no style shifts, and do not turn the scene into animation.","media":{"video":true,"refs":[]},"credit":{"author":"@BrentLynch","authorUrl":"https://x.com/BrentLynch","postUrl":"https://x.com/BrentLynch/status/2083020024340693185"}},{"id":"apim_ewtr8LHd","source":"apimodels","category":"audio","title":{"en":"Would you like to dance","vi":"Muốn nhảy một điệu không?"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Would you like to dance?","media":{"video":true,"refs":[]},"credit":{"author":"@OrctonAI","authorUrl":"https://x.com/OrctonAI","postUrl":"https://x.com/OrctonAI/status/2082612279866986858"}},{"id":"apim_h3_01_nightclub_","source":"apimodels","category":"motion","title":{"en":"Nightclub Breakdance Camera Orbit","vi":"Breakdance hộp đêm, máy quay xoay quanh"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Use @ image1 as the visual bible. The board is a 16-image 4x4 storyboard shot\nburst, not a first frame and not a production-board layout. Create one cohesive\n15-second 16:9 multi-shot music-video b-roll clip as real cinematic nightclub\nfootage only.\nTranslate the 16-frame progression into one continuous acrobatic male\nbreakdance phrase: 0-3s establish the crowd circle, low fisheye master, top\nrock entry, and the start of a clockwise circular dolly orbit; 3-6s show crowd\nopening, drop to floor, six-step / three-step, and readable hand/foot floor\ncontact; 6-9s show CC / kick-out, sweep, power-move setup, and windmill or\nbackspin-like power motion; 9-12s hold the rotation through the second power\nbeat and catch a baby/chair freeze; 12-15s complete the orbit to the front,\nrelease into final footwork, land a decisive freeze/tableau, and show crowd\neruption.\nPreserve the board's central athletic male breaker, adult nightclub crowd\ncircle, glossy wet black floor, red backlight, acid green lasers, white strobes,\nblue haze, water mist, fisheye lens, and circular camera geography. The camera\nmay rotate around the dancer, but the movement must stay motivated and readable:\nlow circular dolly, Steadicam crowd-circle wrap, low tracking inserts, and\nfront-angle freeze completion. Avoid random flying camera, chaotic spinning,\nteleporting perspective jumps, losing the dancer, impossible acrobatics,\nduplicate limbs, foreground blockers, visible camera gear, text, logos, singer,\nor children.","media":{"video":true,"refs":[]},"credit":{"author":"@luisnomad","authorUrl":"https://x.com/luisnomad","postUrl":"https://x.com/luisnomad/status/2082754694250717186"}},{"id":"apim_h3_09_3x3_contac","source":"apimodels","category":"audio","title":{"en":"3x3 contact sheet female rapper grid performance","vi":"Nữ rapper biểu diễn lưới 3x3"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":12,"inputs":[],"prompt":"Use @Image 1 as the exact opening frame. It is a 3x3 contact sheet of nine separate portraits of the same female rapper, each in a different location. Treat every panel as its own live video cell with its own camera, lighting and performance. 12 seconds, 16:9.  Keep the grid absolutely fixed for the entire shot: identical panel positions, identical panel sizes, identical white gutters, no zoom, no pan, no rotation, no drift of the grid itself. Only the content inside each panel may move. Preserve each panel's identity exactly: same face, same hair, same wardrobe, same jewellery, same background as in @Image 1. Panel 1 stage with mic, panel 2 graffiti alley, panel 3 studio console with bandana, panel 4 rooftop with pink car, panel 5 roller shutter with bucket hat and chains, panel 6 purple club, panel 7 sunset rooftop with braids, panel 8 neon alley, panel 9 black backdrop close-up.  [0.0-1.2s] All nine panels sit almost still like breathing photographs, only micro-movement: hair drift, blinking, smoke, light flicker. A low sub-bass swell rises. [1.2-3.0s] The beat drops. Panel 1 raps to camera: \"MiniMax.\" Panel 5 answers: \"H3.\" The other seven nod on the beat. [3.0-5.0s] Panels 2, 3 and 7 trade the line one after another: \"New drop.\" Each one takes the beat, the rest bounce in rhythm. [5.0-7.5s] Panels 4, 6, 8 and 9 answer: \"Go and try it.\" Hands move, chains swing, ad-libs. [7.5-10.0s] All nine perform in unison, tightly lip-synced toH3, go and try it.\" [10.0-11.3s] The beat stops dead. In one synchronized move all nine raise a hand into a finger-gun aimed straight at the camera, chin down, hard contact. [11.3-12.0s] They fire the imaginary shot on a single low hit, a tiny recoil ripples through all nine panels at once, then freeze.                Audio: one continuous hip-hop beat across all panels, roughly 92 BPM, deep 808 sub, crisp trap hats, sparse hand claps. Female voice, confident, slightly playful, not aggressive. Layer nine slightly detunedn section for a choir effect. End on one low hit plus a shorttail of room tone.  Keep the lip-sync accurate to the words in every speaking panel. No subtitles, no on-screen text, no captions, no logos, no watermarks. No panel may drift, crossfade, resize or swap places. Do not add people. Dreen single shot at any point.","media":{"video":true,"refs":[]},"credit":{"author":"@lukasersil","authorUrl":"https://x.com/lukasersil","postUrl":"https://x.com/lukasersil/status/2082847686185672833"}},{"id":"apim__jCKIGId","source":"apimodels","category":"audio","title":{"en":"Beat-Synced K-Pop Multimodal MV","vi":"MV K-Pop đa phương thức khớp nhịp"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":3,"inputs":[],"prompt":"Make an MV from Audio1 . Show these Kpop members from Image1 singing and dancing to the music. Add coarse grain, glitch effects, and grunge effects. Keep the edit fast and use hard cuts only—no fades or soft transitions. Cuts should occur within 3 seconds. Make the cuts based on the beat of the song. Use the typographic reference from Image2","media":{"video":true,"refs":[]},"credit":{"author":"@aisearchio","authorUrl":"https://x.com/aisearchio","postUrl":"https://x.com/aisearchio/status/2082932693613043716"}},{"id":"apim_r_WwLFvz","source":"apimodels","category":"ecommerce","title":{"en":"Hip-Hop Character Lip-Sync Performance","vi":"Nhân vật hip-hop hát nhép"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"hip hop music video, make the character from @Video1 dance to the beat from music @Audio1 and he lip syncs in sync with @Audio1","media":{"video":true,"refs":[]},"credit":{"author":"@bennash","authorUrl":"https://x.com/bennash","postUrl":"https://x.com/bennash/status/2083065653104107776"}},{"id":"apim_skEJfBoO","source":"apimodels","category":"ecommerce","title":{"en":"Concrete-Plaza Kickflip Drop","vi":"Skateboard tiếp đất trên quảng trường bê tông"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"プロンプト\nSCENE CONTEXT Late afternoon, empty two-level concrete plaza. A young woman skateboarder rolls along the raised upper deck to its edge and launches off the TOP of a 10-step stair set with a kickflip, clearing the whole drop in one jump and landing on the lower plaza below. She travels downward from takeoff to landing.  ACTIVE REFERENCES @image1 — young woman skateboarder, long straight black hair with one bright cobalt-blue streak falling on the left side of her face, blunt fringe across the eyebrows, thin black winged eyeliner, freckles over both cheeks. 100% matches the reference.  LOCATION MAP Two levels. She rides the raised UPPER deck: pale polished concrete with black urethane scuff arcs. The upper deck ends at a hard edge, and that edge is the top step of a 10-step stair set descending away from her, chipped steel nosing, matte black handrail on the left. The LOWER plaza sits one human height below, flat open concrete, and is the landing. Beyond it: shuttered glass frontage receding into depth, haze 15% at 30 meters. Low sun at the far left, 15 degrees up, shadows raking left to right. Sunlit concrete warm bone-grey, stair treads cool blue-grey in shadow; the cobalt streak and the handrail carry the only saturated notes.  FIRST FRAME / BLOCKING Frame one is already moving: she is mid-push on the upper deck, right foot swinging back to the tail, board rolling camera-left to camera-right, camera beside her. Past her the deck edge cuts across frame and the lower plaza opens below it, so the ground visibly drops away in the direction she is heading.  FORMAT MODE Timed multishot, five beats. Cuts land only at 2.4s, 3.8s, 7.0s and 9.0s and the camera does not cut on its own.  OPTICS CUT 1 — LENS LOCK 180 degrees fisheye, barrel distortion, WS at wheel height. CUT 2 — LENS LOCK 84 degrees wide rectilinear, WS angled down over the edge. CUT 3 — LENS LOCK 47 degrees neutral, WS full profile of the descent. CUT 4 — LENS LOCK 63 degrees observational, MS to WS low on the landing. CUT 5 — LENS LOCK 18 degrees portrait compression, MCU. LENS CHECK at each cut: FOV as stated, no drift mid-segment.  CAMERA Operator on her right flank, the shadow side, half a beat behind her. CUT 1 — upper deck, glides at 22 km/h level with the trucks, 20 cm ride height, 1 to 2 cm handheld tremor. CUT 2 — upper deck behind her right shoulder, chest height, tilted DOWN 25 degrees so the stair descent and the landing fill the bottom half of frame. CUT 3 — right of the stairs at top-step height, tracking the descent at 3 km/h lateral, focus on the board. CUT 4 — lower plaza, 30 cm off the ground, tilted UP 20 degrees at the stairs above, rising 40 cm as she rolls out. CUT 5 — eye level, slow push from chest to face at 2 km/h.  ACTION 0.0s to 2.4s — CUT 1. On the upper deck she pushes twice, back foot slapping the deck and returning to the tail, rolling at 22 km/h toward the edge. Wheels rumble over the seams. The lower plaza is visible dropping away ahead of her. 2.4s HARD CUT 2.4s to 3.8s — CUT 2. From behind her, the 10-step drop and the landing lie in the lower half of frame. She sinks into a deep crouch, eyes down on the landing, slides her front foot to the bolts and snaps the tail down. The board pops and she leaves the top edge into open air above the steps, the ground now far beneath her feet. 3.8s HARD CUT 3.8s to 7.0s — CUT 3. Full profile of the descent, slow motion at 40 percent speed. She enters at the upper left of frame at the top step and travels down and to the right on a falling arc, the 10 steps passing beneath her, the landing waiting in the bottom right. Her front foot flicks off the nose edge and the board rotates one complete 360-degree roll along its long axis as she falls, knees tucked, arms wide. The griptape comes back under her feet and she catches it over the bolts, wheels aimed down. 7.0s HARD CUT 7.0s to 9.0s — CUT 4. Real time. She drops in from the top of frame, out of the air, and all four wheels bite the lower plaza at once with a hard slap. Her knees compress deep and absorb the drop, and she rolls away camera-right at 20 km/h, the stair set standing above and behind her. 9.0s HARD CUT 9.0s to 10.0s — CUT 5. Real time. Rolling out, she turns her head back over her left shoulder and looks UP at the stairs she came off, holds one beat, faces forward.  PERFORMANCE Pore-level skin realism, living eyes with a hard catch-light from the low sun. On the run-up her jaw is set, eyes down on the landing far below. On landing the impact travels through her shoulders, she blinks once, then exhales and her mouth lifts barely at one corner.  PHYSICS Real board mass: the deck flexes and rebounds on landing, wheels squash against the concrete. From the pop onward she only loses altitude, falling on a clean gravity parabola while forward inertia carries her out over the steps, touching down one human height lower and several meters further out than her takeoff point, gaining speed as she falls. The kickflip rotates at a constant rate. Contact shadows stay welded to the wheels on both levels and detach in the air, hair and fabric lagging above her as she drops.  LIGHTING Low sun as key from the far left at 15 degrees elevation, raking across the upper deck and rimming her left edge, the cobalt streak glowing where light passes through it. The stair treads sit in their own soft shadow while the lower plaza stays open and sunlit, so the two levels read as clearly separated heights. White balance 5600K, fixed across all beats.  WARDROBE Oversized faded black cotton tee flapping upward as she falls, baggy light-wash denim jeans with frayed hems over the heels, black canvas low-top skate shoes with the suede toe worn through from griptape.  AUDIO Lofi hiphop bed at 72 BPM throughout: dusty vinyl crackle, soft boom-bap kick and brushed snare, mellow jazz piano loop, warm bass. On top: wheels rumbling over seams, the crack of the tail on the top step, the board fluttering as it flips, a quiet beat of air as she falls, a hard slap as the wheels hit the lower plaza.  STYLE Photoreal live-action skate promo video, professional street skating footage, fine film grain, real motion blur on the wheels and the flipping board.  OUTPUT SETTINGS 8K, anamorphic 2.39:1, 24 fps. CUTS 1, 2, 4 and 5 real time. CUT 3 slow motion at 40 percent, constant for the whole beat.  POSITIVE LOCKS She starts on the upper deck and finishes on the lower plaza: takeoff at the top of the stairs, landing at the bottom, one human height below. Her motion is downward through the whole flight, entering each airborne frame high and leaving it low. The stair set stays exactly 10 steps and descends away from her direction of travel. The board completes one full 360-degree kickflip rotation and she lands with both feet over the bolts, rolling away upright past the bottom step. Screen direction stays camera-left to camera-right. Same rider, same face, same cobalt-blue streak, same wardrobe and same board in all five beats.","media":{"video":true,"refs":[]},"credit":{"author":"@eijo_AIart","authorUrl":"https://x.com/eijo_AIart","postUrl":"https://x.com/eijo_AIart/status/2082684613475082714"}},{"id":"apim__d8vdbcY","source":"apimodels","category":"motion","title":{"en":"Sunrise Wingsuit Canyon Run","vi":"Bay wingsuit qua hẻm núi lúc bình minh"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":3,"inputs":[],"prompt":"CANYON WINGSUIT THREAD WORLD BUILD A wingsuit pilot threading an impossible canyon route through ancient stone monuments during sunrise wind. Fear, precision, airspeed. LOOK BIBLE Ultra-wide cliff geography, warm edge light, cold shadows in canyon depth, fast ground blur, rock texture crisp near passes. HERO LOCK A female wingsuit pilot in matte black-and-copper suit, mirrored visor, compact oxygen rig. SOUND BED Wind shear, cloth tension, breathing through mask, stone flyby roar, pebble cascades from near misses. BEAT GRID 0–3s The camera drops with her off a sandstone arch into open canyon air, her body flattening into glide posture. 3–6s It locks just behind her shoulder as she skims a rock wall close enough to brush dust from it. The canyon splits ahead. 6–10s She angles through the narrower gap between two suspended stone bridges, sunrise blasting through the opening and turning the walls into streaks. 10–15s She flares hard above a hidden oasis basin and shoots through the center of a ruined archway, exiting into full gold morning light over still water. OUTPUT LOCKS No parachute deployment. Keep it pure wingsuit glide. Speed always readable.","media":{"video":true,"refs":[]},"credit":{"author":"@sebatheepan","authorUrl":"https://x.com/sebatheepan","postUrl":"https://x.com/sebatheepan/status/2082731549707927857"}},{"id":"apim_Lh35O3Cd","source":"apimodels","category":"motion","title":{"en":"Jetpack Dive Through a Mountain Gorge","vi":"Jetpack bay xuyên thung lũng"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Ultra-fast paced cinematic action sequence, a man in a sleek black tactical suit with advanced winged jetpack on his back, dramatic high-altitude jump from a towering cliff edge, immediately diving headfirst at extreme speed down a deep rocky mountain gorge with jagged cliffs blurring past, intense free-fall with wind and dust whipping around him, at the very last second he suddenly activates powerful rocket launcher boosters, bright orange flames and thrust exploding from the jetpack, sharp high-speed swap and barrel roll to the side avoiding the rocky wall by inches, then rocketing forward aggressively straight towards an enemy vehicle ahead, eyes focused and intense, dynamic motion blur, dramatic golden hour lighting, highly detailed, epic wide cinematic angle, over-the-top action style, intense energy, 8k","media":{"video":true,"refs":[]},"credit":{"author":"@Ankit_patel211","authorUrl":"https://x.com/Ankit_patel211","postUrl":"https://x.com/Ankit_patel211/status/2082794108998078815"}},{"id":"apim_cONprRmi","source":"apimodels","category":"cinematic","title":{"en":"Storm-Cliff Golf Physics Challenge","vi":"Thử thách vật lý đánh golf trên vách đá bão"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Minimax H3 Prompt\nA dramatic sports sequence begins on a lush, windswept coastal cliff during a violent rainstorm. A golfer in bright yellow rain gear stands on the tee box, gripping a driver. His stance is planted firmly, eyes locked on a distant green across a churning ocean cove. As he swings, the clubhead connects with a resounding crack, launching the dimpled white ball into the stormy sky. The camera immediately accelerates and locks onto the golf ball mid-flight. The camera tracks directly behind the spinning sphere, maintaining perfect alignment as it cuts through the driving rain. The ocean waves and dark clouds become a streaking motion blur while the ball remains sharp and centered. The howling wind roars as the projectile travels straight and true. The manicured green grows rapidly larger. In the final seconds, the camera closes in tightly as the ball strikes the turf. End on an extreme close-up of the ball ripping through the wet grass, throwing up a spray of dirt before dropping perfectly into the cup.","media":{"video":true,"refs":[]},"credit":{"author":"@Dheepanratnam","authorUrl":"https://x.com/Dheepanratnam","postUrl":"https://x.com/Dheepanratnam/status/2082799981426037151"}},{"id":"apim_jIfp_690","source":"apimodels","category":"ui","title":{"en":"Colorful Paint-Weapon Selection Screen","vi":"Giao diện chọn vũ khí sơn màu"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Use Image 1 for the character, Image 2 for the UI style, and use the uploaded weapon selection image as the reference for all paint weapons. The selectable weapons should closely match the colorful ink guns shown in the reference image, including compact paint shooters, dual paint pistols, heavy paint cannons, bucket/slosher weapons, large paint brushes, paint rollers, sniper-style paint rifles, and other stylized colorful ink weapons. Match their playful proportions, vibrant colors, chunky plastic construction, and game-like appearance while avoiding exact logos or branding.\n[0–2 seconds]\nHigh-angle overhead shot. The character stands on a vivid, highly saturated purple floor, looking up toward the camera, matching Image 1 exactly. A colorful game menu matching Image 2 appears on the right: START NEW GAME, CONTINUE (highlighted), SETTINGS, EXIT GAME. Player profile MINIMAX appears in the top left. The cursor selects CONTINUE.\n[2–4 seconds]\nThe camera pushes toward her right hand. A PAINT WEAPON SELECT panel slides in, using the uploaded weapon selection screen as its layout and visual reference. Multiple colorful paint weapons are displayed exactly like the reference image in a grid with rarity and level indicators. The cursor moves between different weapons. Every time a weapon is highlighted, the paint gun in her hands instantly transforms into the selected model with colorful ink particles, playful mechanical animation, spinning parts, and glossy paint effects. She remains standing throughout.\n[4–7 seconds]\nThe camera smoothly arcs around her left side. The selector rapidly cycles through many weapons from the reference image: compact paint shooters, oversized paint brushes, dual paint pistols, heavy paint cannons, bucket-style splash weapons, sniper paint rifles, giant paint rollers, and experimental ink launchers. With each selection, the weapon in her hands changes immediately to match the highlighted weapon while she naturally adjusts her grip. Every swap is accompanied by bursts of colorful ink, animated UI effects, splashing paint particles, and satisfying transition animations.\n[7–8.5 seconds]\nPull back to a medium shot. CONFIRM LOADOUT flashes. The cursor clicks it. All UI panels collapse and disappear. She confidently spins the selected paint weapon once before resting it on her shoulder, remaining in a relaxed standing pose.\n[8.5–10 seconds]\nA colorful LOADING bar fills from 0% to 100%. The purple testing room dissolves beneath spreading ink splashes that transition into the game world.\n[10–15 seconds]\nThe world loads into a bright, colorful ink-covered city filled with graffiti, paint-coated streets, animated billboards, moving NPCs, and playful architecture. The camera settles into a third-person view behind the character. HUD elements fade in: minimap, health, paint gauge, current weapon icon matching the selected weapon, ammo counter, and objective marker. She runs forward while firing the selected colorful paint weapon, coating walls, streets, obstacles, and scenery with thick, glossy paint that matches the weapon's color.","media":{"video":true,"refs":[]},"credit":{"author":"@craftian_keskin","authorUrl":"https://x.com/craftian_keskin","postUrl":"https://x.com/craftian_keskin/status/2082893990995619967"}},{"id":"apim_h3_04_fantasy_de","source":"apimodels","category":"ui","title":{"en":"Fantasy Deck-Builder Battle UI","vi":"Giao diện đấu bài fantasy"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Use Image 1 for the board, art direction, and lighting. Use Image 2 for the exact UI style — preserve its card shape, filigree, colors, and iconography.\n[0–2s] Slow isometric drift across the courtyard. The card fan deals in from the bottom edge, five cards arcing into place one at a time with a slight overshoot and settle. The energy orb fills to 3.\n[2–5s] Cursor lifts the second card; it scales up, tilts toward camera, and glows. Dragging it over the left enemy paints three hex tiles red with a soft pulse. Release — the card burns from the bottom edge upward and dissolves into embers.\n[5–8s] Camera snaps to a low three-quarter angle for the resolution: a shockwave crosses the three red hexes, damage numbers arc up and fade, one skeleton shatters into bone fragments that settle physically on the tiles.\n[8–11s] Return to isometric. Energy drops to 1. The remaining cards slide left to close the gap. Cursor hovers END TURN; the button pulses gold.\n[11–15s] Enemy turn: a red banner wipes across the top of frame, the surviving skeletons step two hexes forward with staggered timing, and a threat marker appears over the player unit. The banner wipes out. Cards deal in again for the next turn. Keep all UI perfectly screen-locked and crisp regardless of camera movement. Text must be legible and spelled correctly.\nAudio: parchment card slides, a wooden clack on card placement, a low bone-crunch impact, a soft chime on energy spend, muted lute drone underneath.\nNegative: no UI drift or warping, no invented card names, no misspellings, no gore, no blood, no camera shake during UI interaction.","media":{"video":true,"refs":[]},"credit":{"author":"@AllaAisling","authorUrl":"https://x.com/AllaAisling","postUrl":"https://x.com/AllaAisling/status/2082909383424446745"}},{"id":"apim_3nP8YjGb","source":"apimodels","category":"cinematic","title":{"en":"Explorer and Cat in a Floating Eco-City","vi":"Nhà thám hiểm và mèo ở thành phố sinh thái bay"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Ultra cinematic AAA adventure game trailer, one continuous seamless camera shot, Unreal Engine 5 quality, hyper realistic, 60 FPS, cinematic lighting, premium animation, realistic physics, smooth transitions, no text, no logo.  The camera begins behind a young silver-haired explorer and his fluffy orange cat standing together on a giant ancient tree branch overlooking a breathtaking futuristic nature city in the year 2100. Giant waterfalls flow through floating islands, enormous glowing trees surround eco-friendly futuristic towers, flying drones move naturally between the trees, distant floating platforms connect the landscape, soft volumetric sunlight fills the valley, leaves gently drift through the air, birds fly across the sky, mist slowly rolls through the forest.  Far away, a colossal ancient guardian peacefully walks through the valley between giant trees, partially hidden by fog, creating mystery and wonder.  The explorer and his cat quietly observe the distant guardian.  After two seconds, the explorer slowly raises his left hand.  He gently touches the glowing wrist device on his arm.  A soft circular pulse of blue light expands through the air.  Elegant transparent holographic interface panels smoothly appear around him with premium glass animation.  The interface feels futuristic, clean and luxurious.  Panels gracefully float into position using smooth spring motion.  Explorer Inventory.  Adventure Gear.  Explorer Suit.  Accessories.  Energy Tools.  Skills.  Artifacts.  Companion Gear.  Quest Journal.  Player Statistics.  Beautiful holographic cards slowly rotate in space.  Crystal accessories sparkle.  Energy gadgets softly glow.  Explorer suit pieces rotate in three dimensions.  Energy bow slowly turns with animated light effects.  The cursor appears naturally with smooth realistic movement.  It selects the glowing Energy Bow.  The selected card enlarges slightly.  The bow transforms into blue light particles and gracefully flies
