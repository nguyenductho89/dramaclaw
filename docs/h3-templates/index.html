ucted\nDuration: 15 seconds | Aspect ratio: 16:9 | Style: 2D anime fantasy, detailed cel-shaded animation\nSCENE\nTribal huntress with fiery red-orange hair, bone necklace, fur-trimmed bracers, and strapped sandals. Massive white feline beast with backward-curving ridged horns and golden eyes. Dense, mossy ancient forest with thick branches.\nSHOT BREAKDOWN\n0-4s — High-angle. Huntress crouches silently on a thick tree branch, gripping a vine. The giant white beast prowls directly beneath her.\n4-8s — Low-angle extreme close-up of a massive clawed paw stomping down, kicking up dirt. Cut to beast looking up as huntress clings to the tree trunk.\n8-12s — Profile shot. Huntress drops onto a lower branch facing the creature. Mid-air action shot as she leaps aggressively toward its face, hair and clothing whipping in the wind.\n12-15s — Top-down bird's-eye view. Huntress lands in the dirt clearing directly before the beast. A circular shockwave of dust ripples outward from her impact.\nCAMERA\nDynamic anime framing. Mix of high-angle establishing shots, extreme low-angle close-ups, and mid-air tracking. Fast, rhythmic action cuts. \nLIGHTING & PALETTE\nDappled sunlight filtering through canopy. High-contrast shadows. Deep forest greens, fiery orange, bone white, and earthy browns.\nAUDIO\nForest ambience, heavy thudding footsteps, rustling foliage, dramatic orchestral action music, sharp impact boom upon landing.\nAVOID\nPhotorealism, 3D render style, modern elements, on-screen text, sluggish pacing.","media":{"video":true,"refs":[]},"credit":{"author":"@akakuma0219","authorUrl":"https://x.com/akakuma0219","postUrl":"https://x.com/akakuma0219/status/2082796505417801823"}},{"id":"apim_2v6IWQSt","source":"apimodels","category":"cinematic","title":{"en":"Sci-Fi Cyborg Confrontation","vi":"Đối đầu nhân vật sci-fi giữa đổ nát"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Use @Image1 as the cloaked avenger identity lock and wardrobe reference. Use @Image2 as the environment, lighting, and street layout reference. Use @Image3 as the cyborg executioner identity lock, armor design, and weapon reference.\nCreate a 15-second ultra-cinematic confrontation in the ruined streets of Sector 7 at night. Heavy ashfall, wet pavement, orange emergency lights, smoke columns, and reflective industrial architecture strictly follow @Image2. The cloaked avenger from @Image1 faces the red cyborg executioner from @Image3 in the center of the empty street. Maintain facial features, wardrobe, armor geometry, and environment consistency across all shots. No onscreen text, no floating letters, clean visuals.\n0–4s: Wide establishing shot. The cloaked avenger from @Image1 walks slowly through the rain-dark street toward the cyborg from @Image3. Camera performs a slow push-in. Coat edges move in the wind, boots splash through shallow water, ash drifts through orange backlight.\n4–8s: Medium close-up on @Image1. He stops, lifts his chin slightly, and says clearly in English: “Long time I was looking for you.” Deliver slowly, low, and intense, with precise lip-sync. Camera holds a subtle handheld drift. Wet hood, tired eyes, and grim determination remain consistent with @Image1.\n8–11s: Medium close-up on @Image3. The cyborg tilts its head, red visor brightening, and replies in a cold metallic voice: “finally”. Deliver with a short pause before the word and precise mouth-panel synchronization. Servo motion, red eye glow, and armored posture strictly follow @Image3.\n11–15s: Sudden action payoff. Whip pan into a dynamic wide shot as @Image3 ignites the red energy blade and lunges forward. @Image1 instantly draws his blade and rushes to meet the attack. They collide at center frame in a shower of sparks, rain spray, and reflected orange-red light. End on a dramatic frozen impact moment with crossed blades, smoke and ash swirling around them, camera orbiting slightly into a powerful hero frame. Gritty cinematic realism, strong contrast, volumetric haze, realistic body momentum, normal proportions without stretch.","media":{"video":true,"refs":[]},"credit":{"author":"@LudovicCreator","authorUrl":"https://x.com/LudovicCreator","postUrl":"https://x.com/LudovicCreator/status/2082519983842595100"}},{"id":"apim_sPdFdQWo","source":"apimodels","category":"animation","title":{"en":"Cartoon Skater on Fiery Wheels","vi":"Người trượt ván hoạt hình trên bánh xe lửa"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 16:9 | Style: 2D animated cartoon, vibrant flat colors, thick outlines, comic book style\nSCENE\nRed-haired man with a scowling expression. He wears a yellow puffer jacket with a green fur hood and smiley face patches, blue jeans, and mismatched high-top sneakers (one pink/purple, one yellow/green). Setting: stylized city street with brightly colored buildings, clear blue sky, puffy white clouds, and a distant clock tower.\nSHOT BREAKDOWN\n0-4s — Skater rides down the street, trailing stylized blue and yellow flames from the skateboard wheels. Framed as a low-angle tracking shot beside him.\n4-8s — Skater continues riding past colorful storefronts, including a green shop with a \"BAD OZA\" sign. The camera tracks slightly ahead.\n8-12s — Extreme close-up on the mismatched sneakers on the skateboard deck. Thick blue and yellow flames erupt dramatically from the wheels.\n12-15s — Cut to a high-angle tracking shot behind the skater, following him down the center of a dashed road toward the clock tower.\nCAMERA\nDynamic tracking movement. Utilizes low-angle profile shots, cuts to an extreme close-up, and finishes with a trailing shot. Smooth, continuous forward momentum.\nLIGHTING & PALETTE\nFlat, bright daytime illumination. Highly saturated color palette. Dominant bold colors: mustard yellow, cyan, vibrant red, emerald green, and neon pink.\nAUDIO\nRolling skateboard wheels on asphalt, rushing wind, and the crackling whoosh of fire. Fast-paced punk-rock instrumental music. \nAVOID\nPhotorealism, 3D rendering, CGI shading, muted tones, static camera, soft edges, realistic proportions.","media":{"video":true,"refs":[]},"credit":{"author":"@whorange__","authorUrl":"https://x.com/whorange__","postUrl":"https://x.com/whorange__/status/2082870195845275923"}},{"id":"apim_PbLPsK2D","source":"apimodels","category":"animation","title":{"en":"Surreal 3D Cartoon Traveler","vi":"Lữ khách hoạt hình 3D siêu thực"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Use [Ref_Image1] as the strict character identity, design, wardrobe, color and multi-angle reference. Its six views depict the same traveler. Reconstruct one coherent 3D character without averaging or redesigning his face. Preserve exactly the crescent-shaped face, amber eyes, midnight-blue hair, proportions, mustard-yellow suit, ivory shirt, teal scarf, burgundy shoes and floating black bowler hat shown in [Ref_Image1] throughout the video.\n👤 CHARACTER\nThe original stylized cartoon traveler from [Ref_Image1] has a tall slender silhouette, expressive crescent-shaped face and large curious amber eyes. Keep his identity, proportions, colors and clothing perfectly consistent.\n🌌 WORLD\nA whimsical Dalí-inspired surreal desert at golden hour, rendered as a premium 3D cartoon. Vast peach-colored sand, an impossibly curved turquoise horizon, long-legged houses walking slowly in the distance, floating doorframes, liquid staircases, stretched shadows, cloud-shaped fish and soft clock-like flowers bending in the breeze. Original imagery, not a recreation of any existing artwork.\n🎬 15-SECOND ACTION\n0–2s: A shadow peels itself away from the traveler’s feet, bows to him and becomes a moving staircase. He reacts with delighted surprise.\n2–5s: The traveler steps onto the staircase as it glides across the desert; floating doors open onto tiny upside-down oceans.\n5–9s: He returns to the sand and walks beneath extremely tall houses whose windows blink like sleepy eyes. His floating hat circles his head once.\n9–12s: Gravity tilts; the horizon curves upward and he walks sideways while cloud-fish swim overhead.\n12–15s: He opens a freestanding door and discovers the opening shot inside. He steps through as it closes, creating a seamless loop.\n📷 CAMERA\nSmooth side-tracking camera with subtle dolly movement, one continuous shot, no hard cuts, strong layered parallax, 35mm cinematic perspective and stable character scale.\n✨ STYLE\nElegant surrealist cartoon, rounded expressive shapes, hand-painted textures, premium stylized 3D animation, playful impossible physics, warm peach, mustard, teal and burgundy palette, cinematic golden light, gentle film grain, 24fps.\n🎵 MUSIC AND SOUND\nOriginal instrumental LoFi: mellow vinyl crackle, dusty boom-bap drums, warm Rhodes chords, soft upright bass and dreamy reversed guitar at 78 BPM. Synchronize the shadow, doors, orbiting hat and final closure to the beat. No vocals or recognizable melody.\n🔒 CONSISTENCY\nExactly one traveler. No identity or wardrobe changes, extra limbs, malformed hands, duplicate character, text, logos, watermark, flicker, abrupt cuts or photorealistic elements.","media":{"video":true,"refs":[]},"credit":{"author":"@PromptSin","authorUrl":"https://x.com/PromptSin","postUrl":"https://x.com/PromptSin/status/2082549084381126957"}},{"id":"apim_Dnechdff","source":"apimodels","category":"cinematic","title":{"en":"Avant-Garde Kinetic Fashion Lookbook","vi":"Lookbook thời trang chuyển động tiên phong"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 16:9 | Style: High-fashion editorial lookbook with bold kinetic typography\nSCENE\nFemale model with sleek hair wearing avant-garde structural fashion, including oversized blazers, metallic armor, and sharp-shouldered dresses. Backgrounds alternate between concrete brutalism, glowing metallic tunnels, and minimalist photo studios. Giant text overlays integrate with the environment.\nSHOT BREAKDOWN\n0-4s — Model in an oversized black suit poses against concrete pillars and a red industrial corridor. Framed center. Floating text reads: \"DON'T BLINK\" and \"BREAK THE RULES\".\n4-8s — Model struts through a red metallic tunnel in a white and silver futuristic corset, then poses in a stark split-tone studio. Framed medium-wide. Text reads: \"NO APOLOGIE\" and \"MAKE THEM\".\n8-12s — Model wears a reflective silver top against a dark glitch backdrop, then walks strictly in profile in a white and silver suit across a seamless white void. Text reads: \"6411\", \"LOUDER LOUDER LOUDER\", and a halftone \"NO\".\n12-15s — Model poses in a sharp-shouldered emerald green outfit in front of a torn-poster wall, then stands motionless within a dismantled photo studio setup. Wide framing. Text reads: \"WE DON'T MISS\", \"4:0:21.18.1 1:2:3:8\", \"OWN THE NIGHT\", and \"UNSTOPPABLE\".\nCAMERA\nLocked-off center framing, strict linear tracking, rapid rhythmic smash cuts.\nLIGHTING & PALETTE\nHigh-contrast studio flash, harsh directional spotlights. Dominant palette: stark white, deep black, metallic silver, crimson red, emerald green.\nAUDIO\nHeavy electronic bass beat, rhythmic camera shutter clicks, sharp metallic swooshes.\nAVOID\nSoft focus, warm natural sunlight, organic environments, slow crossfades, shaky handheld camera.","media":{"video":true,"refs":[]},"credit":{"author":"@zahra4sure","authorUrl":"https://x.com/zahra4sure","postUrl":"https://x.com/zahra4sure/status/2083536105068966324"}},{"id":"apim_5JWn8QGK","source":"apimodels","category":"cinematic","title":{"en":"When Paint Becomes Reality","vi":"Paris kỳ ảo vẽ bằng cọ"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Hyper-realistic cinematic fantasy spectacle, 15 seconds, 16:9, IMAX quality, ultra-detailed, vibrant realism, breathtaking scale, seamless transformations, no dialogue.\nThe first frame: a street artist stands in an ordinary alley in Paris, painting a simple line on a blank wall. The paint begins glowing and moving like it is alive.\nThe painted line grows into a giant tree that bursts from the wall and spreads across the city. Painted waves flow out of the artwork and transform the streets into a glowing ocean. Painted stars escape the wall and fill the sky. Every brushstroke changes reality.\nThe artist walks through a world being created by their imagination. Buildings become floating palaces. Murals transform into portals. Painted creatures step into the real world. Entire landscapes emerge from simple strokes of color: enchanted forests between skyscrapers, futuristic cities above the clouds, and impossible worlds hidden inside the artwork.\nThe camera moves fluidly through the creation process: extreme close-ups of paint transforming into reality, fast tracking shots through newly created worlds, sweeping aerial shots above the changing city, dramatic rotations around the artist, and huge cinematic reveals.\nFinal shot: the artist steps back from the wall. Paris has transformed into one enormous living masterpiece — a fantasy world created from their imagination.","media":{"video":true,"refs":[]},"credit":{"author":"@AllaAisling","authorUrl":"https://x.com/AllaAisling","postUrl":"https://x.com/AllaAisling/status/2082605010588778527"}},{"id":"apim_G49dhOAR","source":"apimodels","category":"cinematic","title":{"en":"Infinite Cycle of the Blade","vi":"Vòng lặp vô hạn lưỡi kiếm gãy được rèn lại"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"9:16","durationSec":15,"inputs":[],"prompt":"@image1\n15s | 16:9 | 1440p | 24fps | SEAMLESS LOOP\n[LOCK] Render exactly as @image1. Do not alter hair, bangs, eye color, coat silhouette, sash, hilt ornament, or blade proportion.\n[LOOP] A perfect cycle. The final frame must match frame one exactly — same composition, focal length, lighting, blade position and pose — so playback runs endlessly with no seam. The story is a blade breaking and unbreaking forever.\n[PALETTE] Background: smooth vertical gradient, luminous cyan-teal #2AA6B4 top into deep petrol #0F4A55 bottom — a graphic plane, no environment, no horizon, no props. Coat bright coral #FF9273. Inner garment #14454E. Hair true black with blue-white highlights. Metal and glass bright silver-white. Accents as refracted light ONLY, never flat fill: gold #FFD27A, cyan #6FE3F5, magenta #FF9ED8. Core palette always dominates.\n[STYLE] 2.5D anime, bright cinematic. High-key, generous bloom, crisp speculars, luminous not grim. Skin luminous with subsurface warmth at ears and fingertips. Coat as heavy matte cotton twill, deep folds. Hair in clumped strands with flyaways catching the rim. Glass with real thickness — edge refraction, internal fracture lines, micro-scratches.\n[EFFECTS] Escalating: time-echo ghosting trailing every fast move, each afterimage a different accent; liquid mercury flow as the blade sets; kaleidoscope fracture splitting the frame into mirror symmetry; shockwave refraction warping the background and bending the type; one-frame negative invert on hard impacts; glass-crack frame wipes; reverse-gravity debris; prismatic dispersion off every shard edge casting moving caustics across her face and coat.\n[CAMERA + LIGHT] Anamorphic — oval bokeh, blue streak flares, slight barrel distortion wide. 85mm close, 35mm wide, 24mm on moves. 180-degree shutter. Shallow focus on hero beats, deep on montage frames. Rack focus blade-to-eyes at 2.4s and 14.2s. Hard sun key from screen right, high and behind — bright rim on jaw, shoulder and blade edge. Broad cyan bounce fill off the background plane. Kicker thrown by the shards, hue shifting each beat. Shadows open, never crushed. Brightest at 10.4, back to the opening state by 15.0.\n[SIGNATURE] A fine engraved mark sits on the blade's ricasso above the hilt, small letter-spaced capitals cut into steel, catching the key light as the camera races past in the opening shot. Part of the blade, not an overlay — present in frame one, in the final frame, and on the reforged blade at 14.4s.\n[SHARDS] Vary reflected content shard to shard: blue sky with cumulus, sunlit golden farmland, a low sun with lens flare, a fragment of her own face, pure white cloud. A few reflect a beat that has not happened yet. Never blank glass.\n[TYPE] Behind her on the gradient plane. Condensed sans for Latin, brush-weight for Japanese. Gradient fill, soft glow, hard offset shadow. Kinetic — slams, scrolls, shatters, warps under shockwaves. Never covers her face. Japanese runs VERTICAL in a side third; Latin STACKED, two lines max, cropped by frame edge for scale. Six timed title beats at 0.8s, 2.2s, 5.0s, 7.2s, 10.6s and 13.2s, the last fully dissolved before 15.0.\n[SHOTS]\n0.0-1.6 LOOP POINT. Extreme close-up racing along the blade flat toward the hilt, clouds streaking on steel, flare sliding down the edge, the engraved mark passing through frame. Blade detonates. Glass-crack wipe.\n1.6-3.2 BULLET-TIME ORBIT. Time freezes on the detonation; camera arcs 180 degrees through the suspended shard field, threading between fragments, debris hanging in reverse gravity. Motion resumes as the arc completes.\n3.2-4.8 TOP-DOWN CRANE. Bird's eye directly above; shards lock edge-on into a ring around her, then the camera drops fast down the vertical axis into a low hero angle as the ring fires outward.\n4.8-6.6 MIRROR PORTAL, one take, no cut. Camera pushes into the reflection inside a single shard, passes through, emerges behind her at a new angle. Time-echo ghosts trail her lunge.\n6.6-8.4 SPIKE. Kaleidoscope fracture splits the frame into sixfold symmetry, resolves, and duplicates of her peel out of the shard surfaces, each trailing a different accent. Max two of her in frame. Extreme dutch angle.\n8.4-10.4 SAKUGA MONTAGE. One exchange per frame: line-art on flat cyan, two-color coral-teal silhouette, heavy smear frame, one-frame negative invert, full render. Debris accumulates, never resets.\n10.4-12.4 ESCALATION. Camera barrel-rolls a full 360 pushing in low. A shard catches an incoming strike, splits it into spectrum, fires it back doubled — the shockwave warps the background and bends the type.\n12.4-15.0 REVERSAL. Literal time reversal in slow motion. Debris rises, cracks close, light retreats, shards spiral back along her arm and flow together as liquid mercury before setting into one unbroken blade, the engraved mark resolving last. Camera eases into the exact opening framing. Final frame matches frame one.\n[MOTION] Momentum over posing. Cloth, hair and coat lag every direction change. Wrist and grip rotate with the blade, weight carries through footwork. Speed ramp each beat — slow wind-up, fast snap, settle. No stiff, held or unnatural joint angles.\n[AUDIO] Every cue on the exact frame of its beat. The mix loops as cleanly as the picture. Bed: open air, bright wind, thin sustained glass resonance.\n0.0-1.6 rising metallic ring, crystalline detonation on the break frame.\n1.6-3.2 filtered vacuum for the frozen orbit, faint chimes and a low drone panning with the arc, rush as motion resumes.\n3.2-4.8 hard glass snap on the lock frame, deep whoosh on the drop, wide fan of air as the ring fires.\n4.8-6.6 pressure drop entering the shard, muffled interior tone, sharp release on the exit.\n6.6-8.4 stuttering echo as the kaleidoscope splits, sub-bass swell, one chime per duplicate.\n8.4-10.4 staccato impacts locked frame-for-frame to the cuts, glass cracking, blade screech, hard gate on the invert frame.\n10.4-12.4 doppler roll following the barrel turn, spectral riser on the split, doubled bright impact out.\n12.4-15.0 the mix runs in reverse — reversed chimes, glass reassembling, liquid metallic pour, resolving into the opening ring.\nMusic: glass bells and plucks in at 3.2, strings rise at 6.6, choir swell peaks at 10.4, reversing from 12.4 back into its first note. No dialogue.\n[LIMITS] Max two figures. Accents as refracted light only. Effects accumulate until the reversal. All type carries its gradient. First and last frame identical, no floating type in either. No logos, watermarks, or extra subtitles. No environment. Never let the frame go dark or desaturated.","media":{"video":true,"refs":[]},"credit":{"author":"@Cia0_exe","authorUrl":"https://x.com/Cia0_exe","postUrl":"https://x.com/Cia0_exe/status/2083090068378616089"}},{"id":"apim_yZSj0xtj","source":"apimodels","category":"ecommerce","title":{"en":"Fresh Picks Food Commercial","vi":"Quảng cáo thực phẩm tươi"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"9:16","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 9:16 | Style: Dynamic studio food commercial\nSCENE\nAssorted styled food items (loaded fries, tomato mozzarella toast, strawberry waffle, yogurt bowl, pastel ice cream, pasta salad) on geometric, diagonally color-blocked surfaces.\nSHOT BREAKDOWN\n0-4s — Opens with a flat-lay wide shot of six dishes arranged on cream, navy, and green diagonal blocks. Cuts to a macro shot of steaming loaded fries as red seasoning falls onto white sauce.\n4-8s — Cuts to a close-up of tomato and cheese toast in a black baking pan. Fresh basil leaves fall onto the toast against a diagonal red and cream background.\n8-12s — Close-up of a waffle as syrup pours over fresh strawberries against a pink background with bokeh. Transitions to a yogurt and fruit bowl with floating cereal and blueberries as honey streams down.\n12-15s — Rainbow sprinkles fall onto a pastel ice cream cone topped with whipped cream and a cherry. Concludes with a flat-lay of five dishes on blue, pink, and white diagonal blocks. Legible text reads \"FRESH PICKS\" at the top and \"made for today\" at the bottom right.\nCAMERA\nLocked-off static framing. Mix of top-down flat lays and eye-level macro close-ups. Fast-paced rhythmic cuts matching the falling ingredients.\nLIGHTING & PALETTE\nBright, hard studio lighting creating sharp, directional drop shadows. Vibrant, high-contrast palette utilizing bold color-blocked backgrounds (navy, pastel pink, powder blue, cherry red, cream).\nAUDIO\nSnappy, upbeat commercial pop music. Foley includes sizzling, thick liquid pouring, and the light clattering of falling herbs, cereal, and sprinkles.\nAVOID\nMessy plating, soft lighting, muted colors, camera panning, handheld movement, cluttered backgrounds.","media":{"video":true,"refs":[]},"credit":{"author":"@thisismariaa25","authorUrl":"https://x.com/thisismariaa25","postUrl":"https://x.com/thisismariaa25/status/2083194269867663690"}},{"id":"apim_cUiTwSIH","source":"apimodels","category":"ecommerce","title":{"en":"Dove Pure Softness Commercial","vi":"Quảng cáo Dove mềm mại tinh khiết"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 16:9 | Style: High-end beauty commercial, photorealistic\nSCENE\nBlack woman, natural hair updo, white plush bathrobe. Luxury bathroom setting, marble vanity, large mirrors, chrome sink fixtures, white flowers, bright window with outside greenery.\nSHOT BREAKDOWN\n0-4s — Close-up on a white Dove soap bar and box resting on wet marble beside white flowers. The word \"PURE\" is visibly traced into the mirror condensation in the background.\n4-8s — Medium shot. The woman lathers the soap in her hands over the chrome sink. Bold white 3D text \"SOFTNESS\" hovers directly above the counter.\n8-12s — Close-up profile. The woman massages thick white soap foam onto her face. Floating 3D text \"CARE\" tracks with her soapy cheek. She then admires her clean face in the mirror as the text \"REFRESH\" appears on the glass.\n12-15s — Medium close-up. She smiles brightly at the camera, holding the Dove box beside her face. Large overlaid graphic text reads: \"Dove SOFTNESS YOU CAN FEEL. CARE YOU CAN TRUST.\"\nCAMERA\nSmooth slow push-ins. Shallow depth of field on macro product shots. Gentle, evenly paced commercial editing.\nLIGHTING & PALETTE\nSoft diffused daylight, warm mirror backlighting. Bright, clean palette of pure whites, marble greys, rich brown skin tones, and navy blue accents.\nAUDIO\nGentle water splashing, thick soap lathering friction. Soothing, upscale ambient spa instrumental music.\nAVOID\nHarsh shadows, cluttered countertops, deformed floating text, unnatural foam textures, rapid camera movements.","media":{"video":true,"refs":[]},"credit":{"author":"@IsabellaHan_","authorUrl":"https://x.com/IsabellaHan_","postUrl":"https://x.com/IsabellaHan_/status/2083606664209424824"}},{"id":"apim_dVRT4G0c","source":"apimodels","category":"ecommerce","title":{"en":"UGC Style Burger Review Vlog","vi":"Video review burger kiểu UGC"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Duration: 15 seconds | Aspect Ratio: 16:9 | Style: Authentic UGC / iPhone selfie-vlog, handheld, natural light, TikTok/Reels aesthetic.\nProduct Reference: Use the uploaded gourmet burger image as the only product reference. Preserve the bun shape, patty thickness, cheese melt, lettuce, tomato, sauces, and proportions exactly in every shot.\nCharacter Description\nName: Hana\nA young Japanese woman in her early 20s with natural beauty, long dark hair in a loose ponytail, oversized cream sweatshirt, minimal makeup, bright smile, friendly lifestyle-vlogger personality.\nShot Breakdown\nSHOT 1 (0–2s) — Selfie showing the burger box.\nDialogue: \"Burger night!\"\nSHOT 2 (2–4s) — Opens the box.\nSHOT 3 (4–6s) — Quick zoom on the burger.\nSHOT 4 (6–8s) — Hands lifting the burger with cheese stretching naturally.\nSHOT 5 (8–10s) — Bite reaction.\nDialogue: \"Okay... that's incredible.\"\nSHOT 6 (10–12s) — Casual close-up b-roll while reaching for fries.\nSHOT 7 (12–14s) — Toasting the burger toward the camera.\nDialogue: \"You need this.\"\nSHOT 8 (14–15s) — Freeze frame with overlay: \"burger cravings = solved 🍔\"\nLook & Feel\nWarm apartment lighting, genuine phone footage, slight grain, natural autofocus breathing, handheld imperfections, fast jump cuts.\nNegative Prompt\ncinematic grading, commercial production, CGI burger, fake cheese, distorted hands, warped food, perfect stabilization, studio lighting, text glitches, logo distortion.","media":{"video":true,"refs":[]},"credit":{"author":"@oggii_0","authorUrl":"https://x.com/oggii_0","postUrl":"https://x.com/oggii_0/status/2083436822085165289"}},{"id":"apim_5ByBjvqF","source":"apimodels","category":"cinematic","title":{"en":"Flight of the Neon Sprite","vi":"Chuyến bay của tinh linh neon"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"9:16","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 9:16 | Style: 3D animated sci-fi fantasy\nSCENE\nSmall, furry red creature with a feline face, glowing cyan horns, and translucent cyan wings. Futuristic nocturnal city featuring sweeping, curved metallic skyscrapers. Calm, mirror-like waterway. Starry night sky displaying a vibrant Milky Way.\nSHOT BREAKDOWN\n0-4s — Creature speeds past sleek curved buildings; framed in tight profile with edge motion blur.\n4-8s — Creature ascends steeply toward a towering, illuminated skyscraper; framed from a low rear angle highlighting its glowing cyan spine.\n8-12s — Creature glides horizontally over glassy water; framed directly from behind, tracking its flight toward distant city arches.\n12-15s — Transitions from a wide lateral tracking shot past giant structural rings to a hovering, front-facing close-up of the creature smiling directly at the lens.\nCAMERA\nDynamic drone tracking. Fast fluid movements shifting from tight profiles to wide rear-follow shots. Wide-angle lens with deep depth of field. Continuous single-take motion.\nLIGHTING & PALETTE\nNighttime ambient starlight paired with neon city glow. Deep indigo sky, bright luminescent cyan, warm golden-yellow interior building lights, vibrant ruby-red fur. Polished specular reflections on water and metallic architecture.\nAUDIO\nWind rushing. Soft magical chiming synchronized with wing flaps. Serene, wondrous orchestral synth music. Low ambient hum of a futuristic metropolis.\nAVOID\nDaylight, jagged architecture, human figures, typography, realistic animals, static camera, muted colors.","media":{"video":true,"refs":[]},"credit":{"author":"@aiIgnatius","authorUrl":"https://x.com/aiIgnatius","postUrl":"https://x.com/aiIgnatius/status/2082542123149119593"}},{"id":"apim_6TdfYzz_","source":"apimodels","category":"cinematic","title":{"en":"Found Footage Ghoul Attack","vi":"Quỷ tấn công kiểu found footage"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 16:9 | Style: Found footage horror, VHS glitch aesthetic\nSCENE\nYoung Asian woman wearing a bright yellow tank top and frayed denim shorts. Emaciated ghoul with sickly pale skin, elongated limbs, sharp fangs, and bony spikes protruding from its spine. Dilapidated, pitch-black room featuring peeling green wall paint, dirt, and scattered wooden debris.\nSHOT BREAKDOWN\n0-4s — The ghoul violently chokes the terrified woman against a deteriorating wall. She struggles desperately, her hands gripping its elongated gray arms to relieve the pressure. Framed as a medium two-shot.\n4-8s — The creature unhinges its jaw, roaring directly into her face. The sheer force of the roar blows the woman's dark hair wildly backward as she screams in agony. Camera pushes in for a tight close-up.\n8-12s — The brutal struggle continues. The woman frantically tries to pry the monster's unyielding grip from her throat, her expression locked in pure terror.\n12-15s — Sudden harsh VHS tracking glitches distort the frame. The ghoul unexpectedly disengages, sitting back on its haunches to flash a sinister, bloody grin directly at the camera lens. The woman collapses in the background, sobbing.\nCAMERA\nHandheld, erratic, and shaky, simulating an amateur camcorder. Heavy use of direct flash perspective. Aggressive VHS tracking lines and analog distortion tear through the final seconds.\nLIGHTING & PALETTE\nHarsh, direct frontal flash lighting creating stark, pitch-black background shadows. Color palette dominated by sickly corpse grays, stark neon yellow, faded denim blue, and murky browns.\nAUDIO\nShrill, panicked female screaming, wet guttural monster roaring, frantic physical struggling. Piercing tape static and audio tearing during the final glitch sequence.\nAVOID\nSmooth camera stabilization, professional three-point lighting, cheerful atmosphere, modern clean lenses, shallow depth of field.","media":{"video":true,"refs":[]},"credit":{"author":"@HauntedAI","authorUrl":"https://x.com/HauntedAI","postUrl":"https://x.com/HauntedAI/status/2082494343063928966"}},{"id":"apim_i1yPbS4K","source":"apimodels","category":"cinematic","title":{"en":"Skyship Through the Storm","vi":"Khinh khí cầu bão bay xuyên"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Skyship flight across a floating kingdom (single continuous shot) From above a sea of endless clouds, the camera dives toward a majestic skyship soaring between gigantic floating islands. Lock-on: the airship accelerating into a violent thunderstorm suspended in the sky. The camera slingshots beneath the hull, whips across the towering sails, then drops tight behind the glowing engines: lightning tears across the clouds, rain lashes the deck, shattered rock fragments tumble through the air. A collapsing floating island sends massive boulders crashing into the storm; the captain steers beneath a breaking stone arch before threading between waterfalls pouring into the sky, hanging bridges and drifting islands in one uninterrupted line. The camera mirrors every impossible maneuver before bursting through the storm into brilliant sunlight, revealing an endless kingdom of floating continents stretching beyond the horizon above a sea of clouds.","media":{"video":true,"refs":[]},"credit":{"author":"@Strength04_X","authorUrl":"https://x.com/Strength04_X","postUrl":"https://x.com/Strength04_X/status/2082712692159344891"}},{"id":"apim_4vcDGml9","source":"apimodels","category":"cinematic","title":{"en":"Janitor vs Mechanical Mouse","vi":"Lao công đấu chuột máy"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 16:9 | Style: Slapstick comedy commercial\nSCENE\nJanitor, blue jumpsuit, green rubber boots. Mechanical toy mouse, blue body, yellow wheels, pink tail, gold wind-up key. Modern shopping mall corridor, glossy floors, digital ad screens, wooden benches, glass storefronts.\nSHOT BREAKDOWN\n0-4s — Wide shot: Janitor mops floor calmly near a digital sign reading \"BUM JCCE\". Floor-level tracking: Toy mouse rolls past yellow wet floor signs reading \"BIONIOL\".\n4-8s — Low tracking shot behind mouse: Janitor chases the toy, wielding the mop like a baseball bat. He swings wildly, knocking a blue and red bucket across the glossy floor.\n8-12s — Extreme close-up profile of the mechanical mouse rolling past digital ad boards. Fast cut to a low angle of the janitor swinging the mop aggressively downward near the mall's glass exit doors.\n12-15s — Wide static shot: Janitor stands center frame, looking upward in exhausted defeat. The surrounding mall corridor is completely trashed with overturned benches, spilled plant pots, and scattered buckets.\nCAMERA\nLow-angle tracking, floor-level dynamic perspective following the toy mouse. Fast-paced action cuts during the chase. Static wide framing for the chaotic aftermath.\nLIGHTING & PALETTE\nBright overhead skylight illumination, clean commercial lighting. Saturated primary colors contrasting with warm neutral floors: bright blue jumpsuit, yellow signs and wheels, red and blue plastic buckets.\nAUDIO\nEchoing mall ambience, squeaking rubber boots, mechanical whirring of the wind-up toy, loud crashing sounds of plastic and wood, frantic slapstick orchestral chase music.\nAVOID\nDark shadows, slow motion, shallow depth of field, realistic violence, unlit backgrounds.","media":{"video":true,"refs":[]},"credit":{"author":"@kingofdairyque","authorUrl":"https://x.com/kingofdairyque","postUrl":"https://x.com/kingofdairyque/status/2082720442549182727"}},{"id":"apim_AO5BEQKF","source":"apimodels","category":"ui","title":{"en":"Fantasy MMORPG Gameplay Reveal","vi":"Demo gameplay game phép thuật"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"[FORMAT] Exactly 15 seconds, horizontal 16:9, photorealistic AAA fantasy MMORPG gameplay reveal with native synchronized game audio and music.\n[OMNI REFERENCES]\n[Image1] = Kael Ardyn, the exact playable arcane spellblade. Preserve his face, silver-black tied hair, pointed ears, cyan eyes, athletic proportions, navy-and-silver armor, gold filigree, teal cloth, chest focus and curved spellblade.\n[Image2] = The exact Obsidian Tempest Dragon. Preserve its enormous four-legged anatomy, black volcanic-glass scales, crown horns, torn wings, cyan electrical fissures, storm-blue eyes and long spiked tail.\n[Image3] = The strict Skybreak Citadel arena and spatial reference: circular black-stone platform, gold-and-cyan inlays, ruined towers, floating architecture, storm abyss and blue-hour lighting.\n[Image4] = The strict visual reference for the 2026 gameplay interface: refined gold-and-cyan frames, boss bar, circular minimap, quest tracker, party frames, player status arcs, action bar, cooldown numbers and restrained typography.\nReconstruct each multi-view subject as one coherent 3D asset without averaging or redesigning it.\n[DESIGN GOAL] Original next-generation fantasy MMORPG with cinematic AAA presentation and genuinely playable movement. The 2026 HUD uses elegant smoked glass, contextual information, subtle transitions, responsive cooldowns and excellent readability. It remains locked to the screen, never floating inside the world.\n[15-SECOND SEQUENCE] 0–2s: Immediate hook with no HUD. Low camera behind Kael. The Obsidian Tempest Dragon crashes onto the platform ahead, wings filling frame, lightning splitting the sky and stone fragments rising from impact. Kael draws his spellblade as it roars. 2–4s: Camera settles into polished third-person gameplay. The interface assembles around the edges: top boss bar reading “OBSIDIAN TEMPEST,” player health, mana and stamina below, action bar, party frames left, minimap upper right and quest tracker reading “THE SKYBREAK SIEGE.” HUD stays sharp and screen-locked. 4–8s: Kael sprints forward and chains three abilities: cyan blade dash, circular gold runic shield and vertical storm strike into the dragon’s chest. Matching action icons illuminate once and begin radial cooldowns with changing numbers. Boss health falls from 100% to 78%. Accurate footwork, weapon contact and restrained camera shake. 8–11s: The dragon releases a ground-level electrical shockwave. A red telegraph ring appears on the arena. Kael performs a perfectly timed sideways dodge; a small centered “PERFECT EVADE” notification appears briefly and fades. Health stays stable while stamina dips and recovers. 11–13s: Kael targets the glowing chest fissure and unleashes a cyan-gold arcane slash. Brief hit-stop, one damage number, boss bar falls to 12%, then sparks and debris resume. 13–15s: Kael lands in a hero stance as the dragon recoils. HUD minimizes toward the edges. Centered title: “AETHERFALL ONLINE,” then “THE RAID BEGINS.” End on thunder and musical impact.\n[CAMERA + VISUAL QUALITY] Seamless cinematic-to-gameplay transition, realistic third-person controls, premium real-time rendering, ray-traced reflections, volumetric storm light, grounded combat, coherent scale, controlled motion blur and cyan-gold contrast. Preserve the arena layout; avoid arbitrary cuts.\n[UI BEHAVIOR] Anchor all UI to exact screen coordinates with consistent scale and typography. No flicker, duplication or drifting. Values change only in response to described actions. Never cover Kael or the dragon.\n[AUDIO] Original hybrid fantasy score: war drums, low strings, metallic pulses and restrained electronic rhythm. Add dragon impact and roar, thunder, debris, footsteps, sword draw, arcane abilities, shield resonance, shockwave, dodge and final hit. Keep effects clear. No narrator, dialogue, vocals or recognizable melody.\n[PRESERVE] Stable Kael and dragon identities, exact armor and creature design, one hero, one dragon, Skybreak Citadel geography, responsive 2026 HUD, readable specified labels and coherent combat causality.\n[AVOID] Existing game logos or recognizable franchise symbols, copied interface layouts, extra heroes or dragons, turn-based combat, cinematic black bars, first-person view, random UI changes, unreadable text, floating HUD panels inside the world, excessive particles, cartoon rendering, anatomy drift, weapon changes, clipping, subtitles, additional text or watermark.","media":{"video":true,"refs":[]},"credit":{"author":"@PromptSin","authorUrl":"https://x.com/PromptSin","postUrl":"https://x.com/PromptSin/status/2083085328710238400"}},{"id":"apim_ZkImHueP","source":"apimodels","category":"cinematic","title":{"en":"Clash of Fire and Water","vi":"Cuộc chạm trán giữa lửa và nước"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 16:9 | Style: 3D fantasy CGI animation, cinematic video game trailer\nSCENE\nMale warrior in a blue tunic and silver chainmail, and a female warrior with flowing pink hair in red and silver armor. Ancient stone courtyard with mossy cobblestones and traditional temple architecture.\nSHOT BREAKDOWN\n0-4s — The warriors engage in martial arts combat, generating sweeping trails of translucent blue water and orange fire from their arms in a medium two-shot.\n4-8s — They jump back into wide stances, gathering magical energy. Framed as a wide shot capturing the temple courtyard.\n8-12s — They project massive elemental avatars: a large serpentine blue water dragon and a glowing fiery phoenix. The creatures fully materialize and rush toward the center.\n12-15s — The avatars collide in a blinding flash. A massive shockwave of thick gray smoke and airborne stone debris obscures the scene, pushing the bracing characters to the edges of the frame.\nCAMERA\nEye-level perspective, steady wide framing. Subtle pull-backs to accommodate the massive elemental creatures. Locked-off spatial axis focusing on the central clash.\nLIGHTING & PALETTE\nVolumetric sunlight rays piercing down through the temple roofs. High-contrast, vibrant palette: neon blues, fiery oranges, and bright pinks against muted moss greens and stony grays.\nAUDIO\nMartial arts whooshes, splashing water, roaring fire, high-pitched screeches, heavy bass explosion, crumbling stone, driving orchestral battle music.\nAVOID\nText, watermarks, modern clothing, photorealism, shaky camera, modern architecture.","media":{"video":true,"refs":[]},"credit":{"author":"@harboriis","authorUrl":"https://x.com/harboriis","postUrl":"https://x.com/harboriis/status/2082763939453239615"}},{"id":"apim_FiV1Dd_P","source":"apimodels","category":"motion","title":{"en":"Seamless Character 360 Orbit","vi":"Quỹ đạo xoay giữ nhất quán nhân vật"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"🖼️ OMNI REFERENCE — [Ref_Image1]\nUse [Ref_Image1] as the strict character identity, wardrobe and multi-angle reference. Preserve Freya’s exact face, blue eyes, long platinum-blonde hair with darker roots, skin tone, age and body proportions from [Ref_Image1]. Keep the same buttoned white linen shirt, cream linen shorts, bare feet and gold bracelet shown in [Ref_Image1]. Its six views represent one person from different angles; reconstruct one coherent 3D character without averaging or redesigning her face.\n🏝️ SCENE\nFreya stands near the waterline on a quiet Caribbean beach in warm late-afternoon sunlight: pale sand, transparent turquoise sea, distant palms and blue sky. A gentle breeze moves her hair and linen shirt while small waves reach the shore.\n🎥 15-SECOND 360° ORBIT\nOne uninterrupted shot with no cuts. A stabilized camera moves clockwise around stationary Freya in one complete, physically correct 360° orbit.\n0–2s: Start medium-wide in a frontal three-quarter view; she makes eye contact, smiles and breathes naturally as the orbit begins immediately.\n2–5s: Pass her left profile with strong shoreline parallax; she begins speaking: “If paradise had a heartbeat…”\n5–8s: Reach the full back view; she turns only her head slightly toward the moving camera and continues: “…I think it would sound…”\n8–12s: Pass her right profile; she looks briefly at the horizon, returns her gaze to the lens and finishes: “…exactly like this.” She smiles naturally.\n12–15s: Complete the orbit and return precisely to the opening frontal composition for a seamless loop.\n📷 CAMERA\nConstant clockwise direction, orbital radius, horizon and subject scale. Smooth gimbal motion, 35mm cinematic lens, full-body framing from head to bare feet, realistic foreground/background parallax. The camera travels around Freya; she does not spin and the background does not rotate artificially.\n✨ LOOK\nPremium photorealistic travel-fashion film, natural skin and linen texture, warm sunlight, soft shadows.","media":{"video":true,"refs":[]},"credit":{"author":"@PromptSin","authorUrl":"https://x.com/PromptSin","postUrl":"https://x.com/PromptSin/status/2082534878139355561"}},{"id":"apim_whCPPxlB","source":"apimodels","category":"ui","title":{"en":"Chibi RPG Card Battle Showdown","vi":"Đại chiến bài RPG chibi"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Reconstructed\nDuration: 15 seconds | Aspect ratio: 16:9 | Style: 3D anime chibi fantasy RPG video game\nSCENE\nFloating circular stone arena above clouds. UI overlays including health bars, a \"TURN 1\" banner, and an \"END TURN\" button. Six chibi anime characters in animal kigurumi costumes stand on glowing hexagonal tiles.\nSHOT BREAKDOWN\n0-4s — Static wide shot of the arena. Three stylized playing cards slide into view at the bottom edge.\n4-8s — The center card rises. A massive, glowing golden spirit beast manifests over the left-side characters.\n8-12s — A glowing red and white shield forms in front of the right-side lion character. Floating \"-120\" text pops up above the right team amidst rising ground mist.\n12-15s — A pink magical slash impacts the right team, generating \"-128\" and \"-150\" text. A glowing torii gate appears. The top banner updates to \"TURN 2\" and right-side health bars deplete.\nCAMERA\nFixed high-angle wide shot, imitating a static video game perspective. Zero camera movement or cuts.\nLIGHTING & PALETTE\nBright daytime sunlight, soft volumetric clouds. Cool stone grays, bright cyan and neon red UI accents, gold and magenta magical VFX.\nAUDIO\nUpbeat fantasy orchestral music. UI card-slide clicks, magical conjuration chimes, and energetic impact sound effects during the attack.\nAVOID\nPhotorealism, live-action, shaky camera, dramatic shadows, dynamic camera tracking, realistic human proportions.","media":{"video":true,"refs":[]},"credit":{"author":"@Preda2005","authorUrl":"https://x.com/Preda2005","postUrl":"https://x.com/Preda2005/status/2083203352402543027"}},{"id":"apim_PhHCOlfV","source":"apimodels","category":"motion","title":{"en":"Cinematic Warrior Orbital Shot","vi":"Nữ chiến binh, máy quay xoay quanh"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"slow 180-degree orbital as she rises to face the third raider, khopesh raised, torchlight painting her profile in molten gold, incense smoke swirling around her bare shoulders.  Extreme low-angle tracking, fast handheld whip-pans, Dutch angles on disarms, slow-motion inserts on bronze edges catching firelight, floor-level fall shots, slow orbital hero framing. Gritty warm-amber color grade with deep basalt blacks, high con","media":{"video":true,"refs":[]},"credit":{"author":"@Malzahran2","authorUrl":"https://x.com/Malzahran2","postUrl":"https://x.com/Malzahran2/status/2083532686845497568"}}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
if(window.H3_CJK_TEMPLATES)D.templates.push(...window.H3_CJK_TEMPLATES);
let lang='vi';
const $=id=>document.getElementById(id);
const L=o=>o[lang]||o.en;
const MODE={fl2va:'chỉ first frame',flf2va:'first + last frame',ref2va:'first frame + ảnh tham chiếu'};
function fillCats(){const s=$('cat');const v=s.value;s.innerHTML='<option value="">Mọi nhóm</option>'+D.categories.map(c=>'<option>'+c+'</option>').join('');s.value=v}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function copy(btn,text){navigator.clipboard.writeText(text).then(()=>{const o=btn.textContent;btn.textContent='Đã chép';setTimeout(()=>btn.textContent=o,1200)})}
function card(t){
  const ar=t.aspectRatio.replace(':','/');
  const inputs=t.inputs.map(i=>{
    const ip=i.imagePrompt?'<details><summary>Image prompt</summary><pre>'+esc(i.imagePrompt)+'</pre><button class="small" data-copy="ip">Chép</button></details>':'';
    return '<div class="inp"><code>'+esc(i.label)+'</code> '+esc(L(i.role))+ip+'</div>';
  }).join('');
  return '<article class="card" data-id="'+t.id+'">'+
   '<div class="row"><h2>'+esc(L(t.title))+'</h2><button class="small" data-copy="id">'+esc(t.id)+'</button></div>'+
   '<div class="badges"><span class="b acc">'+t.category+'</span><span class="b">'+t.mode+' &middot; '+MODE[t.mode]+'</span><span class="b">'+t.aspectRatio+'</span><span class="b">'+t.durationSec+'s</span><span class="b">'+t.source+'</span></div>'+
   (t.description.en||t.description.vi?'<p>'+esc(L(t.description))+'</p>':'')+
   (t.credit?'<div class="cap">'+(t.credit.author?'Tác giả '+(t.credit.authorUrl?'<a href="'+t.credit.authorUrl+'" target="_blank" rel="noopener">'+esc(t.credit.author)+'</a>':esc(t.credit.author))+(t.credit.postUrl?' &middot; <a href="'+t.credit.postUrl+'" target="_blank" rel="noopener">bài gốc</a>':''):'Nguồn: apimodels.app')+'</div>':'')+
   (t.media.video?'<div class="slot vid" style="--ar:'+ar+'"><video src="media/'+t.id+'/preview.mp4" poster="media/'+t.id+'/preview.jpg" controls loop muted preload="metadata"></video><div class="ph" hidden>Chưa tải media</div></div>':'<div class="nomedia">Chưa có video mẫu</div>')+
   (t.media.refs.length?'<div class="media">'+t.media.refs.map(r=>'<a class="slot" href="media/'+t.id+'/'+r+'" target="_blank"><img src="media/'+t.id+'/'+r+'" alt="" loading="lazy"></a>').join('')+'</div><div class="cap">Ảnh tham chiếu của ví dụ gốc (chỉ để xem; không trùng số với &lt;Picture N&gt; của template)</div>':'')+
   inputs+
   '<details><summary>Prompt đầy đủ</summary><pre>'+esc(t.prompt)+'</pre><button class="small" data-copy="prompt">Chép prompt</button></details>'+
   '</article>';
}
function render(){
  const q=$('q').value.toLowerCase(),c=$('cat').value,m=$('mode').value,a=$('ar').value,s=$('src').value;
  const items=D.templates.filter(t=>(!c||t.category===c)&&(!m||t.mode===m)&&(!a||t.aspectRatio===a)&&(!s||t.source===s)&&
    (!q||(t.id+' '+t.title.en+' '+t.title.vi+' '+t.description.en+' '+t.description.vi+' '+t.prompt).toLowerCase().includes(q)));
  $('list').innerHTML=items.map(card).join('');
  $('count').textContent=items.length+' / '+D.templates.length;
  $('list').querySelectorAll('video').forEach(v=>v.addEventListener('error',()=>{v.hidden=true;v.nextElementSibling.hidden=false;$('warn').hidden=false},{once:true}));
  $('list').querySelectorAll('.media img').forEach(i=>i.addEventListener('error',()=>{i.parentElement.hidden=true},{once:true}));
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;
  const t=D.templates.find(x=>x.id===b.closest('.card').dataset.id);
  const k=b.dataset.copy;
  copy(b,k==='id'?t.id:k==='prompt'?t.prompt:b.previousElementSibling.textContent);
});
['q','cat','mode','ar','src'].forEach(id=>$(id).addEventListener('input',render));
$('lang').onclick=()=>{lang=lang==='vi'?'en':'vi';fillCats();render()};
fillCats();render();
</script>
</body>
