<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMax H3 - Thu vien template</title>
<style>
:root{--bg:#fff;--fg:#1c1d21;--mut:#686c78;--card:#f5f6f8;--line:#dfe1e6;--acc:#4f46e5;--code:#eceef2}
@media(prefers-color-scheme:dark){:root{--bg:#14151a;--fg:#e8e9ee;--mut:#9a9eab;--card:#1d1f26;--line:#2e313b;--acc:#8b87ff;--code:#101116}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{flex:1;min-width:180px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
.count{color:var(--mut);font-size:13px}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:16px;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.b.acc{color:var(--acc);border-color:var(--acc)}
p{margin:0;color:var(--mut)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.slot{border:1px dashed var(--line);border-radius:8px;overflow:hidden;background:var(--code);position:relative}
.slot img,.slot video{display:block;width:100%;height:100%;object-fit:cover}
.slot .ph{padding:8px;font-size:11px;color:var(--mut);word-break:break-all;display:flex;align-items:center;justify-content:center;text-align:center;height:100%}
.vid{grid-column:1/-1;aspect-ratio:var(--ar)}
.pic{aspect-ratio:var(--ar)}
.inp{font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.inp code{color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
details>summary{cursor:pointer;color:var(--acc);font-size:13px}
pre{margin:6px 0 0;background:var(--code);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace;max-height:420px;overflow:auto}
.small{font-size:12px;padding:2px 8px}
</style>
</head>

</div>
</header>

<script id="data" type="application/json">{"categories":["cinematic","brand","ecommerce","drama","animation","motion","ui","audio"],"templates":[{"id":"fal_space_opera","source":"fal","category":"cinematic","title":{"en":"Space opera teaser","vi":"Teaser space opera"},"description":{"en":"Fast hard cuts, white flashes and a warp jump ending on an animated title.","vi":"Cắt nhanh, chớp trắng, nhảy warp và kết bằng tiêu đề động."},"mode":"fl2va","genMode":"firstFrame","aspectRatio":"16:9","durationSec":10,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: starship command deck","vi":"First frame: buồng chỉ huy tàu vũ trụ"},"imagePrompt":"Cinematic wide shot inside a starship command deck, crew silhouettes at glowing consoles, red warning lights, a huge window showing a gas giant and stars, anamorphic widescreen, high contrast"}],"prompt":"For the target video, at 0.00 seconds into the target video, \u003cPicture 1> (from [Shot 1]) is fully referenced.\n\nintegrated_multimodal_description:\nEpic space opera teaser, anamorphic widescreen, high contrast, hard cuts only, no slow pacing.\n[Shot 1] A wide shot begins from \u003cPicture 1>: the command deck shakes, consoles flicker and sparks fall. The handheld camera shakes with it. At 1.20 seconds, a white flash fills the frame for two frames.\n[Shot 2] At 00:03.000, a hard cut to a close-up of the captain's face lit red, eyes locked on the window, then a second white flash.\n[Shot 3] At 00:05.000, a hard cut through one black frame to the exterior: the starship stretches into streaks of light in a warp jump, a ring shockwave expanding behind it.\n[Shot 4] At 00:07.500, the shot cuts to black. Wide-tracked metallic title letters reading ASCEND emerge from shadow, catch starlight, widen their spacing, leave a faint afterimage and flash once against black, then hold until the final frame.\n\noverall_soundscape:\nAlarm klaxons, a metal groan, deep impact booms on every flash, a rising warp whine cut dead by silence on the black frame.\n\nnon_diegetic_music:\nA fast percussive orchestral build with brass stabs and a choir, landing on one massive final chord as the title flashes."},{"id":"fal_gateway_mystery","source":"fal","category":"cinematic","title":{"en":"Sci-fi mystery teaser","vi":"Teaser bí ẩn khoa học viễn tưởng"},"description":{"en":"Ultra-wide cosmic gateway, slow push-in, title resolving out of blur.","vi":"Cổng vũ trụ siêu rộng, đẩy máy chậm, tiêu đề hiện ra từ mờ."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":10,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: gateway establishing shot","vi":"First frame: cảnh toàn cổng vũ trụ"},"imagePrompt":"Ultra-wide cinematic shot of a gigantic circular cosmic gateway with a black center, a tiny figure seen from behind low and slightly right of center, wet reflective ground, dark crimson and rust palette, mist"},{"label":"\u003cPicture 2>","role":{"en":"Protagonist","vi":"Nhân vật chính"},"imagePrompt":"Full-body character sheet of a lone explorer in a weathered rust-colored coat and hood, seen from the back and three-quarter view, plain grey background"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the explorer, on the character sheet \u003cPicture 2>, with a weathered rust-colored hooded coat.\n\u003cPicture 1> is the first frame of [Shot 1], showing the gateway and \u003cSubject 1> small in the lower right.\n\nsummary:\n[keyframe completion + reference generation] A 10-second 16:9 mystery teaser that begins from \u003cPicture 1>, pushes slowly toward the gateway, and ends on a title card.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1]): fully_preserved - coat, hood and silhouette, seen only from behind.\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - gateway scale, wet ground and color palette.\n\ndetailed_description:\nDark, restrained sci-fi mystery look, heavy mist, crimson and rust tones, fine grain, no handheld shake.\n[Shot 1] The shot begins from \u003cPicture 1>: an ultra-wide view of the gateway with \u003cSubject 1> tiny at the lower right. The camera pushes forward very slowly. At 2.50 seconds, the black center of the gateway ripples once like water. At 5.00 seconds, a thin ring of pale light traces the gateway's edge and reflects across the wet ground.\n[Shot 2] At 00:07.000, a hard cut to black. A condensed, heavy all-caps title reading THRESHOLD resolves out of blur in dark crimson and rust, mist softening its edges, and holds until the final frame.\n\noverall_soundscape:\nA deep sub-bass pulse, a distant metallic resonance, one heavy hit exactly as the title locks, then silence.\n\nnon_diegetic_music:\nN/A"},{"id":"fal_fps_gameplay","source":"fal","category":"cinematic","title":{"en":"First-person tactical gameplay","vi":"Gameplay chiến thuật góc nhìn thứ nhất"},"description":{"en":"Handheld first-person advance along a base perimeter, quick checks, shots with light recoil.","vi":"Góc nhìn thứ nhất cầm tay tiến dọc hàng rào căn cứ, kiểm tra nhanh, bắn có giật nhẹ."},"mode":"fl2va","genMode":"firstFrame","aspectRatio":"16:9","durationSec":10,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: first-person view on the perimeter road","vi":"First frame: góc nhìn thứ nhất trên đường quanh căn cứ"},"imagePrompt":"Photorealistic first-person view of a soldier's gloved hands holding a rifle, standing on a military base perimeter road beside concrete barriers, cool daylight, haze and a little smoke in the distance"}],"prompt":"For the target video, at 0.00 seconds into the target video, \u003cPicture 1> (from [Shot 1]) is fully referenced.\n\nintegrated_multimodal_description:\nPhotorealistic first-person tactical shooter footage, eye-level handheld camera, crisp cool daylight mixed with drifting smoke and distant firelight, dust and haze in the air.\n[Shot 1] The shot begins from \u003cPicture 1>: the player advances slowly along the perimeter road, keeping close to the concrete cover on the left, the rifle bobbing with each step. At 2.00 seconds, a quick look right, then left, checking the corners. At 4.00 seconds, the player raises the rifle and fires three controlled shots at a distant target; light recoil kicks the view up slightly each time and brass casings flick past. At 6.50 seconds, the view settles and the player keeps moving forward, steady and unhurried, until the final frame.\n\noverall_soundscape:\nBoots on gravel, gear rattling, distinct rifle shots with a short distant echo, a faint ringing, wind and far-off engine noise.\n\nnon_diegetic_music:\nN/A"},{"id":"fal_macro_coffee_dunes","source":"fal","category":"cinematic","title":{"en":"Macro coffee to desert dunes","vi":"Macro cà phê thành đồi cát"},"description":{"en":"One continuous push-in: coffee foam becomes desert dunes with no cut.","vi":"Một cú đẩy máy liền mạch: bọt cà phê biến thành đồi cát, không cắt."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":8,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: coffee macro","vi":"First frame: macro cà phê"},"imagePrompt":"Extreme macro photograph of coffee foam with cocoa powder particles, swirling milky bubbles and caramel streaks, shallow depth of field, backlit powder in the air"},{"label":"\u003cPicture 2>","role":{"en":"Desert dunes","vi":"Đồi cát sa mạc"},"imagePrompt":"Wide landscape photograph of golden desert dunes with sharp wind-carved ridges, soft low sun, hazy horizon"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the coffee foam surface, on \u003cPicture 1>, with milky bubbles, cocoa particles and caramel streaks.\n\u003cSubject 2> is the desert dunescape, on the landscape sheet \u003cPicture 2>, with wind-carved ridges and warm golden sand.\n\u003cPicture 1> is the first frame of [Shot 1], an extreme macro of \u003cSubject 1>.\n\nsummary:\n[keyframe completion + reference generation] An 8-second 16:9 single continuous take that begins from \u003cPicture 1>, rushes in on \u003cSubject 1>, and morphs seamlessly into \u003cSubject 2>, finishing on a wide view of the dunes.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1]): fully_preserved - bubble texture and cocoa particles at the opening.\n\u003cSubject 2> (appears in [Shot 1]): attribute_transfer - ridge shapes and sand color become the closing landscape.\nNo tearing, no black frames, no hard cuts, no visible seams or obvious VFX.\n\ndetailed_description:\nPhotorealistic macro cinematography, shallow focus, backlit powder drifting through the light, one unbroken shot.\n[Shot 1] The shot begins from \u003cPicture 1>. The camera rushes forward fast over \u003cSubject 1>. At 2.00 seconds, the foam ridges stretch and the surface begins to look like dunes. At 3.50 seconds, the bubbles dissolve into sharp sand ridges as the scale silently grows. At 5.00 seconds, the camera pushes on and reveals the full dunes under a low sun. At 7.00 seconds, the camera settles on the wide landscape and holds until the final frame. There is no cut anywhere.\n\noverall_soundscape:\nA soft liquid fizz and spoon-clink tail that blends into a gentle desert wind and a faint hiss of sand.\n\nnon_diegetic_music:\nN/A"},{"id":"fal_costume_swap","source":"fal","category":"cinematic","title":{"en":"Stage illusion costume swap","vi":"Ảo thuật đổi trang phục trên sân khấu"},"description":{"en":"Two magicians' suit colors swap in the smoke; they bow and the curtain changes color.","vi":"Hai nhà ảo thuật đổi màu vest trong làn khói; cúi chào và rèm đổi màu."},"mode":"fl2va","genMode":"firstFrame","aspectRatio":"16:9","durationSec":10,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: two magicians on stage","vi":"First frame: hai nhà ảo thuật trên sân khấu"},"imagePrompt":"Two stage magicians side by side in a spotlight, the left wearing a black tuxedo with white gloves and the right wearing a white tuxedo with black gloves, red velvet curtain behind them, theatre stage"}],"prompt":"For the target video, at 0.00 seconds into the target video, \u003cPicture 1> (from [Shot 1]) is fully referenced.\n\nintegrated_multimodal_description:\nLive theatre footage, warm spotlights, red velvet curtain, a little stage haze.\n[Shot 1] A medium-wide shot begins from \u003cPicture 1>: the two magicians face the audience, the one on the left in a black tuxedo and the one on the right in a white tuxedo, both with gloves in the opposite color. The camera holds steady. At 1.50 seconds, they raise their arms and thick white smoke bursts around them. At 3.50 seconds, the smoke thins and the suits have swapped: the left magician now wears white, the right now wears black, while the glove colors stay exactly the same. At 6.00 seconds, they bow together. At 8.00 seconds, the red curtain drawn closed behind them shifts from deep red to dark blue, and the shot holds until the final frame.\n\noverall_soundscape:\nA drum roll, a soft burst of smoke, a short chime when the colors change, applause rising as they bow.\n\nnon_diegetic_music:\nLight playful stage-magic jazz with a muted trumpet and a walking bass."},{"id":"fal_binocular_film","source":"fal","category":"brand","title":{"en":"Vintage binocular brand film","vi":"Phim thương hiệu qua ống nhòm cổ"},"description":{"en":"A fixed binocular lens mask while the view whip-scans through 4 keyframes with red typography.","vi":"Khung ống nhòm cố định, góc nhìn lướt nhanh qua 4 keyframe với chữ đỏ."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":12,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"Keyframe 1 / first frame: main installation","vi":"Keyframe 1 / first frame: tác phẩm sắp đặt chính"},"imagePrompt":"Photograph of a large red fabric art installation in an old plaza, seen through a black double-circle binocular mask, 35mm film grain"},{"label":"\u003cPicture 2>","role":{"en":"Keyframe 2: fabric in the wind","vi":"Keyframe 2: vải bay trong gió"},"imagePrompt":"Photograph of red fabric billowing in the wind with hand-painted lettering following the folds, seen through a black double-circle binocular mask, 35mm film grain"},{"label":"\u003cPicture 3>","role":{"en":"Keyframe 3: passerby walking","vi":"Keyframe 3: người qua đường"},"imagePrompt":"Photograph of a passerby in a beige coat walking and swinging their arms in an old plaza, seen through a black double-circle binocular mask, 35mm film grain"},{"label":"\u003cPicture 4>","role":{"en":"Keyframe 4: person adjusting glasses","vi":"Keyframe 4: người chỉnh kính"},"imagePrompt":"Photograph of a person adjusting their glasses and lifting their chin, seen through a black double-circle binocular mask, 35mm film grain"}],"prompt":"subject_definitions:\n\u003cPicture 1> is the first frame of [Shot 1], showing the main installation through a black double-circle binocular mask.\n\u003cPicture 2> is the keyframe at 3.00 seconds, showing red fabric in the wind with lettering following its folds.\n\u003cPicture 3> is the keyframe at 6.00 seconds, showing a passerby walking and swinging their arms.\n\u003cPicture 4> is the keyframe at 9.00 seconds, showing a person adjusting their glasses and lifting their chin.\n\nsummary:\n[keyframe completion + reference generation] A 12-second 16:9 voyeuristic brand film seen through a fixed binocular mask, beginning from \u003cPicture 1> and whip-scanning through \u003cPicture 2>, \u003cPicture 3> and \u003cPicture 4> in order.\n\nretention_analysis:\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - composition at the opening.\n\u003cPicture 2> ([Shot 1] keyframe): fully_preserved - composition reached at 3.00 seconds.\n\u003cPicture 3> ([Shot 1] keyframe): fully_preserved - composition reached at 6.00 seconds.\n\u003cPicture 4> ([Shot 1] keyframe): fully_preserved - composition reached at 9.00 seconds.\nNo added people, vehicles, buildings or logos; each composition is kept.\n\ndetailed_description:\nWes Anderson-inspired voyeuristic 35mm look with fine grain and halation. The black double-circle binocular mask stays perfectly fixed at frame center; only the view inside it moves.\n[Shot 1] The shot begins from \u003cPicture 1>, blurred at first with a slight handheld shake. The view pushes in and the focus racks sharp. At 1.50 seconds, a short exposure flicker. At 3.00 seconds, a fast whip-scan lands on \u003cPicture 2> and snaps into focus, the fabric rippling. At 4.50 seconds, a flicker and a hard cut at peak blur. At 6.00 seconds, the view snaps into focus on \u003cPicture 3>. At 7.50 seconds, another whip-scan. At 9.00 seconds, the view locks on \u003cPicture 4>. Short red sans-serif words fade in from blur over about half a second, slide only slightly, and fade out before the next scan. The final view holds until the end. No spinning or large fly-in text.\n\noverall_soundscape:\nA soft binocular focus-ring click, whooshes on each whip-scan, wind, faint plaza chatter.\n\nnon_diegetic_music:\nA quirky pizzicato-and-harpsichord waltz with light percussion."},{"id":"fal_desert_fashion","source":"fal","category":"brand","title":{"en":"Desert fashion campaign","vi":"Chiến dịch thời trang sa mạc"},"description":{"en":"A woman takes a bag from a car trunk on a desert highway; closes on the brand mark.","vi":"Người phụ nữ lấy túi từ cốp xe trên đường cao tốc sa mạc; kết bằng logo."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"16:9","durationSec":12,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame: location and film texture","vi":"First frame: bối cảnh và chất phim"},"imagePrompt":"Cinematic photo of a vintage cream car parked on an empty desert highway at golden hour, open trunk, film grain, muted warm palette"},{"label":"\u003cPicture 2>","role":{"en":"Talent","vi":"Người mẫu"},"imagePrompt":"Fashion portrait of a tall woman with a sleek low ponytail in a minimal olive linen set and thin sunglasses, neutral studio background"},{"label":"\u003cPicture 3>","role":{"en":"Product: black bag","vi":"Sản phẩm: túi đen"},"imagePrompt":"Product photo of a structured black leather handbag with a gold clasp on a neutral background"},{"label":"\u003cPicture 4>","role":{"en":"Closing brand mark","vi":"Logo kết phim"},"imagePrompt":"A minimalist geometric brand mark in white on a solid sand-colored background, no text"}],"prompt":"subject_definitions:\n\u003cSubject 1> is the woman, on the portrait sheet \u003cPicture 2>, with a sleek low ponytail, an olive linen set and thin sunglasses.\n\u003cSubject 2> is the black handbag, on the product sheet \u003cPicture 3>, with its exact leather, shape and gold clasp.\n\u003cSubject 3> is the brand mark, on \u003cPicture 4>.\n\u003cPicture 1> is the first frame of [Shot 1], showing the vintage car on the desert highway with the trunk open.\n\nsummary:\n[keyframe completion + reference generation] A 12-second 16:9 fashion campaign film that begins from \u003cPicture 1>: \u003cSubject 1> takes \u003cSubject 2> from the trunk, shares a quiet moment with a man beside the car, walks away with the bag, and the film closes on \u003cSubject 3>.\n\nretention_analysis:\n\u003cSubject 1> (appears in [Shot 1], [Shot 2]): fully_preserved - face, hair and outfit.\n\u003cSubject 2> (appears in [Shot 1], [Shot 2]): fully_preserved - leather, shape and clasp.\n\u003cSubject 3> (appears in [Shot 3]): fully_preserved - mark shape and colors.\n\u003cPicture 1> ([Shot 1] first frame): fully_preserved - location, car and film texture.\n\ndetailed_description:\nElevated, cool and restrained but lively fashion film, muted warm palette, film grain, low desert sun. The clothing and bag feel part of the character, not an ad insert.\n[Shot 1] The shot begins from \u003cPicture 1>: a wide frame of the car on the empty highway. \u003cSubject 1> walks into the frame to the back of the car. At 2.00 seconds, she lifts the trunk lid further and takes out \u003cSubject 2>.\n[Shot 2] At 00:05.000, the shot cuts to a medium two-shot: a man in a white .\n[Shot 1] The shot begins from \u003cPicture 1>. The silhouette of \u003cSubject 2> lights a cigarette; the flame flares.\n[Shot 2] At 00:03.000, on the beat, a hard graphic wipe reveals a bold color-block split screen of rain on a neon street.\n[Shot 3] At 00:06.000, on the beat, \u003cSubject 2> turns sharply in a three-quarter view, coat swinging, against a flat blue background.\n[Shot 4] At 00:09.000, on the beat, the title ECHO slams in once in thick hand-painted letters over a freeze frame of \u003cSubject 2>, and holds until the final frame. No watermarks.\n\noverall_soundscape:\nRain hiss, a lighter flick, a short tire screech on the second wipe.\n\nnon_diegetic_music:\nA fast, brassy big-band jazz riff with walking upright bass and a snare fill before every transition."},{"id":"voice_cloned_narration","source":"pixo","category":"audio","title":{"en":"Voice-referenced talking shot","vi":"Nói theo giọng tham chiếu"},"description":{"en":"A speaker delivers a message in the timbre of a voice sample, lip-synced.","vi":"Nhân vật nói theo âm sắc của mẫu giọng, khớp khẩu hình."},"mode":"ref2va","genMode":"imageReference","aspectRatio":"9:16","durationSec":8,"inputs":[{"label":"\u003cPicture 1>","role":{"en":"First frame (connect as image 1)","vi":"Ảnh first frame (nối làm ảnh 1)"},"imagePrompt":"Vertical photo of a presenter with short grey hair, round glasses and a navy cardigan seated at a wooden desk in a cozy study"},{"label":"\u003cPicture 2>","role":{"en":"Speaker portrait","vi":"Ảnh chân dung người nói"},"imagePrompt":"Portrait of a presenter with short grey hair, round glasses and a navy cardigan, neutral background"},{"label":"\u003cAudio 1>","role":{"en":"Voice sample (timbre)","vi":"Mẫu giọng (âm sắc)"}}],"prompt":"subject_definitions:\n\u003cSubject 1> is the presenter, on the character sheet \u003cPicture 2>, with short grey hair, round glasses and a navy cardigan.\n\u003cPicture 1> is the first frame of [Shot 1], showing \u003cSubject 1> seated at a <script>
const D=JSON.parse(document.getElementById('data').textContent);
let lang='vi';
const $=id=>document.getElementById(id);
const L=o=>o[lang]||o.en;
const MODE={fl2va:'chỉ first frame',flf2va:'first + last frame',ref2va:'first frame + ảnh tham chiếu'};
const exts=['jpg','png','webp'];
function fillCats(){const s=$('cat');const v=s.value;s.innerHTML='<option value="">Mọi nhóm</option>'+D.categories.map(c=>'<option>'+c+'</option>').join('');s.value=v}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function copy(btn,text){navigator.clipboard.writeText(text).then(()=>{const o=btn.textContent;btn.textContent='Đã chép';setTimeout(()=>btn.textContent=o,1200)})}
function pictureSlot(t,inp){
  const m=/Picture (\d+)/.exec(inp.label);if(!m)return '';
  const n=m[1],ar=t.aspectRatio.replace(':','/');
  const base='media/'+t.id+'/picture-'+n;
  return '<div class="slot pic" style="--ar:'+ar+'"><img src="'+base+'.jpg" alt="" loading="lazy" data-base="'+base+'" data-i="0"><div class="ph" hidden>'+base+'.jpg</div></div>';
}
function card(t){
  const ar=t.aspectRatio.replace(':','/');
  const vbase='media/'+t.id+'/preview';
  const inputs=t.inputs.map(i=>{
    const ip=i.imagePrompt?'<details><summary>Image prompt</summary><pre>'+esc(i.imagePrompt)+'</pre><button class="small" data-copy="ip">Chép</button></details>':'';
    return '<div class="inp"><code>'+esc(i.label)+'</code> '+esc(L(i.role))+ip+'</div>';
  }).join('');
  const pics=t.inputs.map(i=>pictureSlot(t,i)).join('');
  return '<article class="card" data-id="'+t.id+'">'+
   '<div class="row"><h2>'+esc(L(t.title))+'</h2><button class="small" data-copy="id">'+esc(t.id)+'</button></div>'+
   '<div class="badges"><span class="b acc">'+t.category+'</span><span class="b">'+t.mode+' &middot; '+MODE[t.mode]+'</span><span class="b">'+t.aspectRatio+'</span><span class="b">'+t.durationSec+'s</span><span class="b">'+t.source+'</span></div>'+
   '<p>'+esc(L(t.description))+'</p>'+
   '<div class="media"><div class="slot vid" style="--ar:'+ar+'"><video src="'+vbase+'.mp4" poster="'+vbase+'.jpg" controls loop muted preload="metadata"></video><div class="ph" hidden>'+vbase+'.mp4</div></div>'+pics+'</div>'+
   inputs+
   '<details><summary>Prompt đầy đủ</summary><pre>'+esc(t.prompt)+'</pre><button class="small" data-copy="prompt">Chép prompt</button></details>'+
   '</article>';
}
function render(){
  const q=$('q').value.toLowerCase(),c=$('cat').value,m=$('mode').value,a=$('ar').value,s=$('src').value;
  const items=D.templates.filter(t=>(!c||t.category===c)&&(!m||t.mode===m)&&(!a||t.aspectRatio===a)&&(!s||t.source===s)&&
    (!q||(t.id+' '+t.title.en+' '+t.title.vi+' '+t.description.en+' '+t.description.vi+' '+t.prompt).toLowerCase().includes(q)));
  $('list').innerHTML=items.map(card).join('');
  $('count').textContent=items.length+' / '+D.templates.length;
  $('list').querySelectorAll('video').forEach(v=>v.addEventListener('error',()=>{v.hidden=true;v.nextElementSibling.hidden=false},{once:true}));
  $('list').querySelectorAll('.pic img').forEach(img=>img.addEventListener('error',function f(){
    const i=+img.dataset.i+1;
    if(i<exts.length){img.dataset.i=i;img.src=img.dataset.base+'.'+exts[i]}else{img.hidden=true;img.nextElementSibling.hidden=false}
  }));
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;
  const t=D.templates.find(x=>x.id===b.closest('.card').dataset.id);
  const k=b.dataset.copy;
  copy(b,k==='id'?t.id:k==='prompt'?t.prompt:b.previousElementSibling.textContent);
});
['q','cat','mode','ar','src'].forEach(id=>$(id).addEventListener('input',render));
$('lang').onclick=()=>{lang=lang==='vi'?'en':'vi';fillCats();render()};
fillCats();render();
</script>
</body>
