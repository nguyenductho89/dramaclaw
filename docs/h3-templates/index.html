stone and flame.\n00:12 — Both fighters unleash their final attacks simultaneously as the camera circles them in dramatic slow motion.\n00:14 — A blinding explosion consumes the battlefield.\n00:15 — The smoke begins to clear, revealing only a mysterious silhouette without showing who won.\nUse dynamic tracking shots, dramatic low angles, rapid orbiting camera movement, extreme close-ups, speed ramps, controlled handheld energy, and slow motion during key impacts.\nCinematic 4K, 16:9, ultra-realistic VFX, physically accurate destruction, volumetric smoke, plasma energy, fire, sparks, debris, lightning, synchronized impact sounds, futuristic weapon audio, primal roars, distinct English voices, and a cinematic orchestral score mixed with electronic pulses and tribal percussion.","media":{"video":true,"refs":[]},"credit":{"author":"@alex_bagnuoli89","authorUrl":"https://x.com/alex_bagnuoli89","postUrl":"https://x.com/alex_bagnuoli89/status/2083207597025354071"}},{"id":"apim_gnBD0ErT","source":"apimodels","category":"cinematic","title":{"en":"Storm-Lit Pirate Galleon Battle","vi":"Chiến hạm hải tặc đấu pháo trong bão"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Open ocean, storm-lit sky, two massive wooden galleons broadside to broadside, cannons blazing, sails torn and smoking.\nLOCATION: towering waves, rain-slicked decks, splintering wood, the ships as looming wooden fortresses dwarfing the men fighting on them. Grey-green storm light, cannon smoke rolling across the water like fog.\nACTORS: two pirate crews — one crew in ragged dark coats and bandanas led by a scarred captain wielding a cutlass and flintlock; the other crew in stolen naval coats, more disciplined but outnumbered. Dozens of background fighters clashing across both decks.\nMOVEMENT: heavy, physical combat — swinging on rigging ropes across the gap between ships, cutlass clashes with real weight and follow-through, men thrown by cannon blasts, boots slipping on wet planks.\nINTERACTION: the two captains as the emotional throughline — circling each other through the chaos, their duel the spine of the sequence while the crews fight around them.\nCINEMATOGRAPHY (Kubrick-style): open with a long, wide, almost painterly establishing shot of the two ships closing in through the storm — hold it, let the dread build before the first cannon fires. Use symmetry in the initial approach (ships mirrored on either side of frame), then shatter that order completely once battle erupts. Favor a few extended tracking shots through the melee (a single unbroken move weaving across the deck) rather than only quick cuts, so the audience feels physically present in the chaos, punctuated by hard cuts at moments of violence.\nCUTS:\n1. Wide establishing shot: the two galleons converging through rain and swell, lightning flashing behind torn sails, ominous and silent but for wind and creaking timber. Hold long.\n2. Close-up: the pirate captain's face, rain streaming down a scarred cheek, eyes narrowing, hand tightening on his cutlass hilt.\n3. Wide shot: cannons fire in unison from both ships — deafening flash and smoke, the hulls shuddering, wood splintering on impact, rigging snapping and crashing to the deck.\n4. Grappling hooks fly across the gap, biting into the enemy ship's rail; ships lurch together with a groan of timber as the gap closes.\n5. Long tracking shot: pirates swing across on ropes into the fray, landing mid-swing into combat — camera follows one pirate's full arc from rail to rail without cutting, weapons clashing all around as he lands and immediately engages.\n6. Fast cuts through the melee: cutlass parries, a pistol shot at close range, a man thrown overboard by a cannon's recoil, barrels rolling loose across the tilting deck.\n7. Medium shot: the two captains spot each other across the chaos, a beat of stillness in the middle of battle, then they cut a path toward one another through the fighting.\n8. Close-up duel: blades clash in tight, brutal exchanges, rain and sweat, snarled dialogue, one captain slammed back against the mast.\n9. Wide shot: a mast cracks and begins to fall, crew scattering, fire catching on torn sailcloth, chaos peaking as both crews scramble.\n10. Final close combat: the rival captain disarmed, blade at his throat — beat of hesitation, thunder cracks, and the scene holds on the standoff rather than resolving cleanly, smoke and rain swirling around them both.\nCamera: mostly handheld-feel tracking shots through the melee for immersion, hard cuts on cannon fire and key hits, a still symmetrical wide shot to open","media":{"video":true,"refs":[]},"credit":{"author":"@seirdotmk","authorUrl":"https://x.com/seirdotmk","postUrl":"https://x.com/seirdotmk/status/2083582886280561048"}},{"id":"apim_Sv7pHpNh","source":"apimodels","category":"ui","title":{"en":"Modern warfare FPS gameplay","vi":"Gameplay FPS chiến tranh hiện đại"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Camera: First-person perspective at eye level with authentic handheld player movement, as if recorded directly from a modern AAA military shooter. The player carries a highly detailed assault rifle with realistic animations, visible hands, tactical gloves, dynamic reload mechanics, and weapon sway.  **Opening Action:** The video immediately begins with the player already aiming down a roadway inside a modern military base. Multiple enemy soldiers are visible in the distance near sandbags, barricades, and military vehicles. The player carefully tracks one target, making small aim corrections while maintaining ADS (aim down sights). Fire several controlled bursts immediately at the visible enemies, producing realistic muzzle flashes, shell casings ejecting, smoke, recoil, hit reactions, and dust impacts around the targets. Continue firing in multiple short bursts while adjusting aim between enemies, simulating authentic FPS gameplay rather than scripted animation.  **Movement:** After the opening firefight, lower slightly from ADS and begin advancing cautiously along the road beside concrete barriers, Hesco walls, and parked military vehicles. Frequently check left and right corners, briefly stop to reacquire targets, then raise the weapon and fire additional controlled bursts whenever enemies appear ahead. Continue pushing forward with deliberate player-controlled movement, using cover naturally and maintaining believable tactical pacing.  **Environment:** Large modern military base with guard towers, armored vehicles, shipping containers, blast barriers, damaged buildings, smoke plumes, burning debris, scattered shell casings, dust clouds, and atmospheric battlefield haze. Cool natural daylight mixed with smoke and orange firelight creates a cinematic battlefield atmosphere.  **Camera Motion:** Authentic player-controlled movement with subtle head bob, weapon sway, natural mouse-look adjustments, small left-right corrections while aiming, realistic recoil, smooth tracking of moving targets, brief pauses before shooting, and fluid forward progression. Avoid cinematic camera moves—everything should feel like genuine live gameplay captured by a skilled player.  **Visual Quality:** Ultra-photorealistic, AAA game graphics with realistic PBR materials, detailed weapon models, physically accurate lighting, volumetric smoke, dynamic particle effects, crisp textures, realistic bullet impacts, muzzle flash illumination, motion blur only during rapid movement, and high-end military shooter presentation.  **Gameplay UI:** Display a realistic modern FPS HUD inspired by games like PUBG, Battlefield, or Call of Duty (without copying exact copyrighted assets). Include:  * Central dynamic crosshair or reticle * Ammo counter with magazine and reserve ammunition * Fire mode indicator * Compass at the top * Squad/team status panel * Mini-map in the upper corner * Health bar * Tactical equipment icons (grenades, medkit) * Hit markers when bullets connect * Directional damage indicators * Kill notification feed * Objective marker in the distance * Subtle interaction prompts and realistic HUD animations  The HUD should feel polished, modern, and fully integrated into the gameplay, enhancing the illusion of authentic recorded footage from a contemporary military FPS.","media":{"video":true,"refs":[]},"credit":{"author":"@Just_sharon7","authorUrl":"https://x.com/Just_sharon7","postUrl":"https://x.com/Just_sharon7/status/2083064417798025721"}},{"id":"apim_bFxjCC_2","source":"apimodels","category":"ecommerce","title":{"en":"Neon Nightmare Burger Commercial","vi":"Quảng cáo burger ác mộng neon"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Cinematic 15-second commercial shot, fast-paced editing, dark humor, creepy comedy style. Ultra-realistic, 8k resolution. A surreal hamburger restaurant with moody neon lighting (red and green). Close-ups of distorted, wide-eyed hungry people smiling creepily while eating massive juicy cheeseburgers. Fast cuts: sizzling bacon in flames, towering stacks of burger trays, a mysterious retro waiter with a unnerving wide smile. Hyper-detailed melted cheese, glossy sauce drips, chaotic and fun atmosphere, 90s thriller aesthetic crossed with a fast-food ad.","media":{"video":true,"refs":[]},"credit":{"author":"@xavier_mitjana","authorUrl":"https://x.com/xavier_mitjana","postUrl":"https://x.com/xavier_mitjana/status/2082549709240160587"}},{"id":"apim_TX0O32dO","source":"apimodels","category":"ecommerce","title":{"en":"Luxury Emerald Necklace Storyboard","vi":"Storyboard dây chuyền ngọc lục bảo cao cấp"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"TITLE: Luxury Emerald Necklace Commercial Storyboard\nFORMAT:\n• Single-page premium storyboard\n• 3:4 portrait ratio\n• Editorial presentation board\n• 8 cinematic frames arranged in a clean luxury grid\n• Ultra-high-resolution, 8K\nHEADER:\n• Elegant serif typography\n• White, emerald green, champagne gold, and black luxury palette\n• Premium information cards\n• Luxury jewelry icons\n• Section: \"Why This Style Works\"\nSTORYBOARD SCENES:\n1. A handcrafted emerald necklace resting inside an elegant velvet jewelry box on polished black marble under a dramatic spotlight.\n2. The jewelry box slowly opening as warm golden light reveals the brilliant emerald necklace.\n3. Extreme macro close-up of the emerald gemstone and diamond accents with breathtaking clarity, crystal reflections, and luxurious sparkle.\n4. A graceful woman preparing for an exclusive gala, delicately lifting the necklace from the box.\n5. The emerald necklace being elegantly fastened around her neck, emphasizing craftsmanship and sophistication.\n6. Emotional cinematic close-up highlighting the necklace glowing against flawless skin with soft luxury lighting.\n7. High-fashion editorial portrait featuring the model in an elegant couture gown, with the emerald necklace as the unmistakable focal point.\n8. Hero product shot of the emerald necklace displayed on a glossy black reflective pedestal surrounded by floating emerald particles, subtle golden dust, dramatic rim lighting, and premium luxury branding composition.\nSTYLE:\nInspired by world-class luxury jewelry campaigns, premium fashion editorial, soft cinematic lighting, refined elegance, crystal-clear gemstone reflections, ultra-realistic textures, shallow depth of field, award-winning commercial photography, luxury branding aesthetic, 8K masterpiece.","media":{"video":true,"refs":[]},"credit":{"author":"@itxabdullaa","authorUrl":"https://x.com/itxabdullaa","postUrl":"https://x.com/itxabdullaa/status/2082667261718872509"}},{"id":"apim_lCLus13p","source":"apimodels","category":"ecommerce","title":{"en":"Ultra-premium cinematic luxury perfume commercial","vi":"Quảng cáo nước hoa đ he salmon and tuna while the background softly blurs. Ambient apartment sounds only.\nSHOT 4 (6–8s) — The Pick-Up\nLow candid angle as chopsticks lift a salmon nigiri. Natural movement, slight handheld shake like a friend filming across the table.\nSHOT 5 (8–10s) — The Reaction\nBack to selfie cam. She takes a bite, smiles with widened eyes.\nDialogue: \"Wow... that's amazing.\"\nSHOT 6 (10–12s) — The Cutaway\nClose handheld shot of the sushi tray on the table while her hand reaches in for another piece just outside the frame. Casual lifestyle b-roll feel.\nSHOT 7 (12–14s) — The Wrap-Up\nSelfie angle. She raises a piece of sushi with chopsticks toward the camera.\nDialogue: \"Best decision tonight.\"\nSHOT 8 (14–15s) — End Tag\nQuick freeze on the sushi tray with natural handheld wobble. Soft handwritten-style overlay: \"sushi night = perfect 🍣\" Cut to black.\nLook & Feel\nWarm indoor lighting, slightly grainy smartphone sensor look, imperfect framing, authentic reactions, minimal dialogue (3 short lines), hard jump cuts, casual pacing, genuine creator content.\nNegative Prompt\ncinematic color grading, overly smooth gimbal movement, studio lighting, professional voiceover, staged acting, CGI food, unrealistic fish texture, distorted sushi, extra fingers, warped hands, text glitches, logo distortion, overly polished commercial feel.","media":{"video":true,"refs":[]},"credit":{"author":"@oggii_0","authorUrl":"https://x.com/oggii_0","postUrl":"https://x.com/oggii_0/status/2082837405812613617"}},{"id":"apim_qe4MLPFZ","source":"apimodels","category":"ecommerce","title":{"en":"Marble Staircase Lip Gloss Commercial","vi":"Quảng cáo son bóng trên bậc đá cẩm thạch"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Use the uploaded reference image as the exact character reference. Preserve her facial identity, hairstyle, eye color, makeup, skin tone, body proportions, pearl necklace, rings, and facial consist KALDR đa ảnh tham chiếu"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"REFERENCE USAGE:\nImage 1 — the KALDR bottle. Preserve the smoked charcoal glass, bevelled edges, pale blue liquid, brushed gunmetal cap and the etched silver KALDR mark exactly.\nImage 2 — the closing brand lockup. Preserve the letterforms, tracking, silver finish and the COLD KEEPS line exactly. It appears only in the final shot, alone on black.\nImage 3 — the location, palette, cloud, surf and film texture for the whole film.\nImage 4 — a three panel character sheet of the woman. Use it only to match her face, hair, frost detail and black greatcoat. Do not reproduce the sheet's panel layout, its grey backdrop or its flat studio lighting. She must appear as a single person inside the Image 3 environment, lit by that location.\nAudio 1 — the voice for the woman's spoken line. Match its timbre, pitch, accent, breathiness and pacing exactly. Use it only for her voice, not as background audio or ambience.\nPremium luxury fragrance brand film. Photoreal 35mm anamorphic, high contrast, fine grain, cold specular highlights, deep crushed blacks. Palette strictly black sand, gunmetal, glacial blue and silver, with no warm tones anywhere. Setting: a black volcanic beach on a northern coast at blue hour under heavy storm cloud. Tone: severe, violent, expensive. This is a fast, aggressive fashion edit, not a calm product film. Never slow, never ceremonial, never a slideshow of pretty holds.\n[0-1.5s] Cold open, no establishing shot. Camera at water level, lens half submerged, [Static shot]. A sheet of freezing surf races straight at the lens. Her boots stride hard into frame through the water, coat hem whipping. HARD CUT.\n[1.5-2.6s] Extreme macro insert. Frost crystals race across black glass and flood the etched KALDR mark with rime, filling the letters. HARD CUT.\n[2.6-4.2s] Behind her, low and close, [Tracking shot] pushing fast. She walks straight into an oncoming wave that towers over her, coat streaming sideways, never breaking stride. HARD CUT.\n[4.2-5.4s] Reverse, low angle from the water. The wave collapses over her. Camera [Shake] on the impact. Cut on the peak of the white spray. HARD CUT.\n[5.4-9s] SLOW MOTION. The wave freezes solid around her mid collapse. She stands inside a shell of blue black ice, the spray suspended in the air as a thousand hanging shards, her coat frozen mid snap, her face calm and unbothered. Camera [Tracking shot] orbits right through the suspended shards, holding her at centre. This is the hero image of the film.\n[9-9.8s] Snap back to real time. The ice shell detonates outward. Camera [Pull out] fast and hard through the exploding shards. HARD CUT.\n[9.8-12.6s] Tight close up, [Push in]. She walks out of the collapsing ice straight at the lens, ice water running off her coat, looking directly into camera. She says quietly: \"I was never meant to melt.\" She holds the look for a beat after the line. HARD CUT.\n[12.6-13.8s] The bottle alone, upright on wet black sand, shot low and close on a macro lens. Frost blooms outward from its base toward the lens. No text of any kind in this shot. HARD CUT.\n[13.8-15s] Pure black frame. The brand lockup from Image 2 appears alone, centred, exactly as in the reference. The wordmark KALDR emerges from darkness at low opacity, letter spacing opening over 0.4 seconds into sharp focus with a faint edge glow, and the line COLD KEEPS sits smaller beneath it. Nothing else is in this frame. Critical: the bottle, the woman, the beach and the wordmark must never share a frame. The lockup must never overlap or be occluded by the bottle, and the etched mark on the glass must never appear in the same shot as the lockup. Hold the lockup to the end.\nDialogue and lip sync: only one line is spoken, in the shot beginning at 9.8 seconds: \"I was never meant to melt.\" Match the voice in Audio 1 exactly, including its timbre, breathiness, pacing and the way the sentence lands without rising at the end. Do not substitute a different voice, do not add reverb or processing that changes its character. Her lip movement must match the words frame accurately and stop when the line ends. Her breath fogs on the words. Do not repeat the line and do not add any other spoken words anywhere in the film.\nPacing: hold every cut until its stated timecode and do not shorten the last two shots. The first four shots are fast and aggressive. The slow motion shot is the only long hold in the film. Everything after it is fast again.\nAudio: hard coastal wind, heavy surf, a low sub bass drone. At 5.8 seconds, one deep impact hit, a splintering glass freeze crackle and a reversed swell. Then cut the wind, the surf and all low end to complete silence from 6 seconds to 9 seconds, leaving only isolated ice ticks and faint crystal ring in that window. This silence is mandatory and must be obvious. At 9 seconds the full mix slams back in with a hard low kick and the crash of shattering ice into water. As she speaks, duck the wind, surf and low end so her voice sits forward and dry. The final second holds one sustained low string chord decaying into wind. No voiceover, no narrator, no lyrics, no recognisable melody.\nDo not add other people, boats, buildings, vehicles, modern objects, subtitles, on screen captions, watermarks, or any text other than specified. Do not warp or distort the bottle or the wordmark. No cartoon or plastic CGI water or ice. Keep skin texture real, no over smoothing. Never let the ice or spray form a face, eyes, or a creature.","media":{"video":true,"refs":[]},"credit":{"author":"@abulu8","authorUrl":"https://x.com/abulu8","postUrl":"https://x.com/abulu8/status/2082919486399943073"}},{"id":"apim_9uXdNINC","source":"apimodels","category":"ecommerce","title":{"en":"Luxury Sports Car Landing Page Motion","vi":"Chuyển động landing page siêu xe sang"},"description":{"en":"","vi":""},"mode":"","genMode":""," 16:9","durationSec":null,"inputs":[],"prompt":"Here`s the storyboard\nTITLE: Luxury Watch Commercial Storyboard\nCreate a premium single-page storyboard for a luxury watch commercial.\nEditorial presentation board.\n3:4 portrait.\nEight cinematic storyboard frames arranged in a clean luxury grid.\nMinimalist Swiss-inspired design.\nPremium typography.\nBlack, silver and champagne gold color palette.\nProfessional creative agency presentation.\nEach frame should look like a film storyboard while remaining highly realistic.\nFrame 1:\nLuxury mechanical watch inside an elegant leather presentation box.\nFrame 2:\nPresentation box opens revealing the watch with dramatic golden light.\nFrame 3:\nExtreme macro shot of the dial, hands, gears and sapphire crystal.\nFrame 4:\nElegant gentleman lifting the watch before a black-tie gala.\nFrame 5:\nWatch being fastened onto his wrist.\nFrame 6:\nClose-up of the sweeping second hand catching warm reflections.\nFrame 7:\nFashion editorial portrait with the watch as the hero.\nFrame 8:\nHero product shot on glossy black marble with floating metallic particles.\nLuxury presentation board.\nAgency-quality storyboard.\nMinimal annotations.\nWhite background.\n8K.\nUse storyboard as the complete creative direction, shot list, composition, pacing, and cinematic sequence.\nUse LuxuryWatch as the exact product reference. Preserve the watch's design, dial, case, leather strap, proportions, materials, and fine details consistently throughout every scene.\nCreate a world-class luxury watch commercial.","media":{"video":true,"refs":[]},"credit":{"author":"@I_amShiti","authorUrl":"https://x.com/I_amShiti","postUrl":"https://x.com/I_amShiti/status/2083051609953903017"}},{"id":"apim_efIHXZ7E","source":"apimodels","category":"ecommerce","title":{"en":"Black-and-Gold Perfume Commercial","vi":"Quảng cáo nước hoa đen vàng"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Create a 1 "00:02\",       \"camera_angle\": \"Close-up\",       \"subject\": \"Strawberry\",       \"action\": \"A single, dull strawberry transforms into a vibrant, ripe strawberry, floating against a pink background.\",       \"visual_details\": \"Initial strawberry is muted, then becomes intensely red with visible seeds; pink background; subtle glow effect.\",       \"audio_cues\": \"Light, subtle, almost magical sound effect.\"     },     {       \"shot_id\": \"2\",       \"start_time\": \"00:02\",       \"end_time\": \"00:05\",       \"camera_angle\": \"Medium shot\",       \"subject\": \"Strawberry and beverage can\",       \"action\": \"The vibrant strawberry transforms into a white and pink beverage can with 'STRAWBERRY CREAM' text. Liquid pours into the can from above, and strawberries/water droplets float around it.\",       \"visual_details\": \"Can is sleek, covered in condensation; red liquid splashing into the can; numerous floating strawberries (whole and sliced) and water droplets; pink background.\",       \"audio_cues\": \"Sound of liquid pouring, bubbling, and light splashes; upbeat, commercial-style music.\"     },     {       \"shot_id\": \"3\",       \"start_time\": \"00:06\",       \"end_time\": \"00:10\",       \"camera_angle\": \"Close-up\",       \"subject\": \"Top of the beverage can\",       \"action\": \"Focus on the top of the can as the liquid continues to pour and splash, with droplets and strawberries in motion.\",       \"visual_details\": \"Intricate details of the can's opening and condensation; dynamic splashes of liquid; close-up of floating strawberry pieces.\",       \"audio_cues\": \"Enhanced sounds of liquid splashing and bubbling; continued music.\"     },   ] }","media":{"video":true,"refs":[]},"credit":{"author":"@GumVue","authorUrl":"https://x.com/GumVue","postUrl":"https://x.com/GumVue/status/2083189719827878083"}},{"id":"apim_34OWvenU","source":"apimodels","category":"ecommerce","title":{"en":"Yellow Sunglasses in a Black Studio","vi":"Kính râm vàng trong studio đen"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"[Upload reference ] + Use la ragazza in reference  as a strict identity reference for the model and her yellow sunglasses.\nPreserve face, hair, and the exact frame shape and colour throughout.\n15 seconds, 16:9. Premium fashion commercial, photoreal live action.\nInfinite black void, polished black floor. She is the only lit element: hard key from\none side, second hard light from the other, deep shadow between, strong speculars on\nthe yellow frame and lenses.\nShe walks slowly toward the camera in a black high-neck top and long black coat, chin\nlevel, eyes on the lens. Camera tracks backward at her pace, holding her size in frame.\nAll type is heavy condensed uppercase sans-serif in vivid yellow, rendered as physical\nobjects in 3D perspective with real thickness, catching the same light as she does and\ncasting faint shadows on the floor.\n[0-4s] LOOK rises out of the floor ahead of her in deep perspective, grows as she\napproaches, and sweeps past on both sides out of frame.\n[4-7s] SEE enters from the right at high speed, streaks behind her with heavy motion\nblur, exits left.\n[7-10s] FOCUS appears large and fully out of focus, resolves into razor sharpness over\nhalf a second, holds, breaks apart.\n[10-12s] Four thin yellow lines draw a rectangle around her and FRAME assembles along\nits lower edge.\nThroughout, passing type reflects across the glossy lenses as it moves near her.\n[12-15s] She stops. All type collapses inward and vanishes into black. The camera\ncontinues into a tight close-up on her face and the yellow sunglasses. She holds\ncompletely still, eyes on the lens. On the black beneath her the title composes in the\nsame yellow type: \"SHIOBA LENS\", and below it, smaller: \"MADE TO BE SEEN\". Hold.\nAll text clean, legible, correctly spelled English capitals, each word once only. No\ngarbled or duplicated letters, misspellings, subtitles, watermarks, or other text or\nlogos.\nAudio: low sustained bass,\nComposition: model centered, all type within the central third of the frame","media":{"video":true,"refs":[]},"credit":{"author":"@shikoba_86","authorUrl":"https://x.com/shikoba_86","postUrl":"https://x.com/shikoba_86/status/2083225662316265763"}},{"id":"apim_Qlxhjgzl","source":"apimodels","category":"audio","title":{"en":"Surreal Blue Studio Dance with a Horse","vi":"Chụp studio xanh siêu thực: nhảy cùng ngựa"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Use @ Image1 as the man reference.\nUse @ Image2 as the woman reference.\nUse @ Image3 as the horse reference.\nCreate a surreal 15-second fashion-film sequence inside a minimalist monochrome blue studio.  The woman performs an elegant contemporary dance.  The man casually walks into frame wearing a completely serious expression.  Without explanation, he immediately joins the choreography.  His movements are awkward, strangely confident, almost ritualistic.  The woman never acknowledges him.  The horse behaves as though both dancers are part of its routine.  It wanders through the studio.  Runs behind them.  Appears from impossible places.  Stops.  Looks directly into the camera.  Leaves.  Returns again.  Sometimes all three performers accidentally synchronize for one beat before drifting apart again.  The choreography becomes increasingly absurd but remains perfectly cinematic.  Every movement is intentional.  Every frame feels designed.  Throughout the sequence, premium kinetic typography appears as part of the composition, not subtitles, but editorial motion graphics inspired by high-end After Effects title design.  Animated words flash for only a few frames:  THE GARDENER.  THE DRIVER.  THE HORSE.  THE WOMAN.  KNIFE.  MOVE.  FASTER.  AGAIN.  THE EXIT. These words slam into frame, wrap around the dancers, disappear behind bodies, stretch with motion blur, rotate in 3D, fragment into pieces, reveal through masks, pulse with the bass, smear across cuts, become oversized, tiny, vertical, upside down, and constantly transform using premium motion-design techniques.  Add abstract editorial graphics: animated arrows, circles, blueprint lines, tape labels, interface markers, halftone textures, scribbles, grain, tracking graphics, geometric overlays, chromatic aberration, liquid masks, flash frames, split screens, typography trails, speed ramps and graphic wipes.  Music evolves into strange electronic art-pop.  Analog synths.  Mechanical breathing.  Heavy bass.  Everything is synchronized to the rhythm.  Final close-up.  The woman whispers:  \"Again.\"  The man quietly smiles for the first time.  The horse suddenly sprints directly toward the camera.  The word  AGAIN.  fills the screen before an instant cut to black.","media":{"video":true,"refs":[]},"credit":{"author":"@egeberkina","authorUrl":"https://x.com/egeberkina","postUrl":"https://x.com/egeberkina/status/2083301476206588086"}},{"id":"apim__1_j4rvk","source":"apimodels","category":"ecommerce","title":{"en":"Luxury perfume commercial","vi":"Quảng cáo nước hoa xa xỉ"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":3,"inputs":[],"prompt":"Scene 1 (0–3s) – Luxury Reveal\nA luxury perfume bottle slowly emerges from darkness, standing on a glossy black pedestal. Soft golden light beams gradually reveal the crystal-clear glass, while subtle volumetric fog creates depth. Extreme macro shot, cinematic lighting, ultra-realistic reflections, premium luxury commercial aesthetic.\nScene 2 (3–6s) – Precision Details\nExtreme close-up of the perfume bottle as rich golden fragrance liquid gently swirls inside. The camera performs a smooth cinematic orbit, capturing intricate glass textures, flawless craftsmanship, and sparkling highlights. Ultra-detailed, photorealistic, premium commercial quality.\nScene 3 (6–9s) – AI Transformation\nThe perfume bottle seamlessly dissolves into glowing golden particles before instantly reforming into a futuristic luxury edition, maintaining perfect proportions and visual consistency. Dynamic orbit camera, seamless transformation, cinematic lighting, premium visual effects.\nScene 4 (9–12s) – Environment Transition\nWithout a single cut, the background transforms from a luxurious black studio into a futuristic neon metropolis. The perfume bottle remains perfectly consistent while the camera performs a dramatic dolly-in. Hyper-realistic, cinematic, high-end advertising style.\nScene 5 (12–15s) – Hero Finale\nSlow-motion hero shot of the luxury perfume bottle elegantly rotating as glowing golden particles float around it. Premium black background, flawless reflections, cinematic logo reveal, luxury commercial ending, 8K photorealistic, blockbuster advertising quality.","media":{"video":true,"refs":[]},"credit":{"author":"@CaliraVal","authorUrl":"https://x.com/CaliraVal","postUrl":"https://x.com/CaliraVal/status/2083059583308751079"}},{"id":"apim_izoqkin6","source":"apimodels","category":"cinematic","title":{"en":"Little Robot Cyberpunk Escape","vi":"Cuộc chạy trốn cyberpunk của robot nhỏ"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"A stunning action packed scene following a little robot running away from soldiers, drones and other things that are trying to get him. Chase cam, dystopian futuristic cyberpunk environment, cinematic lighting. The camera follows the robot from behind, chase cam style. Every now and then the robot looks behind him and the entities chasing it are shown.","media":{"video":true,"refs":[]},"credit":{"author":"@AIandDesign","authorUrl":"https://x.com/AIandDesign","postUrl":"https://x.com/AIandDesign/status/2082522979339288619"}},{"id":"apim__iVZanyp","source":"apimodels","category":"drama","title":{"en":"Live-action relationship confession drama scene","vi":"Cảnh tỏ tình tình cảm người thật"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Grounded photorealistic live-action relationship drama, natural 24fps motion.\nFORMAT\nTwo connected 15-second clips, 16:9, grounded photorealistic live-action relationship drama, natural 24fps motion.\nSHARED STYLE\nA small living room at night. One warm floor lamp mixes with cold blue streetlight through the curtains. A framed wedding photograph hangs behind the couple. Restrained handheld camera, realistic skin and fabric, tense silence, no melodramatic shouting.\nCONTINUITY\nThe husband remains frame left beside the coffee table, holding his wife’s unlocked phone containing the evidence. The wife remains frame right near the window. Preserve their faces, clothes, positions and screen direction across every cut.\nCLIP 1 — THE CONFESSION\n0.0–5.0\nCamera: Slow 35mm push toward both characters.\nAction: The husband stares at the phone, then raises his eyes toward her.\nHUSBAND: “How long has this been going on?”\n5.0–8.0\nCamera: Cut to a restrained 50mm close-up of the wife.\nAction: She cannot meet his eyes. After a short pause:\nWIFE: “Six months.”\n8.0–15.0\nCamera: Close on the husband. His grip tightens around the phone, but he controls his voice.\nHUSBAND: “Six months? I gave you twelve years. Why?”\nFinal frame: The wife finally looks directly at him, preparing to answer.\nCLIP 2 — THE REASON\nBegin from the exact positions and expressions inherited from Clip 1.\n0.0–6.5\nCamera: Slow push toward the wife as she folds her arms defensively.\nWIFE: “Because I’m tired of being broke. Every dream with you becomes ‘maybe one day.’”\n6.5–10.0\nCamera: Cut to the husband. His anger gives way to disbelief.\nHUSBAND: “So you chose him for his money?”\n10.0–15.0\nCamera: Return to the wife. She holds his gaze without apologizing.\nWIFE: “I chose someone who can give me the life I want.”\nFinal frame: Hold on the husband as the meaning lands. His hand lowers, and the phone slips onto the sofa.","media":{"video":true,"refs":[]},"credit":{"author":"@NEXUS_TO_NOVA","authorUrl":"https://x.com/NEXUS_TO_NOVA","postUrl":"https://x.com/NEXUS_TO_NOVA/status/2082548512286224793"}},{"id":"apim_8FDsaCcP","source":"apimodels","category":"cinematic","title":{"en":"Hard sci-fi desert 3x3 grid animation sequence","vi":"Chuỗi lưới 3x3 sci-fi sa mạc"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":7,"inputs":[],"prompt":"Epic desert sci-fi, harsh golden-hour light, volumetric sand haze, anamorphic lens flares, subtle handheld drift, heavy atmospheric particles, 35mm film texture.\nUse the provided 3x3 grid as the only visual reference. Lock the exact same woman (face, scars, green eyes, headscarf, desert armor, cape) and environments from every panel. Do not invent new outfits or faces.\n[TIMELINE] 0-1.7s: [Wide establishing] Lone figure walking across endless dunes toward twin massive suns. Heat shimmer, long shadow stretching behind her.\n1.7-3.4s: [Extreme close-up] Her scarred face fills the frame. Eyes locked on camera, wind tugging the dirty headscarf, grit on skin, unblinking intensity.\n3.4-5.1s: [Tight detail insert] Gloved hand grips the rusted multi-tool weapon. Metal catches the orange light, cable dangling, fingers adjusting the grip with quiet precision.\n5.1-6.8s: [Low wide silhouette] The towering industrial structure rises against the giant sun. Dust storms swirl at its base, scale feeling ancient and oppressive.\n6.8-8.5s: [Medium tracking] She advances through thick sandstorm, lower face wrapped, cape and scarf whipping hard. Eyes visible above the cloth, determined stride.\n8.5-10.2s: [Hero wide] She stands alone on the rocky outcrop, cape flowing, surveying the empty desert below. Wind howls, silhouette sharp against the hazy sky.\n10.2-11.9s: [Dynamic tracking + low angle] She charges down the steep dune face, boots kicking up thick clouds of sand, body leaning forward with full momentum.\n11.9-13.6s: [Macro atmospheric] Golden sand particles explode and float in extreme slow motion, backlit by the blazing sun, pure texture and light.\n13.6-15s: [Intimate close-up] Inside the dark cave, shafts of light cut through. She sits against the rock, armor dusted, breathing controlled, eyes sharp and watching the entrance.\nPhotorealistic, ultra-detailed skin and fabric textures, perfect sand physics, coherent character identity across every cut, cinematic color grade, heavy film grain, no artifacts, movie-level continuity.","media":{"video":true,"refs":[]},"credit":{"author":"@techhalla","authorUrl":"https://x.com/techhalla","postUrl":"https://x.com/techhalla/status/2082611421225845158"}},{"id":"apim_h3_05_dark_fanta","source":"apimodels","category":"cinematic","title":{"en":"Dark-Fantasy Tavern Fight","vi":"Ẩu đả quán rượu dark fantasy"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Style: Hyper-realistic dark fantasy tavern cinematic, grounded physical combat, realistic body momentum, medieval atmosphere, gritty lighting, practical effects, handheld cinematic camera, physically accurate movement, ultra-detailed textures, realistic collisions and environmental interaction.\nDuration: 15 seconds\nAspect Ratio: 16:9\nIMPORTANT:\nKeep the SAME characters fully consistent with the reference: 📷Image1\n— Nyssa: athletic woman, dark curly hair tied back, bronze leather armor, cloth wraps, sword on hip\n— Grok: massive muscular green orc, scarred skin, fur armor, heavy axes, large physical weight\nCombat MUST obey realistic physics:\n— no floating\n— no anime flips\n— realistic inertia and recovery\n— believable weight transfer\n— realistic impacts and exhaustion\n— grounded footwork\n— environment reacts physically to impacts\n[00:00-00:02]\nWide cinematic shot inside a crowded medieval tavern filled with drunk mercenaries, candles, smoke, spilled ale, and loud cheering. Nyssa walks through the tavern cautiously while patrons stare. Grok sits at a massive wooden table drinking heavily. Deep bass-heavy tavern music and crowd ambience.\n[00:02-00:04]\nClose-up tension sequence:\n— Nyssa locks eyes with Grok\n— Grok slowly stands, towering over everyone\n— benches scrape across the floor\n— mugs shake from his weight\n— crowd forms a fighting circle cheering loudly\nHandheld camera movement feels realistic and grounded.\n[00:04-00:07]\nThe fight erupts violently. Grok swings a heavy punch with believable momentum. Nyssa narrowly dodges while stumbling realistically into a wooden table. Wood cracks and splinters physically on impact. She counters with fast grounded strikes to Grok’s ribs and legs. Crowd roars and throws coins and mugs into the air.\n[00:07-00:10]\nCombat intensifies through the tavern:\n— Grok grabs Nyssa and throws her across a table\n— table explodes realistically beneath her weight\n— Nyssa rolls across the floor recovering naturally\n— Grok charges heavily, smashing furniture\n— patrons jump away realistically\nNo exaggerated movement, only physically believable combat.\n[00:10-00:12]\nNyssa uses speed and positioning intelligently. She dodges another heavy attack causing Grok to crash into a support beam. Dust and debris fall from the ceiling. She climbs briefly onto the bar counter and leaps down with controlled realistic momentum, locking Grok’s arm and using leverage to throw him off balance.\n[00:12-00:15]\nFinal cinematic climax. Nyssa tackles Grok to the ground hard onto broken wooden debris. The floor shakes from the impact. She pins him down on top of him while holding a blade near his throat. Grok struggles realistically beneath her massive weight difference and exhaustion. Tavern crowd erupts cheering wildly, slamming mugs against tables. Camera slowly pushes inward on Nyssa breathing heavily while sweat, dirt, and candlelight flicker across both fighters.\nAudio:\nHeavy cinematic tavern battle soundtrack with deep drums, loud cheering crowds, breaking wood, metal impacts, realistic body hits, roaring fire ambience, mugs crashing, heavy footsteps, and gritty medieval atmosphere.\nNegative prompts:\nNo floating, no anime combat, no superhero physics, no unrealistic flips, no weightless motion, no blurry characters, no low detail, no cartoon style, no slow reactions, no clipping through objects.","media":{"video":true,"refs":[]},"credit":{"author":"@craftian_keskin","authorUrl":"https://x.com/craftian_keskin","postUrl":"https://x.com/craftian_keskin/status/2082658222247137433"}},{"id":"apim_HB_9MAFl","source":"apimodels","category":"cinematic","title":{"en":"Containment Breach in a Sterile Lab","vi":"Sự cố rò rỉ phòng thí nghiệm vô trùng"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Slow-motion handheld close-up, 16:9. Shaky organic handheld shot shoving in close on a researcher in a pressurized white hazmat suit, faceplate fogged and cracking, stumbling backward across a gleaming sterile lab floor as a glistening mutant creature — too many jointed limbs, translucent skin pulsing with visible organs, a maw that splits wrong-way-wide — lunges from an overturned containment tank, wet strands of tissue trailing through the air behind it. Around him the team scatters in chaos: a woman in a matching suit shoves past his shoulder dragging a fallen colleague by the arm, two men wrestle a heavy steel door against something pushing back from the other side, someone is dragged backward across a workstation beside him, knocking a spray of shattered glassware and spilled reagent vials into the air, more suited figures stumble and scramble through the background past racks of specimen jars cracking under sudden impact. In slow motion glass, fluid, and torn suit fabric explode across the whole frame, droplets and shards suspended everywhere, catching the cold light. Dynamic jostling handheld movement at chest height in the thick of the chaos, camera nearly clipped by a whipping limb. Sterile unreal palette — clinical white, cold surgical blue, sickly bio-luminescent green glow bleeding from the creature's flesh, harsh alarm-red strobing at the edges of frame. All faces anatomically correct behind fogged visors, stable, realistic, genuine terror, no warping. Heavy coarse analog 35mm film grain baked into every frame, thick and consistent, grain crawling over highlights and shadows, like a scanned celluloid film print, never clean, never digital-looking. Flat overhead cleanroom lighting cut through by pulsing red alarm strobes, dramatic slow-motion intensity, cinematic photorealistic, ultra-detailed.","media":{"video":true,"refs":[]},"credit":{"author":"@plasm0","authorUrl":"https://x.com/plasm0","postUrl":"https://x.com/plasm0/status/2082659300090994748"}},{"id":"apim_xfNFgAK_","source":"apimodels","category":"cinematic","title":{"en":"Lightning God at a Shaolin Monastery","vi":"Thần sấm ở chùa Thiếu Lâm"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":null,"inputs":[],"prompt":"Buddhist monastery courtyard at dawn, mist drifting between stone pillars. Wide shot, shallow depth of field: a row of Shaolin priests kneeling in prayer, hands pressed together, saffron and grey robes, heads bowed. Soft ambient temple bells. Background monastery architecture slightly defocused, foreground priest sharply in focus.  Sudden thunderclap. A bolt of lightning crashes down center-frame — the Lightning God lands in a crouch, white kimono and white wide-brimmed hat, faint electricity crackling off the fabric. He rises slowly. Close-up: his eyes ignite, glowing white-blue lightning, no pupils, just arcing current.  He explodes into motion. Fast tracking shot as he closes distance on the first priest, palm strike trailing a lightning arc — priest is zapped, muscles seizing, thrown backward in a shower of sparks.  Quick cut: side angle, second priest lunges with a staff; the god sidesteps in a blur, lightning crackling along his arm, backhands the staff aside and zaps the priest's chest — priest crumples, smoke rising off his robes.  Quick cut: low angle, third priest sweeps a leg; god leaps straight up, hovers a beat with lightning rippling off his kimono hem, then drops down zapping the priest's shoulder.  Fast intercut: downed priests groaning, hands pressing into the ground, pushing themselves back up one by one, robes scorched but eyes determined — they re-engage together, converging on the god from three sides.  Wide shot, all four in frame: priests strike in unison, god pivots between them in a continuous whirl, every block and counter sparking with lightning, his white hat never falling. Camera whip-pans following the fastest exchanges, strobing light flashes matching each hit.  Final beat: god stands center, lightning arcing off him in all directions, breathing storm-light, priests circling back to their feet around him, ready to strike again — freeze on his glowing eyes, thunder rumbling.  Camera: mix of fixed depth-of-field opening shot, fast tracki","media":{"video":true,"refs":[]},"credit":{"author":"@seirdotmk","authorUrl":"https://x.com/seirdotmk","postUrl":"https://x.com/seirdotmk/status/2082718662482411584"}},{"id":"apim_Z2foFW9M","source":"apimodels","category":"animation","title":{"en":"Empty Suit Stop-Motion Assembly","vi":"Stop-motion lắp ráp bộ vest rỗng"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"9:16","durationSec":null,"inputs":[],"prompt":"Static locked-off camera, no zoom, no pan, no handheld drift. The frame never moves.    Open on an empty landscape: flat azure sky, six soft cumulus clouds drifting slowly, a   band of ochre and green eroded hills along the bottom. Nothing else. Hold this for a beat.    Then the composition assembles itself, piece by piece, in surreal stop-motion cadence:    First, a torso rises into frame from the bottom edge: a man in a flecked brown tweed   jacket, white collar, dark tie. It settles and locks.    Above the collar, a vertical column starts growing upward from nothing: dark earth,   roots, dried vegetation and moss, building like soil stacking against gravity.    Chunks fly in from the frame edges and snap into the column with weight: coral and   fungal growths in salmon pink, chartreuse and rust from above; a large blue elephant   head with a visible eye and pale tusks sliding in from the right; branching red vascular   coral whipping in from the right edge.    The face parts land last and land hard: a huge glossy red fleshy mouth with white teeth   locks into the lower half, its trunk-like red tongue curling into a tight loop; a second   inverted red mouth snaps into the upper half.    Final details settle: a brown and orange moth wing unfolds at the upper right, small   pink petal-like slices freeze mid-flight on the left with fine particles suspended   around them, a small blue elephant figure tucks into the crown.    The clouds keep drifting behind and through the structure the entire time, unbothered.    Everything comes to rest in a still, balanced composition. Only the clouds move.    Photoreal 3D render, hyperreal wet organic surfaces, hard midday light, deep saturation,   crisp shadows. Surrealist portrait, Magritte staging. 12 seconds, 5:6 vertical.","media":{"video":true,"refs":[]},"credit":{"author":"@lukasersil","authorUrl":"https://x.com/lukasersil","postUrl":"https://x.com/lukasersil/status/2082727329390854152"}},{"id":"apim_WKzCZnP0","source":"apimodels","category":"motion","title":{"en":"Mumbai monsoon FPV drone flight","vi":"Drone FPV xuyên mùa mưa Mumbai"},"description":{"en":"","vi":""},"mode":"","genMode":"","aspectRatio":"16:9","durationSec":15,"inputs":[],"prompt":"Reference: Use the attached @ Image1  1 as the exact first frame and environment reference. The green drawn line is only the camera flight-path guide. Do not show the green line in the final video.\nCreate a 15-second hyper-real cinematic FPV drone video over Mumbai in heavy monsoon weather, using the same skyline, interchange, sea edge, road geometry, dense buildings, rainy morning atmosphere, grey clouds, and wet surfaces from the reference image. Keep everything realistic and grounded.  The drone must follow the green guideline path as a smooth continuous move: begin near the left side of the interchange, rise and sweep across the middle highway corridor, continue through the right-side city edge, then climb higher into the skyline, perform a tight spiral/orbit near the upper tower cluster, descend back toward the interchange, curve around the large circular loop, and finally glide out toward the lower-right water edge. The move should feel fast, elegant, immersive, and controlled — like a premium FPV drone shot, not a random flyover.\nTIMELINE\n 0:00–0:03 Start low near the left feeder ramp above the wet interchange. Heavy rain falls across the lens. The drone accelerates forward and slightly upward, revealing slick roads, tiny moving traffic, dark sea barriers, and the circular loop ahead.\n0:03–0:06 Follow the path upward across the mid-frame highway corridor. Keep the skyline growing larger. Wet roads shimmer, rain haze softens the distance, and the sea remains visible to the right. Motion is quick but readable.\n0:06–0:09 Sweep along the right-side city edge and climb higher. Dense towers, mid-rise blocks, and dark green patches below feel soaked and monsoon-heavy. The camera begins rising toward the upper skyline.\n0:09–0:11 Reach the upper skyline cluster and perform a tight spiral/orbit around the central high-rises. Storm clouds loom above, rain streaks rush past, and the city beneath feels deep, layered, and cinematic.\n0:11–0:13 Exit the spiral and descend in a smooth arc back toward the interchange. The circular loop becomes dominant again. Maintain realistic drone inertia and readable geography.\n0:13
